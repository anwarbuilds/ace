name: analytics-review
on:
  push:
    branches: ['analytics-rebuild-*']
permissions:
  contents: read
concurrency:
  group: analytics-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fictional_ci
          POSTGRES_PASSWORD: fictional_ci_only
          POSTGRES_DB: ace_analytics_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fictional_ci -d ace_analytics_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: sqlite:////tmp/ace-analytics-fictional.db
      ACE_DEMO_COMPANIES: '1'
      ANALYTICS_TEST_POSTGRES_URL: postgresql+psycopg://fictional_ci:fictional_ci_only@127.0.0.1:5432/ace_analytics_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: web
      - name: Analytics calculations and actual component rendering
        working-directory: web
        run: |
          node --max-old-space-size=256 --test tests/analytics-calculations.test.mjs tests/analytics-rejections-render.test.mjs
          npm run test:inbox
      - name: Complete backend and PostgreSQL snapshot regressions
        run: python -m pytest backend/tests -q --ignore=backend/tests/browser
      - name: TypeScript, full lint and production build
        working-directory: web
        run: |
          npx next typegen
          npx tsc --noEmit
          npx eslint src tests
          npm run build
      - name: Isolated fictional data and local services on the hosted runner
        run: |
          python -m backend.scripts.seed_analytics_demo
          nohup python -m uvicorn backend.app.api.main:app --port 8000 > /tmp/analytics-api.log 2>&1 &
          cd web
          nohup npm run start -- -p 3000 > /tmp/analytics-web.log 2>&1 &
          for i in $(seq 1 60); do if curl -sf http://localhost:3000/login >/dev/null && curl -sf http://localhost:8000/healthz >/dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Hosted browser installation and four-tab visual/interaction verification
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/inbox-review.spec.ts tests/e2e/analytics-redesign.spec.ts
      - name: Retain fictional screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-review
          path: |
            artifacts/analytics-validation/*.png
            artifacts/inbox-intelligence-validation/*.png
            web/test-results/
          retention-days: 14
      - name: Optional encrypted owner-private Overview capture
        if: github.ref == 'refs/heads/analytics-rebuild-overview-week-20261031' || github.ref == 'refs/heads/analytics-rebuild-overview-fullscreen-20261031'
        env:
          ACE_PRIVATE_ANALYTICS_CAPTURE: ${{ secrets.ACE_ANALYTICS_CAPTURE_20261031_C510 }}
        run: node .github/scripts/capture-private-analytics.mjs
      - name: Retain recipient-encrypted private capture
        if: github.ref == 'refs/heads/analytics-rebuild-overview-week-20261031' || github.ref == 'refs/heads/analytics-rebuild-overview-fullscreen-20261031'
        uses: actions/upload-artifact@v4
        with:
          name: analytics-private-encrypted
          path: artifacts/analytics-private-capture.enc
          if-no-files-found: ignore
          retention-days: 1
      - name: Fictional service errors
        if: failure()
        run: tail -n 60 /tmp/analytics-api.log /tmp/analytics-web.log || true
