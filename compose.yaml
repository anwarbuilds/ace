services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${ACE_DB_NAME:-ace}
      POSTGRES_USER: ${ACE_DB_USER:-ace}
      POSTGRES_PASSWORD: ${ACE_DB_PASSWORD:-ace_local_dev}

    ports:
      - "${ACE_DB_PORT:-5433}:5432"

    volumes:
      - ace_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${ACE_DB_USER:-ace} -d ${ACE_DB_NAME:-ace}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  migrate:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${ACE_DB_USER:-ace}:${ACE_DB_PASSWORD:-ace_local_dev}@postgres:5432/${ACE_DB_NAME:-ace}

    command:
      [
        "alembic",
        "upgrade",
        "head",
      ]

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


  scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${ACE_DB_USER:-ace}:${ACE_DB_PASSWORD:-ace_local_dev}@postgres:5432/${ACE_DB_NAME:-ace}

    command:
      [
        "python",
        "-m",
        "backend.scripts.run_scheduler",
        "--log-level",
        "INFO",
      ]

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

    # The scheduler is a loop, not a server, so process liveness proves
    # very little: a crash loop reads as "restarting" and a wedged loop
    # reads as "up". This asks the question that matters, which is
    # whether anything has actually been polled lately.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "backend.scripts.scheduler_health",
        ]
      interval: 5m
      timeout: 30s
      start_period: 3m
      retries: 2



  web:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${ACE_DB_USER:-ace}:${ACE_DB_PASSWORD:-ace_local_dev}@postgres:5432/${ACE_DB_NAME:-ace}

    command:
      [
        "python",
        "-m",
        "uvicorn",
        "backend.app.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

    ports:
      - "${ACE_WEB_PORT:-8000}:8000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped


volumes:
  ace_postgres_data:
