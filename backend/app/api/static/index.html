/* ---------------- pulls page ---------------- */
// Sessions load 30 at a time and the page asks for more explicitly,
// rather than fetching everything up front: on a busy day that is
// dozens of rows the user is very unlikely to scroll to, and the
// history genuinely has no natural end to cap at.
function loadOlderSessions(){
  if(state.loadingOlder||state.sessionsExhausted) return;
  var oldest=state.sessions.length?state.sessions[state.sessions.length-1].started_at:null;
  if(!oldest) return;
  state.loadingOlder=true; render();
  get("/api/sessions",new URLSearchParams({limit:"30",jobs_per_session:"6",before:oldest}))
    .then(function(d){
      var got=d.sessions||[];
      state.sessions=state.sessions.concat(got);
      state.sessionsExhausted=got.length<30;
      state.loadingOlder=false;
      render();
    }).catch(function(){ state.loadingOlder=false; render(); });
}
function pullsPage(){
  var groups=[], last=null;
  state.sessions.forEach(function(s){
    var d=dayName(s.started_at);
    if(d!==last){ groups.push({day:d,rows:[]}); last=d; }
    groups[groups.length-1].rows.push(s);
  });
  var st=state.stats||{};
  var sick=(st.sources_enabled&&st.sources_polled!=null&&st.sources_polled<st.sources_enabled);

  // Every check gets a row, including the ones that found nothing:
  // this is a log, and a log that hides its quiet entries cannot be
  // used to answer "was ACE running at 3am". The jobs a check found
  // sit behind a click, so a day of checks stays one screen.
  // What a pull read as well as what was new in it. "31 postings seen"
  // was read as ACE having looked at 31 postings; it had read 483 boards
  // holding about 63,000, and 31 of those postings were new. Pulls from
  // before the check counts were recorded say only what was new.
  function pullChecked(s){
    var n=s.jobs_discovered||0;
    var fresh=n.toLocaleString()+" new";
    if(!s.boards_checked)
      return n?n.toLocaleString()+" new posting"+(n===1?"":"s"):"nothing new to read";
    return fresh+" \u00b7 "+s.boards_checked.toLocaleString()+" board"+(s.boards_checked===1?"":"s")+
      ", "+(s.postings_checked||0).toLocaleString()+" postings checked";
  }
  function runRow(s){
    var open=state.openPull===s.id;
    var jobs=s.jobs||[];
    var hidden=Math.max(0,s.qualifying_discovered-jobs.length);
    // Expandable only when there is actually something behind it.
    // Keyed on the recorded count alone, a check whose postings have
    // since gone stayed clickable and opened onto nothing -- which is
    // exactly what removing a whole source produced: the count is
    // history and cannot change, but the postings it counted were
    // deleted, so 13 passed expanded to an empty list.
    var hit=s.qualifying_discovered>0&&jobs.length>0;
    // The badge still tells the truth about what the check found at
    // the time, because that did happen.
    var counted=s.qualifying_discovered>0;
    // Three outcomes, not two. "Nothing new" means postings were read
    // and none qualified; "no new postings" means there was nothing to
    // read. Collapsing them hid whether ACE had looked at all.
    var sawNothing=!s.jobs_discovered;
    var label=counted?(s.qualifying_discovered+" passed")
      :(sawNothing?"no new postings":"nothing new");
    // One row per quarter hour, labelled by the window it covers, so
    // the log reads 2:45, 3:00, 3:15 rather than wherever the
    // scheduler happened to wake.
    var span=clock(s.started_at)+
      '<span class="pl-since"> + 15m</span>';
    return '<div class="pl-run'+(counted?" hit":"")+(open?" open":"")+'">'+
      '<button class="pl-row" data-pull="'+s.id+'"'+(hit?'':' disabled')+'>'+
        '<span class="pl-caret">'+(hit?(open?"\u25be":"\u25b8"):"\u00b7")+'</span>'+
        '<span class="pl-time">'+span+'</span>'+
        '<span class="pl-badge'+(counted?" hit":"")+'">'+label+'</span>'+
        '<span class="pl-seen">'+pullChecked(s)+'</span>'+
        '<span class="pl-ago">'+ago(s.finished_at||s.started_at)+'</span>'+
      '</button>'+
      (open?'<div class="pl-jobs">'+
        (jobs.length?'<table class="tbl pl-tbl"><tbody>'+
          jobs.map(function(j){ return jobRow(j); }).join("")+'</tbody></table>':'')+
        '<div class="pl-actions">'+
          (hidden>0?'<button class="link-btn" data-session="'+s.id+'">Show '+hidden+' more in the Queue</button>':
            '<button class="link-btn" data-session="'+s.id+'">Open these in the Queue</button>')+
        '</div></div>':'')+
    '</div>';
  }

  function dayBlock(g){
    var seen=g.rows.reduce(function(a,b){return a+b.jobs_discovered;},0);
    var qual=g.rows.reduce(function(a,b){return a+b.qualifying_discovered;},0);
    return '<section class="pl-day">'+
        '<header class="pl-day-h">'+
          '<h2 class="pl-day-t">'+esc(g.day)+'</h2>'+
          '<span class="pl-day-m">'+g.rows.length+' check'+(g.rows.length===1?"":"s")+'</span>'+
          '<span class="pl-day-m">'+seen.toLocaleString()+' new postings</span>'+
          '<span class="pl-day-m strong">'+qual+' passed your filters</span>'+
        '</header>'+
        '<div class="pl-runs">'+g.rows.map(runRow).join("")+'</div>'+
      '</section>';
  }

  var elapsed=state.lastPoll?ago(state.lastPoll):"";
  var since=!state.lastPoll?"not recorded"
    :(/^just now$/i.test(elapsed)?elapsed:elapsed+" ago");
  function stat(k,v,bad){
    return '<div class="pl-stat"><span class="pl-k">'+esc(k)+'</span>'+
      '<span class="pl-v'+(bad?" bad":"")+'">'+esc(v)+'</span></div>';
  }
  return '<div class="head">'+
    '<div class="head-row"><h1 class="h1">Activity</h1>'+
      '<span class="spacer"></span>'+liveChip()+'</div>'+
    '<div class="controls"><div class="pl-stats">'+
      stat("Last check",since,false)+
      stat("Sources polling",
        (st.sources_polled!=null&&st.sources_enabled)
          ? st.sources_polled+" of "+st.sources_enabled : "unknown", sick)+
      stat("Jobs in queue",
        st.qualifying_active_jobs!=null?st.qualifying_active_jobs.toLocaleString():"-",false)+
      alertsButton()+
    '</div></div></div>'+
    '<div class="scroll"><div class="pl-layout">'+
      '<div class="pl-wrap">'+
        (state.sessions.length
          ? groups.map(dayBlock).join("")+
            (state.sessionsExhausted
              ? '<div class="tail">End of recorded activity</div>'
              : '<button class="link-btn pl-loadmore" data-act="loadoldersessions">'+
                (state.loadingOlder?"Loading…":"Load older activity")+'</button>')
          : box("Nothing recorded yet","ACE records a check once it has looked at its sources."))+
      '</div>'+
      pullsSidebar()+
    '</div></div>';
}

function copyAnswer(id, el){
  var a=state.answers.filter(function(x){return String(x.id)===String(id);})[0];
  if(!a||!a.value) return;
  function done(){
    if(!el) return;
    el.classList.add("done"); el.textContent="copied";
    setTimeout(function(){ el.classList.remove("done"); el.innerHTML=icon(I.copy,14); },1200);
  }
  function fallback(){
    // The async clipboard needs a secure context, which plain http on a
    // LAN address does not get. This path is the one that usually runs.
    var t=document.createElement("textarea");
    t.value=a.value; t.style.position="fixed"; t.style.opacity="0";
    document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); done(); }
    catch(e){ showToast("Could not copy"); }
    document.body.removeChild(t);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(a.value).then(done).catch(fallback);
  } else fallback();
}
// Sections are cosmetic and live here rather than in the database, so

var ANSWER_SECTIONS=[

  ["Background",["Employed by the federal government",

    "Criminal conviction","Bound by a non-compete",
    "Previously employed by this company","Related to an employee here",
    "Employer relationship with this company","Relative owns a competing business"]],
  ["Consent",["Consent to keep my application on file","Agree to the terms shown"]],
  ["Education",["University","Degree","Field of study","GPA","Graduation date",
    "Years of experience","Recent graduate"]],
  ["Logistics",["Earliest start date","How did you hear about us",
    "Preferred contact method","At least 18 years old","Role is located in the US",
    "Willing to relocate","Willing to work onsite","Willing to travel",
    "Driving licence","Needs an accommodation"]],
  ["Voluntary disclosures",["Gender","Race or ethnicity","Veteran status",
    "Disability status","Transgender","Sexual orientation"]],
  ["Written answers",["Salary expectation","Why this company"]]
];
function answerSections(){
  var seen={}, out=[];
  ANSWER_SECTIONS.forEach(function(sec){
    var rows=[];
    sec[1].forEach(function(label){
      state.answers.forEach(function(a){
        if(a.label===label&&!seen[a.id]){ seen[a.id]=1; rows.push(a); }
      });
    });
    if(rows.length) out.push([sec[0],rows]);
  });
  var other=state.answers.filter(function(a){ return !seen[a.id]; });
  if(other.length) out.push(["Other",other]);
  return out;
}

/* One row of the bank, drawn as whatever the question actually is.

   A question with two possible answers is two buttons. A question with
   a known set of answers is that set. Only genuinely open questions get
   a text box. Before this every one of them was a text box, so
   answering "are you at least 18" meant typing the word Yes, and
   answering "how did you hear about us" meant guessing which wording
   some future form would print. */
function answerRow(a){
  var control;

  if(a.kind==="boolean"){
    control='<div class="ans-yn" data-ansyn>'+
      ["Yes","No"].map(function(opt){
        return '<button type="button" data-act="ansyn" data-val="'+opt+'" aria-pressed="'+
          (a.value===opt?"true":"false")+'">'+opt+'</button>';
      }).join("")+
      (a.value?'<button type="button" class="ans-clear" data-act="ansyn" data-val="">Clear</button>':'')+
      '<input type="hidden" class="ans-value" value="'+esc(a.value)+'">'+
    '</div>';
  } else if(a.kind==="choice"){
    // A value the catalogue no longer offers is kept and shown rather
    // than silently dropped to blank: it is still the user's answer.
    var opts=(a.options||[]).slice();
    if(a.value&&opts.indexOf(a.value)<0) opts.push(a.value);
    control='<select class="ans-value" aria-label="'+esc(a.label)+'">'+
      '<option value=""'+(a.value?"":" selected")+'>Not answered</option>'+
      opts.map(function(opt){
        return '<option value="'+esc(opt)+'"'+(a.value===opt?" selected":"")+'>'+esc(opt)+'</option>';
      }).join("")+'</select>';
  } else {
    control='<textarea class="ans-value" placeholder="Your answer" aria-label="Answer">'+
      esc(a.value)+'</textarea>';
  }

  var name=a.known
    ? '<div class="ans-name">'+esc(a.label)+
      '<input type="hidden" class="ans-label" value="'+esc(a.label)+'"></div>'
    : '<input type="text" class="ans-label" value="'+esc(a.label)+
      '" placeholder="Question" aria-label="Question">';

  return '<div class="ans-edit">'+name+
    '<div>'+control+(a.hint?'<div class="ans-hint">'+esc(a.hint)+'</div>':'')+'</div>'+
    '<button class="iconbtn" data-act="delrow" aria-label="Remove this question">'+icon(I.x)+'</button>'+
  '</div>';
}
var ACE_MONTH_NAMES=["January","February","March","April","May","June",
  "July","August","September","October","November","December"];

/* One repeating block: a job or a degree.

   These cannot live in the answer bank, and the reason is structural
   rather than a missing question. The bank is one value per question,
   so "what is your employer" has one answer; a form's second block
   asks the same question and needs a different job. */
function historyBlock(kind, entry, index){
  var isWork=kind==="work";
  function monthSelect(cls,val){
    return '<select class="'+cls+'"><option value="">Month</option>'+
      ACE_MONTH_NAMES.map(function(m,i){

      }).join("")+'</select>';
  }
  function yearSelect(cls,val){
    var out='<select class="'+cls+'"><option value="">Year</option>';
    for(var y=2036;y>=1990;y--){
      out+='<option value="'+y+'"'+(Number(val)===y?" selected":"")+'>'+y+'</option>';
    }
    return out+'</select>';
  }
  return '<div class="hist" data-hist="'+kind+'">'+
    '<div class="hist-foot" style="margin:0 0 10px"><span class="hist-n">'+
      (isWork?"Job ":"Study ")+(index+1)+'</span>'+
      '<span class="spacer" style="flex:1"></span>'+
      '<button class="iconbtn" data-act="delhist" aria-label="Remove this entry">'+icon(I.x)+'</button>'+
    '</div>'+
    '<div class="hist-grid">'+
      '<div><label>'+(isWork?"Employer":"School")+'</label>'+
        '<input class="h-employer" value="'+esc(entry.employer||"")+'"></div>'+
      '<div><label>'+(isWork?"Job title":"Degree")+'</label>'+
        '<input class="h-title" value="'+esc(entry.job_title||"")+'"></div>'+
      '<div><label>Location</label>'+
        '<input class="h-location" value="'+esc(entry.location||"")+'"></div>'+
      '<div><label>'+(isWork?"Still working here":"Still studying here")+'</label>'+
        '<div class="ans-yn" data-ansyn>'+
          ["Yes","No"].map(function(opt){
            var on=(opt==="Yes")===!!entry.is_current;
            return '<button type="button" data-act="ansyn" data-val="'+opt+'" aria-pressed="'+
              (on?"true":"false")+'">'+opt+'</button>';
          }).join("")+
          '<input type="hidden" class="h-current ans-value" value="'+
            (entry.is_current?"Yes":"No")+'"></div></div>'+
    '</div>'+
    '<div class="hist-dates">'+
      '<div><label>Start month</label>'+monthSelect("h-sm",entry.start_month)+'</div>'+
      '<div><label>Start year</label>'+yearSelect("h-sy",entry.start_year)+'</div>'+
      '<div><label>End month</label>'+monthSelect("h-em",entry.end_month)+'</div>'+
      '<div><label>End year</label>'+yearSelect("h-ey",entry.end_year)+'</div>'+
    '</div>'+
    '<div class="hist-wide"><label style="display:block;font-size:11px;color:var(--text-muted);margin-bottom:4px">'+
      'Description</label>'+
      '<textarea class="h-description" placeholder="What you did there. Pasted once, filled every time.">'+
      esc(entry.description||"")+'</textarea></div>'+
  '</div>';
}

function historySection(kind){
  var entries=(kind==="work"?state.work:state.education)||[];
  var title=kind==="work"?"Work history":"Education";
  return '<div class="ans-sec">'+title+'</div>'+
    '<div id="hist-'+kind+'">'+

function collectHistory(kind){
  var box=document.getElementById("hist-"+kind);

  return Array.prototype.map.call(box.querySelectorAll(".hist"),function(row){
    function val(cls){ var el=row.querySelector(cls); return el?el.value:""; }

/* Coverage: what ACE cannot see, and the box that fixes one.

   The two belong on the same page. A Cursor posting was found by hand
   because nothing anywhere said "there are companies you cannot see",
   and a number with no way to act on it would be only half the
   lesson. */
/* Employers whose own postings refuse sponsorship.

   Not a gap in what ACE can see -- these boards are read perfectly --
   but a gap in what the user can apply to, and it was invisible. The
   rule runs per posting, so the same refusal was found again on every
   job of every poll and never once stated: 793 Visa postings rejected
   one at a time, with nothing anywhere saying "Visa does not sponsor".

   Shown as a ratio, never as a verdict. "Every one of 58" and "212 of
   443" are different facts and only the first is a policy; claiming a
   blanket refusal from a half-and-half board would talk the user out
   of jobs they could actually take. */
function coverageSponsorship(rows){
  if(!rows||!rows.length) return "";
  var total=rows.reduce(function(n,r){ return n+r.refusing; },0);
  var all=rows.filter(function(r){ return r.share>=1; });
  return '<div class="ans-sec">Will not sponsor ('+rows.length+')</div>'+
    '<p class="why" style="max-width:74ch">These employers state on their own postings that '+
      'they will not sponsor a work visa, which rules you out. ACE already rejects each of '+
      'these jobs; this is the same fact said once instead of '+total+' times. '+
      (all.length
        ? '<b>'+all.length+'</b> refuse on every readable posting, so nothing they open is worth '+
          'your time unless the policy changes.'
        : '')+'</p>'+
    '<div class="cov-grid cov-sponsor">'+
      rows.map(function(r){
        var pct=Math.round(r.share*100);
        return '<div class="cov-row'+(r.share>=1?" cov-row-all":"")+'" title="'+
          esc(r.refusing+' of '+r.readable+' readable postings say no sponsorship')+'">'+
          '<span class="cov-name">'+esc(r.company)+'</span>'+
          '<span class="cov-n">'+r.refusing+' of '+r.readable+'</span>'+
          '<span class="cov-pct">'+pct+'%</span></div>';
      }).join("")+
    '</div>';
}
/* Boards ACE polls that have stopped answering. Postman's had been gone
   seventeen days, and three companies had moved to Ashby, before anyone
   noticed -- their old postings still looked active, so they counted as
   reached. Every six hours ACE looks for where each company went and
   switches over by itself; what is listed here is what it could not
   resolve. */
function coverageDark(rows){
  if(!rows||!rows.length) return "";
  return '<div class="ans-sec">Stopped answering ('+rows.length+')</div>'+
    '<p class="why" style="max-width:74ch">ACE polls these boards but has had no answer for a day '+
      'or more, so anything new they post is not reaching you. Every six hours ACE looks for where '+
      'each company has moved and switches over by itself when it finds the new board; these are '+
      'the ones it has not found yet.</p>'+
    '<div class="cov-grid cov-dark">'+
      rows.map(function(r){
        return '<div class="cov-row" title="'+esc(r.source_type+" / "+r.source_account)+'">'+
          '<span class="cov-name">'+esc(r.company)+'</span>'+
          '<span class="cov-n">'+esc(r.source_type)+'</span>'+
          '<span class="cov-pct">'+(r.last_success_at
            ? 'since '+esc(shortDate(r.last_success_at))
            : 'never answered')+'</span></div>';
      }).join("")+
    '</div>';
}
/* ACE's own account of its misses, so a late catch is found by the page
   rather than by the user. A role a feed listed before ACE saw it on the
   employer's board, with why; and the companies ACE still reads only
   through a feed. */
function coverageLate(r){
  if(!r||!r.count) return "";
  return '<div class="ans-sec">Caught late ('+r.count+' in 14 days)</div>'+
    '<p class="why" style="max-width:74ch">Roles that passed your filters but reached a curated feed '+
      'before ACE saw them on the employer’s own board. <b>'+r.board_added_later+'</b> were on a board '+
      'ACE only started reading after the feed listed them; ACE now registers the boards feed links '+
      'name every half hour, so these should stop. <b>'+r.seen_late+'</b> were on a board ACE was '+
      'already reading and saw late; those are ACE’s mistakes to fix.'+
      (r.republished?' <b>'+r.republished+'</b> were republished by the employer after the feed '+
        'listed them, and ACE read them within half an hour, so they are not misses.':'')+'</p>'+
    '<div class="cov-grid cov-late">'+
      r.rows.map(function(x){
        return '<div class="cov-row" title="'+esc(x.cause)+'">'+
          '<span class="cov-name">'+esc(x.company)+', '+esc(clean(x.title))+'</span>'+
          '<span class="cov-n">'+esc(x.cause===LATE_BOARD_ADDED?"board added late"
            :(x.cause===LATE_REPUBLISHED?"republished":"seen late"))+'</span>'+
          '<span class="cov-pct">'+x.lag_hours+' h</span></div>';
      }).join("")+
    '</div>';
}
var LATE_BOARD_ADDED="board added after the feed listed it";
var LATE_REPUBLISHED="republished after the feed listed it";
function coverageFeedOnly(rows){
  if(!rows||!rows.length) return "";
  var total=rows.reduce(function(n,r){ return n+r.passing; },0);

    '<div class="cov-grid cov-feedonly">'+

        return '<div class="cov-row">'+
          '<span class="cov-name">'+esc(r.company)+'</span>'+

function coveragePage(){

      '<div class="ans-sec">Add a company</div>'+

        '<input id="cov-input" type="text" spellcheck="false" '+

/* What is in the way, grouped by what would fix it.
   A flat list of names was a wall: 154 of them, nothing to act on, and
   no way to tell a company that has genuinely moved somewhere ACE
   cannot read from one ACE was failing to look for properly. Most of
   that list turned out to be the second kind. */
var COV_GROUPS=[
  ["other_ats","Hire through an ATS ACE cannot read yet",
   "Each needs an adapter. The name says which one, so the work is countable rather than open-ended."],
  ["no_board_found","Publish no board ACE recognises",
   "Usually a careers page that builds itself in the browser, or hiring software run in-house."],
  ["no_postings","Readable, but nothing posted right now",
   "ACE found and checked the board. There is simply nothing on it today."],
  ["refused","Found a board, refused to trust it",
   "The board named a different company. A board under the wrong name is harder to notice than a gap, so it was left alone."],
  ["blocked","Refuse automated access",
   "Their site answers and turns ACE away. That is deliberate on their side and is respected rather than worked around, so these have to be found by hand. No adapter would change it."],
  ["site_unreachable","No website answered",
   "The company may trade under another name. Pasting their careers link above fixes these outright."],
  ["unprobed","Not looked at yet",
   "Run the coverage probe to find out."]
];
function coverageGaps(rows){
  if(!rows||!rows.length) return '<div class="ans-sec">Cannot reach (0)</div>'+
    '<p class="why">ACE reaches every company on your list.</p>';
  var by={};
  rows.forEach(function(r){ (by[r.outcome]=by[r.outcome]||[]).push(r); });
  var out='<div class="ans-sec">Cannot reach ('+rows.length+')</div>';
  COV_GROUPS.forEach(function(g){
    var group=by[g[0]]; if(!group) return;
    delete by[g[0]];
    out+='<div class="cov-group"><div class="cov-group-h">'+esc(g[1])+
      ' <span class="cov-group-n">'+group.length+'</span></div>'+
      '<p class="why" style="margin:0 0 8px">'+esc(g[2])+'</p>'+
      '<div class="cov-names">'+group.map(covName).join("")+'</div></div>';
  });
  Object.keys(by).forEach(function(k){
    out+='<div class="cov-group"><div class="cov-group-h">'+esc(k)+
      ' <span class="cov-group-n">'+by[k].length+'</span></div>'+
      '<div class="cov-names">'+by[k].map(covName).join("")+'</div></div>';
  });
  return out;
}
function covName(r){
  return '<span class="cov-name" title="'+esc(r.detail||"")+'">'+esc(r.company)+'</span>';
}
function addSource(){
  var box=document.getElementById("cov-input");
  var text=box?box.value.trim():"";
  if(!text){ state.coverageMsg="Paste a link or a company name first."; state.coverageMsgKind="warn"; render(); return; }
  state.coverageInput=text;
  state.coverageMsg="Looking for a board at "+text+"…";
  state.coverageMsgKind="";
  render();
  fetch(API+"/api/sources",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text:text})})
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.status==="added"){
      state.coverageMsg="Now watching "+d.company+" on "+d.source_type+"/"+d.source_account+
        ", "+d.job_count+" postings. Verified: "+d.evidence+". Its jobs appear within a few minutes.";
      state.coverageMsgKind="ok";
      state.coverageInput="";
    } else if(d.status==="already_known"){
      state.coverageMsg="ACE already watches "+(d.company||d.source_account)+".";
      state.coverageMsgKind="";
      state.coverageInput="";
    } else {
      state.coverageMsg=d.detail||"No board ACE can read was found there.";
      state.coverageMsgKind="warn";
    }
    return get("/api/coverage");
  })
  .then(function(d){ state.coverage=d; render(); })
  .catch(function(){ state.coverageMsg="Could not reach ACE."; state.coverageMsgKind="warn"; render(); });
}
function answersPage(){
  var rows=state.answers.length?state.answers:[{id:"new0",label:"",value:""}];
  return '<div class="head"><div class="head-row"><h1 class="h1">Answers</h1>'+

      '<span class="spacer"></span>'+liveChip()+'</div></div>'+
    '<div class="page"><div class="wrap">'+
      '<p class="why" style="max-width:70ch;margin-bottom:22px">'+
        'The things every application form asks for. Answer them once and the extension fills '+
        'them wherever they come up, however that form happens to word them. ACE knows that '+
        'a job board and a job portal are the same thing, so you pick the answer, not the wording. '+
        'Leave blank anything you would rather answer by hand, and add your own questions at the end.</p>'+
      // Headings sit inside the one form container, so saving still

      '<div id="ansform">'+(state.answers.length
        ? answerSections().map(function(sec){

function collectAnswers(){
  return Array.prototype.map.call(document.querySelectorAll(".ans-edit"),function(row){
    return {label:row.querySelector(".ans-label").value,
            value:row.querySelector(".ans-value").value};
  }).filter(function(a){ return a.label.trim(); });
}
function putJson(path, body){
  return fetch(API+path,{method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)}).then(function(r){
      if(!r.ok) throw new Error(path); return r.json();
    });

/* One button for all three, because they are one page and a partial
   save would leave the user guessing which half landed. */
function saveAnswers(){
  Promise.all([
    putJson("/api/answers",{items:collectAnswers()}),
    putJson("/api/history/work",{items:collectHistory("work")}),
    putJson("/api/history/education",{items:collectHistory("education")})
  ])
  .then(function(){
    return Promise.all([
      get("/api/answers"), get("/api/history/work"), get("/api/history/education")
    ]);
  })
  .then(function(all){
    state.answers=all[0].items||[];
    state.work=all[1].items||[];
    state.education=all[2].items||[];
    showToast("Saved");
    render();
  })
  .catch(function(){ showToast("Could not save"); render(); });
}

/* ---------------- render ---------------- */
/* Where the list was, kept across redraws.

   Every redraw rebuilds the scrolling panel, and a rebuilt panel starts
   at the top: marking a job applied, a toast, the two-minute refresh,
   coming back from a job page -- each threw the user back to row one
   and they scrolled down again, every time. The position is now kept on
   any redraw of the same page and view, and remembered per page and
   view, so coming back to one returns to where it was left. A filter or
   sort change still starts at the top on its own: the list empties
   while it reloads, and an empty list has nowhere else to be. */
var scrollMemory={}, renderedKey=null, restoreTo=null;
function viewKey(){
  return state.page==="job" ? "job:"+state.jobId : state.page+":"+(state.view||"");
}
function render(keepScroll){
  var app=document.getElementById("app");
  var old=document.querySelector(".scroll");
  // Not while a return is still waiting for its rows: the empty panel's
  // zero would overwrite the place being returned to.
  if(old && renderedKey && !(restoreTo && restoreTo.key===renderedKey)){
    scrollMemory[renderedKey]=old.scrollTop;
  }
  var key=viewKey();
  if(key!==renderedKey){
    restoreTo=scrollMemory[key]!=null ? {key:key, top:scrollMemory[key]} : null;
  }
  var prior=(old && key===renderedKey) ? old.scrollTop : null;
  // The search box is the one control that can be mid-word when a
  // render lands on it, and this redraw is innerHTML: it destroys the
  // element the user is typing into.
  //
  // Focus used to be put back a whole network round-trip later, from a
  // caret position captured before the request went out. Type one more
  // letter while that request is in flight and the caret is restored
  // behind it, into the middle of the word -- which is what "it will
  // not let me finish the word" was. Anything typed in the gap landed
  // on <body> and was lost outright.
  //
  // Captured live, here, and put back in the same tick as the write.
  var focused=document.activeElement;
  var caret=focused&&focused.id==="q"
    ? {value:focused.value,start:focused.selectionStart,end:focused.selectionEnd}
    : null;
  var main;
  if(state.page==="job") main=jobPage();
  else if(state.page==="pulls") main=pullsPage();
  else if(state.page==="resumes") main=resumePage();
  else if(state.page==="skills") main=skillsPage();
  else if(state.page==="settings") main=settingsPage();
  else if(state.page==="answers") main=answersPage();
  else if(state.page==="coverage") main=coveragePage();
  else main=queuePage();

  app.innerHTML=sidebar()+
    '<div class="main">'+
      '<div class="topbar"><button class="iconbtn" data-act="menu" aria-label="Menu">'+icon(I.menu)+'</button>'+
      '<span class="brand-name" style="font-size:18px">ace</span>'+
      '<span class="spacer"></span><button class="iconbtn" data-act="palette" aria-label="Search">'+icon(I.search)+'</button></div>'+
      main+'</div>'+
    (state.menuOpen?'<div class="scrim" data-act="closemenu"></div>':"")+
    answerToggle()+answerPanel()+
    (state.toast||"");

  if(caret){
    var box=document.getElementById("q");
    if(box){
      box.value=caret.value;
      box.focus({preventScroll:true});
      try{ box.setSelectionRange(caret.start,caret.end); }catch(err){}
    }
  }

  var sc=document.querySelector(".scroll");
  if(sc){
    if(restoreTo && restoreTo.key===key){
      var room=sc.scrollHeight-sc.clientHeight;
      // Applied once the rows are there to scroll through; until then
      // the empty panel would clamp it to the top.
      if(room>=restoreTo.top || !state.loading){
        sc.scrollTop=Math.min(restoreTo.top, Math.max(room,0));
        restoreTo=null;
      }
    } else if(prior!=null) sc.scrollTop=prior;
    sc.addEventListener("scroll",onScroll,{passive:true});
  }
  renderedKey=key;
  syncTabs();
  var sel=document.querySelector('.row[aria-selected="true"]');
  if(sel&&state.scrollTo){ sel.scrollIntoView({block:"nearest"}); state.scrollTo=false; }
}
/* The view tabs share one pill that slides to the chosen tab. The bar is
   redrawn on every render, so the pill starts where it was last drawn
   and moves from there. */
var tabMemo=null;
function syncTabs(){
  var bar=document.querySelector(".tabs.has-ind");
  if(!bar){ tabMemo=null; return; }
  var ind=bar.querySelector(".tab-ind"), on=bar.querySelector('.tab[aria-selected="true"]');
  if(!ind||!on) return;
  var x=on.offsetLeft, w=on.offsetWidth;
  if(tabMemo&&(tabMemo.x!==x||tabMemo.w!==w)){
    ind.style.transition="none";
    ind.style.transform="translateX("+tabMemo.x+"px)"; ind.style.width=tabMemo.w+"px";
    void ind.offsetWidth;
    ind.style.transition="";
  }
  ind.style.transform="translateX("+x+"px)"; ind.style.width=w+"px";
  tabMemo={x:x,w:w};
}

/* A role passed with an export-control caveat: the posting mentions
   export control without saying the employer will seek a licence, and
   without demanding US-person status outright. Shown, not hidden -- the
   user decides -- but never silently. */
var EXPORT_NOTE="May require U.S.-person status for export control; the posting does not say the employer will seek a licence. Check before applying.";
function exportCaveat(j){
  return (j.reasons||[]).some(function(r){ return /^Export control:/.test(r); });
}
function isJobList(){ return ["queue","saved","applied","archive"].indexOf(state.page)>=0; }
/* Back from a job page to the list it was opened from, as it was left:
   the same rows, the same place in them, the same row selected. Going
   back reloaded the list, which emptied it to its first page, so a role
   found three pages down could not be returned to and the user scrolled
   down again after every application. A mark made on the job page is
   already on the row: applyMark updates every copy. */
function goBack(){
  var page=state.returnTo||"queue";
  if(location.hash) location.hash="";
  state.page=page; state.menuOpen=false; closePop();
  if(!isJobList()){ render(); return; }
  if(state.items.length) render(); else loadJobs();
}
function goTo(page,view){
  state.pinned=null; state.heldRow=null;
  if(location.hash) location.hash="";
  state.page=page; state.menuOpen=false; state.selectedId=null; closePop();
  if(view){ state.view=view; if(view==="new"||view==="latest") state.sorts=["newest"]; }
  if(isJobList()) loadJobs(); else render();
}
function setPage(p){ goTo(p); }
function openJob(id, opts){
  var j=jobById(id);
  if(!(opts&&opts.fromHash)) state.returnTo=state.page;
  state.detailJob=j||null;
  state.page="job"; state.jobId=id; closePop();
  // The address bar has to carry the job, or opening the link in a new
  // tab lands on the queue and the href is a lie.
  if(location.hash!=="#job/"+id) location.hash="#job/"+id;
  render();
  if(!j){
    // Opened directly, without the list it came from.
    get("/api/jobs/"+id).then(function(d){
      if(state.page==="job"&&state.jobId===id){ state.detailJob=d; render(); }
    }).catch(function(){
      if(state.page==="job"&&state.jobId===id){
        state.detailJob=null; showToast("That opportunity could not be loaded"); render();
      }
    });
  }
  window.scrollTo(0,0);
}
function routeFromHash(){
  var m=/^#job\/(\d+)$/.exec(location.hash||"");
  if(m){ openJob(parseInt(m[1],10),{fromHash:true}); return true; }
  return false;
}
// The ids a person can actually see, in the order the table shows
// them. Keyboard navigation used to walk state.items directly, so
// pressing "next" could select a job hidden inside a collapsed group:
// the highlight and scroll had no row to land on, and it looked like
// the key did nothing.
function visibleItemIds(){
  if(state.page!=="queue") return state.items.map(function(j){return j.id;});
  var groups=jobGroups(), rendered={}, ids=[];
  state.items.forEach(function(j){
    var key=jobGroupKey(j), members=groups[key];
    if(!members||members.length<GROUP_MIN){ ids.push(j.id); return; }
    if(rendered[key]) return;
    rendered[key]=true;
    if(state.expandedGroups[key]) members.forEach(function(m){ ids.push(m.id); });
    else ids.push(groupRepresentative(members).id);
  });
  return ids;
}
function step(d){
  var ids=visibleItemIds();
  var i=ids.indexOf(state.selectedId);
  var n=Math.max(0,Math.min(ids.length-1,(i<0?0:i+d)));
  if(ids[n]!=null){ state.selectedId=ids[n]; state.scrollTo=true; render(); }
}
function toggleSort(key){
  var i=state.sorts.indexOf(key);
  if(i>=0){
    state.sorts.splice(i,1);
  } else {
    // Turning a sort on makes it the primary one, the way clicking a
    // column header does. Appending it instead put "Not applied first"
    // third, where it only broke ties and looked broken.
    state.sorts.unshift(key);
    if(state.sorts.length>3) state.sorts.pop();
  }
  loadJobs();
}
function toggleExclude(name){
  var i=state.excluded.indexOf(name);
  if(i>=0) state.excluded.splice(i,1); else state.excluded.push(name);
  loadShell().then(function(){ loadJobs(); });
}
function toggleTier(t){
  var i=state.tiers.indexOf(t);
  if(i>=0) state.tiers.splice(i,1); else state.tiers.push(t);
  loadShell().then(function(){ loadJobs(); });
}

function closePop(){ var p=document.querySelector(".pop"); if(p) p.remove(); }
function openPop(anchor,html){
  closePop();
  var d=document.createElement("div"); d.className="pop"; d.innerHTML=html;
  document.body.appendChild(d);
  var r=anchor.getBoundingClientRect(), w=d.offsetWidth, h=d.offsetHeight;
  var vw=window.innerWidth||document.documentElement.clientWidth;
  var vh=window.innerHeight||document.documentElement.clientHeight;
  d.style.left=Math.max(8,Math.min(vw-w-8,r.left))+"px";

function sortMorePop(a){
  openPop(a,'<h4>Sort by</h4><p>Sorts combine. The number shows the order they apply in.</p><div class="pop-list">'+
    SORTS.map(function(o){

      return '<button class="pop-opt'+(i>=0?" on":"")+'" data-sort="'+o[0]+'">'+o[1]+
        (i>=0?'<span class="n">'+(i+1)+'</span>':'')+'</button>';
    }).join("")+'</div>');
}
// Shown per group before searching. The corpus carries several hundred
// companies and keeps growing, so a flat list is unreadable and a
// truncated one hides the company you are actually looking for. Search
// is what makes the rest reachable.
var FILTER_PREVIEW=8;
function filterPopBody(){
  var f=state.facets, q=(state.filterQuery||"").trim().toLowerCase();
  function hit(o){ return !q||String(o.value).toLowerCase().indexOf(q)>=0; }
  // A count of what is hidden is not an instruction. Written as a line
  // of text it reads as something to tap, and tapping did nothing, so
  // it is a button that opens the group it is counting.
  function tail(key,n){
    return n>0
      ? '<button class="pop-more" data-expand="'+key+'">Show '+n+' more</button>'
      : "";
  }
  // Expanding a group, or searching it, asks for the whole thing, so
  // the whole thing is what renders. This used to cap at 300, which is
  // the .pop-list max-height in *pixels* and never was a count of
  // anything. Once the corpus passed 303 companies the last three --
  // alphabetically last, so exactly the ones you scroll to find --
  // vanished from a list headed "Show 303 more". The list scrolls
  // inside a fixed-height box, so its length costs nothing to bound.
  function cut(key,list){
    if(q||state.filterOpen[key]) return list;
    return list.slice(0,FILTER_PREVIEW);
  }
  function rest(key,list){
    return (q||state.filterOpen[key])?0:list.length-FILTER_PREVIEW;
  }
  // Sources and families are stored as SOFTWARE_ENGINEERING and read
  // better folded down. Company names are already written the way their
  // company writes them, so folding those loses real information.
  function grp(t,list,param,fold){
    list=(list||[]).filter(hit);
    if(!list.length) return "";
    return '<div class="pop-group">'+t+'</div>'+
      cut(param,list).map(function(o){
        var label=fold?String(o.value).replace(/_/g," ").toLowerCase():String(o.value);
        return '<button class="pop-opt" data-addfilter="'+param+'" data-value="'+esc(o.value)+'">'+
          esc(label)+'<span class="n">'+o.count+'</span></button>';}).join("")+
      tail(param,rest(param,list));
  }
  // Companies get both directions. "Only Amazon" and "everything except
  // Amazon" are both worth wanting, often at the same time.
  var ex=(f.companies||[]).filter(hit);
  var exGroup=ex.length
    ? '<div class="pop-group">Hide a company</div>'+
      cut("exclude",ex).map(function(o){
        var off=state.excluded.indexOf(o.value)>=0;
        return '<button class="pop-opt'+(off?" on":"")+'" data-exclude="'+esc(o.value)+'">'+
          icon(I.minus,13)+esc(o.value)+'<span class="n">'+o.count+'</span></button>';}).join("")+
      tail("exclude",rest("exclude",ex))
    : "";
  var body=(q?"":'<div class="pop-group">Quick</div>'+
      '<button class="pop-opt" data-addflag="verified_only">Description available</button>')+
    grp("Only this company",f.companies,"company",false)+exGroup+
    grp("Source",f.sources,"source",true)+grp("Role family",f.families,"family",true);
  return body||'<div class="pop-note">Nothing matches that.</div>';
}
function filterPop(a){
  state.filterQuery=""; state.filterOpen={};
  var d=openPop(a,'<h4>Add a filter</h4>'+
    '<input class="pop-search" id="filter-q" placeholder="Search companies and sources" '+
      'autocomplete="off" aria-label="Search filters">'+
    '<div class="pop-list">'+filterPopBody()+'</div>');
  var inp=d.querySelector("#filter-q");
  inp.addEventListener("input",function(){
    state.filterQuery=inp.value;
    var list=d.querySelector(".pop-list");
    // Only the list is redrawn, so the caret stays where it was typed.
    if(list) list.innerHTML=filterPopBody();
  });
  inp.focus();
}
function livePop(a){
  var l=state.sessions[0], stale=isStale();
  openPop(a,'<h4>'+(stale?"ACE is not updating":"Discovery status")+'</h4>'+
    '<p>Last pull '+(state.lastPoll?clock(state.lastPoll)+", "+ago(state.lastPoll)+" ago":"not recorded")+'.</p>'+
    (stale
      ?'<p>ACE polls every few minutes, so a gap this long means the scheduler has stopped. Everything already found is still here.</p>'+
       '<p>On the machine running ACE: <b>docker compose ps</b>, then <b>docker compose up -d scheduler</b>.</p>'
      :(l?'<p>Most recent check: '+l.jobs_discovered+' found, '+
          l.qualifying_discovered+' passed your filters.</p>':'')+
       '<p>'+state.sessions.length+' checks recorded. A quiet stretch is one entry whose '+
       'span keeps growing, because ACE completes a cycle every few seconds.</p>'));
}
function scorePop(a){

    '<p>It helps you decide what to read first. It does not predict whether you will be hired.</p>');

/* ---------------- events ---------------- */
document.addEventListener("click",function(e){
  var pal=e.target.closest("[data-pal]");
  if(pal){ runPalette(parseInt(pal.dataset.pal,10)); return; }
  var cp=e.target.closest("[data-copy]");
  if(cp){ copyAnswer(cp.dataset.copy, cp); return; }

  var t=e.target.closest("[data-nav],[data-view],[data-act],[data-mark],[data-status],[data-open],[data-sort],[data-tier],"+
    "[data-exclude],[data-unexclude],[data-unfilter],[data-addfilter],[data-addflag],[data-session],[data-skillq],"+
    "[data-pull],"+
    "[data-expand],"+
    "[data-settheme],[data-gapfam],[data-gapmin],.row");

  if(d.status){ e.stopPropagation(); setStatus(parseInt(d.id,10),d.status); return; }
  if(d.unfilter){ delete state.filters[d.unfilter]; loadShell().then(function(){ loadJobs(); }); return; }
  if(d.addfilter){ state.filters[d.addfilter+":"+d.value]={param:d.addfilter,value:d.value,type:"value",

  if(d.addflag){ state.filters[d.addflag]={param:d.addflag,type:"flag",label:"Description available"};
      closePop(); loadShell().then(function(){ loadJobs(); }); return; }

      var i=state.sessions.map(function(s){return s.id;}).indexOf(sid);
      if(i>0){ var p=state.sessions[i]; state.sessions=[p].concat(state.sessions.filter(function(s){return s.id!==sid;})); }

  if(d.gapfam!==undefined){ state.gapFamily=d.gapfam; reloadGap(); return; }
  if(d.gapmin!==undefined){ state.gapMin=d.gapmin?parseInt(d.gapmin,10):null; reloadGap(); return; }

  if(d.act){

    if(d.act==="delrow"){ var r=t.closest(".ans-edit"); if(r) r.remove(); return; }
    if(d.act==="addsource"){ addSource(); return; }
    if(d.act==="alerts"){ enableAlerts(); return; }
    if(d.act==="delhist"){ var h=t.closest(".hist"); if(h) h.remove(); return; }
    if(d.act==="addhist"){

      var picked=t.getAttribute("data-val");

        b.setAttribute("aria-pressed", b.getAttribute("data-val")===picked&&picked?"true":"false");

      box.querySelector(".ans-value").value=picked;
      var clear=box.querySelector(".ans-clear");
      if(picked&&!clear){
        var c=document.createElement("button");
        c.type="button"; c.className="ans-clear";
        c.setAttribute("data-act","ansyn"); c.setAttribute("data-val","");
        c.textContent="Clear";
        box.insertBefore(c, box.querySelector(".ans-value"));
      } else if(!picked&&clear){ clear.remove(); }
      return;
    }
    if(d.act==="menu"){ state.menuOpen=true; render(); return; }
    if(d.act==="closemenu"){ state.menuOpen=false; render(); return; }
    if(d.act==="undo"){ if(state.undoFn) state.undoFn(); state.toast=null; render(); return; }
    if(d.act==="upload"){ pickResume(); return; }
  }
  var row=e.target.closest(".row");
  if(row&&row.dataset.id){ openJob(parseInt(row.dataset.id,10)); }
});

document.addEventListener("input",function(e){
  if(e.target.id==="q"){
    state.q=e.target.value;
    clearTimeout(state.qt);
    // render() now carries the caret across the redraw, so there is
    // nothing to capture here and nothing to put back afterwards.
    // Doing it from out here was the bug: by the time the response
    // landed, the position was already stale.
    //
    // 350ms rather than 260: long enough that typing a word straight
    // through costs one request instead of one per pause inside it.
    state.qt=setTimeout(function(){ loadJobs(false,true); },350);
  }
});

document.addEventListener("keydown",function(e){
  var typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if((e.metaKey||e.ctrlKey)&&(e.key==="k"||e.key==="K")){ e.preventDefault(); openPalette(); return; }
  if(state.palHits){
    if(e.key==="ArrowDown"){ e.preventDefault(); state.palIndex=Math.min(state.palHits.length-1,state.palIndex+1); drawPalette(document.getElementById("pal-q").value); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); state.palIndex=Math.max(0,state.palIndex-1); drawPalette(document.getElementById("pal-q").value); return; }
    if(e.key==="Enter"){ e.preventDefault(); runPalette(state.palIndex); return; }
    if(e.key==="Escape"){ e.preventDefault(); closePalette(); return; }
  }
  if(e.key==="/"&&!typing){ e.preventDefault(); var q=document.getElementById("q"); if(q) q.focus(); return; }
  if(typing){ if(e.key==="Escape") e.target.blur(); return; }
  if(e.key==="Escape"){
    if(state.answersOpen){ state.answersOpen=false; render(); return; }
    if(state.menuOpen){ state.menuOpen=false; render(); return; }
    if(document.querySelector(".pop")){ closePop(); return; }
    if(state.page==="job"){ goBack(); return; }
    return;
  }
  if(state.page==="job"&&state.detailJob){
    var j=state.detailJob;
    if(e.key==="Enter"){ window.open(j.official_url,"_blank","noopener"); }
    else if(e.key==="s"){ mark(j.id,"saved",false); }
    return;
  }
  if(!isJobList()) return;
  var k=e.key;
  if(k==="ArrowDown"||k==="j"){ e.preventDefault(); step(1); }
  else if(k==="ArrowUp"||k==="k"){ e.preventDefault(); step(-1); }
  else if(k==="Enter"&&state.selectedId){ openJob(state.selectedId); }
  else if(k==="o"&&state.selectedId){ var jj=jobById(state.selectedId); if(jj) window.open(jj.official_url,"_blank","noopener"); }
  else if(k==="s"&&state.selectedId){ mark(state.selectedId,"saved",false); }
  else if(k==="e"&&state.selectedId){ mark(state.selectedId,"reviewed",true); }
  else if(k==="x"&&state.selectedId){ mark(state.selectedId,"dismissed",true); }
  else if(k==="a"&&state.selectedId){ mark(state.selectedId,"applied",false); }
  else if(k>="1"&&k<="4"&&state.page==="queue"){ goTo("queue",["all","matched","new","latest"][parseInt(k,10)-1]); }
});

/* ---------------- theme ---------------- */
var THEME_LABEL={dark:"Night",light:"Day",system:"System"};
function cycleTheme(){
  var cur=load("ace.theme","dark");
  var next=cur==="dark"?"light":cur==="light"?"system":"dark";
  save("ace.theme",next); applyTheme(next); showToast("Theme: "+THEME_LABEL[next]); render();
}
function applyTheme(t){
  if(t==="system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
}

/* No em dash reaches the screen, whatever a source wrote. Titles are
   already cleaned as they render; this catches everything else a
   source can carry -- locations, company names, a coverage row -- and
   anything drawn outside render(), such as popovers and the palette.
   A spaced en dash reads as one and goes too; "2\u20134 years" is a
   range and stays. What the user types is theirs and is left alone. */
var DASH=/\s*(?:[\u2014\u2015]+|\s\u2013\s)\s*/g;
function undash(t){
  return t.replace(DASH,function(m,off,str){
    if(off===0) return "";
    if(off+m.length===str.length) return " ";
    return ", ";
  });
}
function undashTree(root){
  if(!root) return;
  if(root.nodeType===3){
    var p=root.parentNode;
    if(p&&!/^(TEXTAREA|SCRIPT|STYLE)$/.test(p.nodeName)&&DASH.test(root.nodeValue)){
      DASH.lastIndex=0; root.nodeValue=undash(root.nodeValue);
    }
    DASH.lastIndex=0;
    return;
  }
  if(root.nodeType!==1||/^(TEXTAREA|SCRIPT|STYLE)$/.test(root.nodeName)) return;
  ["title","placeholder","aria-label"].forEach(function(a){
    var v=root.getAttribute(a);
    if(v&&DASH.test(v)){ DASH.lastIndex=0; root.setAttribute(a,undash(v)); }
    DASH.lastIndex=0;
  });
  for(var c=root.firstChild;c;c=c.nextSibling) undashTree(c);
}
new MutationObserver(function(list){
  list.forEach(function(m){
    if(m.type==="characterData") undashTree(m.target);
    else m.addedNodes.forEach(undashTree);
  });
}).observe(document.documentElement,{childList:true,subtree:true,characterData:true});

/* Spotlight: cards light up where the pointer is. */
document.addEventListener("pointermove",function(e){
  var c=e.target&&e.target.closest?e.target.closest(".card,.stat"):null;
  if(!c) return;
  var r=c.getBoundingClientRect();
  c.style.setProperty("--mx",(e.clientX-r.left)+"px");
  c.style.setProperty("--my",(e.clientY-r.top)+"px");
},{passive:true});
window.addEventListener("resize",function(){ syncTabs(); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ syncTabs(); });

/* ---------------- boot ---------------- */
var urlTheme=new URLSearchParams(location.search).get("theme");
var validTheme=urlTheme&&["light","dark","system"].indexOf(urlTheme)>=0;
if(validTheme) save("ace.theme",urlTheme);
applyTheme(validTheme?urlTheme:load("ace.theme","dark"));
initVisit();
render();
window.addEventListener("hashchange",function(){
  if(!routeFromHash() && state.page==="job") goBack();
});
loadShell().then(function(){
  announceNewRoles(state.sessions);
  // A direct link opens its job straight away; the list still loads
  // behind it so Back has somewhere to return to.
  var direct=routeFromHash();
  return loadJobs().then(function(){
    if(direct) routeFromHash();
  });
});
setInterval(function(){ loadShell().then(function(){ announceNewRoles(state.sessions); if(isJobList()) render(); }); },120000);
</script>
