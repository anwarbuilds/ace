<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F2427'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='700' font-size='19' fill='%23ECEFF1'%3Ea%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   ace, Anthracite grey. Charcoal-grey surfaces, one signal colour.
   Night is RAL 7016 itself; day is its light version, the same cool
   green-blue grey with anthracite as the ink.

   Red is budgeted: the brand mark, the active indicator, the one
   primary action on a screen. Green means match, as on a streaming
   title card. Everything else is graphite, so colour always means
   something. Light on bare :root, dark redefines tokens only.
   Every text pair below was contrast-checked against its own ground
   and passes AA.
   ============================================================ */
:root{
  --canvas:#EEF1F1; --side-bg:#E6EAEA; --surface-1:#F8FAFA; --surface-2:#E9EDED; --raised:#FFFFFF;
  --hover:rgba(41,49,51,.05); --selected:rgba(41,49,51,.085);
  --border-subtle:rgba(41,49,51,.085); --border:rgba(41,49,51,.13); --border-strong:rgba(41,49,51,.24);
  --text:#293133; --text-secondary:#4A5558; --text-muted:#5A6669;
  --accent:#D90B15; --accent-hover:#E50914; --accent-text:#B80D17; --on-accent:#FFFFFF;
  --accent-soft:rgba(217,11,21,.08); --accent-glow:rgba(217,11,21,.26);
  --match:#11743A; --match-soft:rgba(17,116,58,.10);
  --tier-big:#293133; --tier-top:#5F6B6E; --tier-est:#C3CBCC;
  --success:#11743A; --warning:#8A5300; --danger:#B42318; --info:#1D5FBF;
  --warning-soft:rgba(138,83,0,.10); --danger-soft:rgba(180,35,24,.08);
  --shadow-sm:0 1px 2px rgba(41,49,51,.07);
  --shadow-md:0 8px 24px rgba(41,49,51,.09),0 1px 2px rgba(41,49,51,.06);
  --shadow-lg:0 24px 64px rgba(41,49,51,.16),0 2px 6px rgba(41,49,51,.07);
  --glass:rgba(248,250,250,.8);
  --backdrop:rgba(41,49,51,.28);
  --hero-glow:rgba(217,11,21,.06);
  --scroll-thumb:rgba(41,49,51,.2);
  /* Aliases kept for markup that names the old tokens. */
  --purple:var(--text); --purple-rail:var(--accent); --gold-rail:var(--accent);
  --gold:var(--accent-text); --text-primary:var(--text); --surface:var(--surface-1);
  --ink-3:var(--text-muted); --line:var(--border-subtle); --bg-2:var(--surface-2);
  --r-xs:5px; --r-sm:7px; --r-md:9px; --r-lg:14px; --r-xl:20px;
  --fast:110ms; --base:170ms; --slow:280ms;
  --ease-out:cubic-bezier(.2,0,0,1); --ease-in:cubic-bezier(.4,0,1,1);
  --ease-emph:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.42,.64,1);
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --side:244px; --gutter:32px;
}
:root:not([data-theme="light"]){
  /* Anthracite grey, RAL 7016 (#293133): a soft charcoal grey with a
     faint green-blue cast. Surfaces step lighter as they rise toward
     the reader; the sidebar sits just below the canvas. */
  --canvas:#293133; --side-bg:#232A2C; --surface-1:#30393B; --surface-2:#363F42; --raised:#3D474A;
  --hover:rgba(241,243,243,.055); --selected:rgba(241,243,243,.09);
  --border-subtle:rgba(241,243,243,.08); --border:rgba(241,243,243,.12); --border-strong:rgba(241,243,243,.22);
  --text:#F1F3F3; --text-secondary:#B8C0C2; --text-muted:#ABB3B5;
  --accent:#E50914; --accent-hover:#F6121D; --accent-text:#FF8A8F; --on-accent:#FFFFFF;
  --accent-soft:rgba(229,9,20,.16); --accent-glow:rgba(229,9,20,.42);
  --match:#5BE083; --match-soft:rgba(91,224,131,.13);
  --tier-big:#F1F3F3; --tier-top:#A3ACAE; --tier-est:#56605F;
  --success:#5BE083; --warning:#F7B84B; --danger:#FF9C9C; --info:#86BFFF;
  --warning-soft:rgba(247,184,75,.14); --danger-soft:rgba(255,156,156,.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,.16);
  --shadow-md:0 10px 28px rgba(14,18,19,.36),inset 0 1px 0 rgba(255,255,255,.05);
  --shadow-lg:0 28px 72px rgba(14,18,19,.48),inset 0 1px 0 rgba(255,255,255,.07);
  --glass:rgba(48,57,59,.8);
  --backdrop:rgba(18,22,23,.5);
  --hero-glow:rgba(229,9,20,.14);
  --scroll-thumb:rgba(241,243,243,.16);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --canvas:#EEF1F1; --side-bg:#E6EAEA; --surface-1:#F8FAFA; --surface-2:#E9EDED; --raised:#FFFFFF;
    --hover:rgba(41,49,51,.05); --selected:rgba(41,49,51,.085);
    --border-subtle:rgba(41,49,51,.085); --border:rgba(41,49,51,.13); --border-strong:rgba(41,49,51,.24);
    --text:#293133; --text-secondary:#4A5558; --text-muted:#5A6669;
    --accent:#D90B15; --accent-hover:#E50914; --accent-text:#B80D17; --on-accent:#FFFFFF;
    --accent-soft:rgba(217,11,21,.08); --accent-glow:rgba(217,11,21,.26);
    --match:#11743A; --match-soft:rgba(17,116,58,.10);
    --tier-big:#293133; --tier-top:#5F6B6E; --tier-est:#C3CBCC;
    --success:#11743A; --warning:#8A5300; --danger:#B42318; --info:#1D5FBF;
    --warning-soft:rgba(138,83,0,.10); --danger-soft:rgba(180,35,24,.08);
    --shadow-sm:0 1px 2px rgba(41,49,51,.07);
    --shadow-md:0 8px 24px rgba(41,49,51,.09),0 1px 2px rgba(41,49,51,.06);
    --shadow-lg:0 24px 64px rgba(41,49,51,.16),0 2px 6px rgba(41,49,51,.07);
    --glass:rgba(248,250,250,.8);
    --backdrop:rgba(41,49,51,.28);
    --hero-glow:rgba(217,11,21,.06);
    --scroll-thumb:rgba(41,49,51,.2);
  }
}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--canvas);color:var(--text);
  font-family:var(--sans);font-size:14px;line-height:1.5;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;
  font-feature-settings:"ss01","cv11";
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-soft);color:var(--text)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:var(--r-sm)}
*{scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-40px;z-index:100;background:var(--raised);padding:8px 12px;border-radius:var(--r-md);border:1px solid var(--border);transition:top var(--fast)}
.skip:focus{top:8px}

/* ===================== shell ===================== */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:100vh;height:100vh;height:100dvh}
.side,.main{min-height:0;min-width:0}

/* ---- sidebar: pill navigation on a graphite rail ---- */
.side{
  display:flex;flex-direction:column;padding:18px 12px 12px;overflow-y:auto;
  background:var(--side-bg);border-right:1px solid var(--border-subtle);
}
.brand{display:flex;flex-direction:column;gap:3px;padding:2px 10px 20px;user-select:none}
.brand-name{font-size:24px;font-weight:700;letter-spacing:-.055em;line-height:1}
.jump{
  display:flex;align-items:center;gap:9px;width:100%;height:36px;padding:0 10px;margin:0 0 16px;
  border-radius:var(--r-md);background:var(--hover);border:1px solid var(--border-subtle);
  color:var(--text-muted);font-size:13px;text-align:left;
  transition:background var(--fast) var(--ease-out),border-color var(--fast),color var(--fast);
}
.jump:hover{background:var(--selected);border-color:var(--border);color:var(--text)}
.jump>span:not(.kbd){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:11px;height:36px;padding:0 10px;
  border-radius:var(--r-md);color:var(--text-secondary);
  font-size:13.5px;font-weight:500;width:100%;text-align:left;
  position:relative;transition:background var(--fast) var(--ease-out),color var(--fast) var(--ease-out);
}
.nav-item svg{flex:none;opacity:.85}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item[aria-current="page"]{
  background:var(--selected);color:var(--text);font-weight:600;
  box-shadow:inset 0 0 0 1px var(--border-subtle);
}
.nav-item[aria-current="page"] svg{opacity:1}
.nav-item[aria-current="page"]::before{
  content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;
  border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 12px var(--accent-glow);
}
.nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-count{font-family:var(--mono);font-size:11px;color:var(--text-muted);
  padding:1px 7px;border-radius:99px;background:var(--hover)}
.nav-item[aria-current="page"] .nav-count{color:var(--text);background:var(--border)}
.nav-rule{height:1px;background:var(--border-subtle);margin:14px 8px}
.nav-head{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);padding:0 10px 8px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:14px;border-top:1px solid var(--border-subtle)}

/* ---- main column ---- */
.main{display:flex;flex-direction:column;overflow:hidden;position:relative}
.head{flex:none;padding:24px var(--gutter) 0;position:relative;z-index:6}
.head-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:38px}
.h1{font-size:27px;font-weight:750;letter-spacing:-.035em;margin:0;line-height:1.1}
.h1-count{font-family:var(--mono);font-size:12.5px;color:var(--text-secondary);font-weight:500;
  padding:3px 10px;border-radius:99px;background:var(--hover);border:1px solid var(--border-subtle)}
.spacer{flex:1}
/* The status island: always one line, always the same place. */
.live{
  display:inline-flex;align-items:center;gap:9px;height:32px;padding:0 13px 0 11px;border-radius:999px;
  background:var(--surface-1);border:1px solid var(--border-subtle);box-shadow:var(--shadow-sm);
  font-family:var(--mono);font-size:11.5px;color:var(--text-secondary);
  transition:background var(--fast),border-color var(--fast);
}
button.live:hover{background:var(--surface-2);border-color:var(--border)}
.live-stale{color:var(--warning);border-color:var(--warning);background:var(--warning-soft)}
.dot{width:7px;height:7px;border-radius:999px;background:var(--success);flex:none;position:relative}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:1.5px solid var(--success);
  opacity:0;animation:ping 2.4s var(--ease-out) infinite}
.dot.stale{background:var(--warning)}
.dot.stale::after{display:none}
@keyframes ping{0%{opacity:.7;transform:scale(.5)}80%,100%{opacity:0;transform:scale(1.6)}}
.since-btn{
  display:inline-flex;align-items:center;gap:7px;height:32px;
  font-family:var(--mono);font-size:11.5px;color:var(--text);
  padding:0 13px;border-radius:999px;background:var(--accent-soft);border:1px solid var(--accent-glow);
  transition:filter var(--fast),transform var(--fast) var(--spring);
}
.since-btn::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.since-btn:hover{filter:brightness(1.15)}
.since-btn:active{transform:scale(.97)}

/* ---- view tabs: a segmented control with a sliding pill ---- */
.tabs{
  display:inline-flex;gap:2px;margin-top:20px;padding:4px;position:relative;max-width:100%;
  background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:12px;
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab-ind{
  position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:9px;z-index:0;
  background:var(--selected);box-shadow:inset 0 0 0 1px var(--border),var(--shadow-sm);
  transition:transform 360ms var(--ease-emph),width 360ms var(--ease-emph);pointer-events:none;
}
.tab{
  position:relative;z-index:1;height:32px;padding:0 14px;white-space:nowrap;border-radius:9px;
  font-size:13px;font-weight:500;color:var(--text-muted);
  display:flex;align-items:center;gap:8px;
  transition:color var(--base) var(--ease-out);
}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);font-weight:600}
.tabs:not(.has-ind) .tab[aria-selected="true"]{background:var(--selected);box-shadow:inset 0 0 0 1px var(--border)}
.tab-n{font-family:var(--mono);font-size:11px;color:var(--text-muted);
  background:var(--hover);padding:1px 7px;border-radius:999px}
.tab[aria-selected="true"] .tab-n{background:var(--text);color:var(--canvas)}

/* ---- control bar ---- */
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px var(--gutter) 14px}
.head .controls{padding-left:0;padding-right:0}
.search{
  display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;
  min-width:240px;flex:0 1 360px;color:var(--text-muted);
  background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:10px;
  transition:border-color var(--base),background var(--base),box-shadow var(--base),flex-basis var(--slow) var(--ease-emph);
}
.search:hover{border-color:var(--border)}
.search:focus-within{border-color:var(--border-strong);background:var(--surface-2);flex-basis:440px;
  box-shadow:0 0 0 4px var(--hover)}
.search input{flex:1;min-width:0;background:none;border:none;font-size:13.5px;padding:0;color:var(--text)}
.search input::placeholder{color:var(--text-muted)}
.search input::-webkit-search-cancel-button{filter:grayscale(1);opacity:.5}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);border:1px solid var(--border);
  border-bottom-width:2px;border-radius:5px;padding:0 5px;line-height:16px;background:var(--surface-2)}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;
  border:1px solid var(--border-subtle);border-radius:999px;background:transparent;
  font-size:12.5px;font-weight:500;color:var(--text-secondary);white-space:nowrap;
  transition:background var(--fast) var(--ease-out),border-color var(--fast),color var(--fast),transform var(--fast) var(--spring);
}
.chip:hover{background:var(--hover);border-color:var(--border);color:var(--text)}
.chip:active{transform:scale(.96)}
.chip.on,.chip.on-gold{background:var(--selected);border-color:var(--border-strong);color:var(--text);font-weight:600}
.chip.excluded{background:transparent;border-color:var(--danger);color:var(--danger);
  text-decoration:line-through;text-decoration-thickness:1px}
.chip.excluded:hover{background:var(--danger-soft);text-decoration:none}
.chip-n{font-family:var(--mono);font-size:10px;font-weight:600;line-height:16px;padding:0 5px;
  border-radius:99px;background:var(--text);color:var(--canvas)}
.ctl-sortline{gap:8px;align-items:baseline}
.sort-says{font-size:12px;color:var(--text-muted)}
tr.bandline td{padding:0}
tr.bandline span{display:block;padding:9px var(--gutter);font-size:10.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-muted);border-top:1px solid var(--border-subtle);
  border-bottom:1px solid var(--border-subtle);background:var(--surface-1)}
.chip-x{font-size:15px;line-height:1;opacity:.6;margin-right:-3px}
.chip-x:hover{opacity:1}
.ctl-label{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin:0 2px 0 6px}
.ctl-none{font-size:12.5px;color:var(--text-secondary)}
.link-btn{font-size:12.5px;font-weight:500;color:var(--text-muted);padding:5px 8px;border-radius:var(--r-sm);transition:color var(--fast),background var(--fast)}
.link-btn:hover{color:var(--text);background:var(--hover)}

/* ===================== the table ===================== */
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;position:relative}
.tbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.tbl thead th{
  position:sticky;top:0;z-index:5;
  background:color-mix(in srgb,var(--canvas) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);
  text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text-muted);padding:10px 12px;border-bottom:1px solid var(--border-subtle);
  white-space:nowrap;
}
.tbl thead th:first-child{padding-left:var(--gutter)}
.tbl thead th:last-child{padding-right:var(--gutter)}
.tbl th.sortable{cursor:pointer;user-select:none;transition:color var(--fast)}
.tbl th.sortable:hover{color:var(--text)}
.th-on{color:var(--text)!important}
.th-i{font-family:var(--mono);font-size:9px;font-weight:700;margin-left:5px;padding:0 4px;border-radius:99px;
  background:var(--text);color:var(--canvas);vertical-align:1px}
.row{transition:background var(--fast) var(--ease-out);cursor:pointer}
.row td{border-bottom:1px solid var(--border-subtle)}
.grp-head{background:var(--surface-1)}
.grp-head:hover{background:var(--hover)}
.grp-caret{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;
  background:var(--hover);color:var(--text-secondary);font-size:10px;margin-right:4px}
.grp-n{margin-left:10px;font-size:11px;font-weight:600;color:var(--text);background:var(--selected);
  border:1px solid var(--border);padding:1px 9px;border-radius:99px;vertical-align:1px}
.grp-member .c-title{padding-left:34px!important}
.grp-member{background:color-mix(in srgb,var(--surface-1) 60%,transparent)}
.row:hover{background:var(--hover)}
.row[aria-selected="true"]{background:var(--selected)}
.row[aria-selected="true"] td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.row.done{opacity:.42}
.row.done:hover{opacity:.75}
.row td{padding:12px 12px;vertical-align:middle;font-size:13px}
.row td:first-child{padding-left:var(--gutter)}
.row td:last-child{padding-right:var(--gutter)}
.c-rail{width:4px;padding:0!important}
.rail{width:3px;height:36px;border-radius:3px;background:transparent}
.rail.t-BIG_TECH{background:var(--tier-big);box-shadow:0 0 10px color-mix(in srgb,var(--tier-big) 30%,transparent)}
.rail.t-TOP_TIER{background:var(--tier-top)}
.rail.t-ESTABLISHED{background:var(--tier-est)}
.c-co{width:240px}
.co-wrap{display:flex;align-items:center;gap:12px;min-width:0}
.co-txt{min-width:0}
/* A title card per company: initials on a tone of their own, so a
   column of employers can be scanned by shape before it is read. */
.co-av{
  --h:220;flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;letter-spacing:.02em;color:hsl(var(--h) 50% 88%);
  background:linear-gradient(145deg,hsl(var(--h) 22% 42%),hsl(var(--h) 16% 30%));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.08);
  text-transform:uppercase;user-select:none;
}
:root[data-theme="light"] .co-av{color:hsl(var(--h) 38% 27%);
  background:linear-gradient(145deg,hsl(var(--h) 34% 92%),hsl(var(--h) 24% 84%));
  box-shadow:inset 0 0 0 1px rgba(41,49,51,.07)}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) .co-av{color:hsl(var(--h) 38% 27%);
    background:linear-gradient(145deg,hsl(var(--h) 34% 92%),hsl(var(--h) 24% 84%));
    box-shadow:inset 0 0 0 1px rgba(41,49,51,.07)}
}
.co-av.lg{width:64px;height:64px;border-radius:18px;font-size:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 12px 32px rgba(0,0,0,.35)}
.co-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co-tier{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-top:2px}
.t-BIG_TECH .co-tier,.tier-BIG_TECH{color:var(--tier-big)}
.t-TOP_TIER .co-tier,.tier-TOP_TIER{color:var(--tier-top)}
.t-ESTABLISHED .co-tier,.tier-ESTABLISHED{color:var(--text-muted)}
.c-title{min-width:0}
.j-title{font-size:14px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;
  text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;
  transition:text-decoration-color var(--fast)}
.j-title:hover{text-decoration-color:var(--text-muted)}
.j-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-loc{width:190px;color:var(--text-secondary);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-exp{width:138px;font-size:12px}
.exp-early,.exp-known,.exp-unknown{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-weight:500;white-space:nowrap}
.exp-early{color:var(--match);background:var(--match-soft)}
.exp-early::before{content:"";width:5px;height:5px;border-radius:99px;background:currentColor}
.exp-known{color:var(--text-secondary);background:var(--hover)}
.exp-unknown{color:var(--text-muted);border:1px dashed var(--border)}
.c-match{width:128px;white-space:nowrap}
.mt{display:flex;align-items:baseline;gap:7px}
.m-tier{font-size:9.5px;font-weight:700;letter-spacing:.1em}
.m-n{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.02em}
.m-n i{font-style:normal;font-size:11px;opacity:.7;margin-left:1px}
.m-high{color:var(--match)} .m-medium{color:var(--text)} .m-minimal{color:var(--text-muted)}
.m-bar{display:block;width:84px;height:3px;border-radius:99px;background:var(--hover);margin-top:6px;overflow:hidden}
.m-bar i{display:block;height:100%;border-radius:99px;background:currentColor}
.m-unscored{display:inline-flex;align-items:center;gap:7px;color:var(--text-muted);font-size:11.5px}
.m-unscored::before{content:"";width:14px;height:14px;border-radius:99px;border:1.5px dotted var(--text-muted);flex:none}
.c-status{width:150px}
.c-when{width:72px;font-family:var(--mono);font-size:11.5px;color:var(--text-muted);white-space:nowrap}
/* The row's actions float in as a dock over its right end, so no column
   is spent on buttons that are invisible until hover. */
.c-act{width:28px;text-align:right;white-space:nowrap;position:relative}
.acts{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--raised);
  border:1px solid var(--border);box-shadow:var(--shadow-md);
  position:absolute;right:calc(var(--gutter) - 10px);top:50%;z-index:2;
  opacity:0;pointer-events:none;transform:translate(8px,-50%);
  transition:opacity var(--base) var(--ease-out),transform var(--base) var(--ease-out)}
.row:hover .acts,.row:focus-within .acts,.row[aria-selected="true"] .acts{opacity:1;pointer-events:auto;transform:translate(0,-50%)}
.iconbtn{
  width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:8px;color:var(--text-muted);
  transition:background var(--fast),color var(--fast),transform var(--fast) var(--spring);
}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn:active{transform:scale(.9)}
.iconbtn.on{color:var(--text)}
.iconbtn.on svg{fill:currentColor}
.iconbtn[data-mark="applied"].on{color:var(--match)}
.iconbtn[data-mark="applied"].on svg{fill:none}

/* badges: a dot says the state, the word says what it is */
.badge{
  display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap;
  background:var(--hover);color:var(--text-secondary);
}
.badge::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;opacity:.9}
.badge.new{background:var(--accent-soft);color:var(--accent-text)}
.badge.new::before{box-shadow:0 0 8px currentColor}
.badge.move{background:var(--match-soft);color:var(--match)}
.badge.applied{background:var(--selected);color:var(--text)}
.badge.screening,.badge.interviewing{background:rgba(96,165,250,.12);color:var(--info)}
.badge.offer,.badge.accepted{background:var(--match-soft);color:var(--success)}
.badge.rejected,.badge.withdrawn,.badge.ghosted{background:var(--danger-soft);color:var(--danger)}
.badge.saved{background:var(--hover);color:var(--text-secondary)}
.badge.export{background:var(--warning-soft);color:var(--warning);margin-left:8px;vertical-align:1px;height:20px;font-size:10.5px}

.readline{padding:0}
.readline td{padding:18px var(--gutter) 10px;border-bottom:1px solid var(--border-subtle)}
.readline span{
  display:inline-flex;align-items:center;gap:12px;width:100%;
  font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);
}
.readline span::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--accent-glow),transparent)}
.grouphead td{
  padding:22px var(--gutter) 8px;border-bottom:1px solid var(--border-subtle);
  background:var(--canvas);
}
.gh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.gh-t{font-size:14px;font-weight:700;letter-spacing:-.01em}
.gh-m{font-family:var(--mono);font-size:11.5px;color:var(--text-muted)}
.gh-none{font-size:12.5px;color:var(--text-muted);font-style:italic}
.tail{padding:26px var(--gutter) 48px;text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--text-muted)}

/* ===================== job detail: a title page ===================== */
.jp{flex:1;overflow-y:auto}
.jp-hero{
  position:relative;padding:22px var(--gutter) 30px;border-bottom:1px solid var(--border-subtle);
  background:
    radial-gradient(60% 120% at 0% 0%,var(--hero-glow),transparent 70%),
    radial-gradient(50% 90% at 100% 0%,color-mix(in srgb,var(--text) 5%,transparent),transparent 70%);
}
.jp-hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,var(--accent-glow),transparent 45%)}
.jp-in{max-width:1240px;padding:26px var(--gutter) 64px}
.jp-hero .jp-in{padding:0}
.jp-back{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--text-muted);
  height:30px;padding:0 10px 0 8px;margin:0 0 18px -8px;border-radius:99px;border:1px solid transparent;
  transition:background var(--fast),color var(--fast),border-color var(--fast)}
.jp-back:hover{background:var(--hover);border-color:var(--border-subtle);color:var(--text)}
.jp-head{display:flex;align-items:flex-start;gap:20px}
.jp-headtxt{min-width:0;flex:1}
.jp-tier{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px}
.jp-tier::before{content:"";width:16px;height:2px;border-radius:2px;background:currentColor}
.jp-title{font-size:34px;font-weight:750;letter-spacing:-.035em;line-height:1.12;margin:0 0 14px;text-wrap:balance}
.jp-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--text-secondary)}
.jp-meta>span:not(.badge):not([class^="exp-"]){display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:99px;
  background:var(--hover);border:1px solid var(--border-subtle)}
.jp-meta>span.sep{display:none}
.jp-co{font-weight:650;color:var(--text)}
.jp-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.9fr);gap:22px;align-items:start}
.jp-aside{position:sticky;top:20px}
.card{position:relative;background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--r-lg);
  padding:20px 22px;margin-bottom:16px;isolation:isolate;overflow:hidden;
  transition:border-color var(--base) var(--ease-out)}
/* Spotlight: the border lights where the pointer is. */
.card::before,.stat::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  opacity:0;transition:opacity var(--slow) var(--ease-out);
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--text) 7%,transparent),transparent 45%)}
.card:hover::before,.stat:hover::before{opacity:1}
.card:hover,.stat:hover{border-color:var(--border)}
.card.match{background:
  radial-gradient(90% 140% at 100% 0%,var(--match-soft),transparent 60%),var(--surface-1)}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--text-muted);margin:0 0 14px}
.score-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .trk{stroke:var(--hover)}
.ring .val{stroke:currentColor;stroke-linecap:round;filter:drop-shadow(0 0 6px color-mix(in srgb,currentColor 45%,transparent))}
.ring .score-n{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.score-n{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1;letter-spacing:-.04em}
.score-meta{font-size:13px;color:var(--text-secondary);margin-top:4px;line-height:1.5}
.score-meta b{color:var(--text);font-weight:650;letter-spacing:.06em;font-size:11.5px}
.meter{height:6px;border-radius:999px;background:var(--hover);overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;border-radius:999px;background:var(--match)}
.skills{display:flex;flex-wrap:wrap;gap:7px}
.sk{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;
  background:var(--hover);border:1px solid var(--border-subtle);font-size:12.5px;font-weight:500;color:var(--text-secondary)}
.sk.have{background:var(--match-soft);border-color:color-mix(in srgb,var(--match) 35%,transparent);color:var(--text)}
.sk.have::before{content:"";width:5px;height:5px;border-radius:99px;background:var(--match)}
.sk.miss{background:transparent;color:var(--text-muted);border-style:dashed}
.rel{display:flex;flex-direction:column;gap:9px}
.rel-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.rel-via{font-size:12px;color:var(--text-muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:11px 18px;font-size:12.5px;margin:0}
.kv dt{color:var(--text-muted);white-space:nowrap}
.kv dd{margin:0;font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;color:var(--text-secondary)}
.why{font-size:13px;color:var(--text-secondary);line-height:1.7}
.why b{color:var(--text);font-weight:600}
.acts-col{display:flex;flex-direction:column;gap:10px}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;
  border-radius:10px;font-size:13px;font-weight:550;border:1px solid transparent;position:relative;white-space:nowrap;
  transition:background var(--fast),border-color var(--fast),color var(--fast),filter var(--fast),transform var(--fast) var(--spring),box-shadow var(--base);
}
.btn:active{transform:scale(.97)}
/* The one red fill on a screen. A light runs its edge on hover. */
.btn-primary{background:var(--accent);color:var(--on-accent);font-weight:650;height:44px;font-size:14px;
  box-shadow:0 8px 24px -8px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.18);isolation:isolate}
.btn-primary:hover{background:var(--accent-hover);box-shadow:0 12px 32px -8px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-primary::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0 72%,rgba(255,255,255,.95) 82%,transparent 92%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity var(--base)}
.btn-primary:hover::after{opacity:1;animation:edge 2.2s linear infinite}
@keyframes edge{to{--ang:360deg}}
.btn-primary svg{transition:transform var(--base) var(--spring)}
.btn-primary:hover svg{transform:translate(2px,-2px)}
.btn-secondary{background:var(--surface-2);border-color:var(--border);color:var(--text)}
.btn-secondary:hover{background:var(--raised);border-color:var(--border-strong)}
.btn-ghost{color:var(--text-secondary);border-color:var(--border-subtle);background:transparent}
.btn-ghost:hover{background:var(--hover);color:var(--text);border-color:var(--border)}
.btn-ghost.on{background:var(--selected);color:var(--text);font-weight:650;border-color:var(--border-strong)}
.btn-ghost.on[data-mark="applied"] svg{color:var(--match)}
.btn-ghost.on[data-mark="saved"] svg{fill:currentColor}
.btn-sm{height:32px;padding:0 12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.info{width:17px;height:17px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--border-strong);color:var(--text-muted);font-size:10px;font-weight:700;vertical-align:1px}
.info:hover{color:var(--text);border-color:var(--text-muted)}

/* ===================== answer bank ===================== */
.ab{position:fixed;right:12px;top:12px;bottom:12px;width:min(410px,calc(100vw - 24px));z-index:95;
  background:var(--glass);-webkit-backdrop-filter:saturate(1.5) blur(22px);backdrop-filter:saturate(1.5) blur(22px);
  border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;overflow:hidden;animation:slidein var(--slow) var(--ease-emph)}
@keyframes slidein{from{transform:translateX(calc(100% + 24px))}to{transform:translateX(0)}}
.ab-head{padding:18px 18px 14px 20px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:12px}
.ab-head h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.ab-body{flex:1;overflow-y:auto;padding:8px 10px 20px}
.ab-row{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:10px;
  transition:background var(--fast)}
.ab-row:hover{background:var(--hover)}
.ab-row.empty{opacity:.45}
.ab-l{flex:none;width:126px;font-size:11.5px;color:var(--text-muted);padding-top:3px}
.ab-v{flex:1;min-width:0;font-size:13px;overflow-wrap:anywhere;white-space:pre-wrap}
.ab-v.blank{font-style:italic;color:var(--text-muted)}
.ab-copy{flex:none;opacity:.35;transition:opacity var(--fast),color var(--fast)}
.ab-row:hover .ab-copy{opacity:1}
.ab-copy.done{opacity:1;color:var(--success);font-size:11px;width:auto;padding:0 6px}
.ab-foot{padding:14px 18px;border-top:1px solid var(--border-subtle);display:flex;gap:10px;align-items:center}
/* A floating dock, not a stray button. */
.ab-toggle{position:fixed;right:22px;bottom:22px;z-index:70;height:40px;border-radius:99px;padding:0 16px 0 14px;
  background:var(--glass);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);
  border-color:var(--border);box-shadow:var(--shadow-lg)}
.ab-toggle:hover{background:var(--surface-2);transform:translateY(-1px)}
.ans-edit{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:12px;align-items:start;
  padding:10px 0;border-bottom:1px solid var(--border-subtle)}
.ans-edit input,.ans-edit textarea{width:100%;background:var(--surface-1);color:var(--text);
  border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:13px;transition:border-color var(--fast),box-shadow var(--fast)}
.ans-edit textarea{min-height:40px;max-height:260px;resize:vertical;font-family:var(--sans);field-sizing:content;line-height:1.5}
.ans-edit input:focus,.ans-edit textarea:focus,.ans-edit select:focus{border-color:var(--border-strong);box-shadow:0 0 0 4px var(--hover)}
.ans-edit select{width:100%;background:var(--surface-1);color:var(--text);
  border:1px solid var(--border);border-radius:10px;padding:9px 10px;font-size:13px;font-family:var(--sans)}
/* The question is ACE's, not the user's: renaming it would break the
   match that finds it on a form. Shown as text, with the name carried
   alongside so saving still reads a label for every row. */
.ans-name{padding:9px 0;font-size:13px;font-weight:500;color:var(--text);line-height:1.35}
.ans-hint{font-size:11.5px;color:var(--text-muted);margin-top:5px;line-height:1.45}
/* A yes/no answer is two buttons, because it is two answers. Typing
   "No" into a text box was the thing that made the bank feel like
   data entry rather than a set of decisions. */
.ans-yn{display:inline-flex;gap:3px;padding:3px;border-radius:11px;background:var(--surface-1);border:1px solid var(--border-subtle)}
.ans-yn button{background:transparent;color:var(--text-secondary);border:1px solid transparent;
  border-radius:8px;padding:6px 17px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);
  transition:background var(--fast),color var(--fast)}
.ans-yn button:hover{background:var(--hover);color:var(--text)}
.ans-yn button[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--canvas)}
.ans-yn .ans-clear{font-weight:500;color:var(--text-muted);padding:6px 12px}
@media (max-width:720px){ .ans-edit{grid-template-columns:1fr auto} }

/* small mono counter, shared by the answers panel */
.am-count{font-family:var(--mono);font-size:12px;color:var(--text-muted)}

/* ===================== other pages ===================== */
.page{flex:1;overflow-y:auto;padding:22px var(--gutter) 64px}
.wrap{max-width:1180px}
.sect{margin-bottom:34px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:160px 1fr 58px;gap:14px;align-items:center;font-size:13px}
.bar-t{height:8px;background:var(--hover);border-radius:999px;overflow:hidden}
.bar-f{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--text-muted),var(--text))}
.bar-f.gold{background:linear-gradient(90deg,color-mix(in srgb,var(--match) 55%,transparent),var(--match))}
.bar-f.dot{background:repeating-linear-gradient(90deg,var(--border-strong) 0 3px,transparent 3px 7px)}
.bar-n{font-family:var(--mono);font-size:12.5px;color:var(--text-secondary);text-align:right}
.gaprow{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--border-subtle);font-size:13px}
.gap-n{font-family:var(--mono);font-size:12px;color:var(--text-muted)}
.note{font-size:12.5px;color:var(--text-muted);padding-top:16px;border-top:1px solid var(--border-subtle);margin-top:18px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
/* Metric tiles: the number is the headline. */
.stat{position:relative;isolation:isolate;overflow:hidden;background:var(--surface-1);border:1px solid var(--border-subtle);
  border-radius:var(--r-lg);padding:18px 20px 16px;transition:border-color var(--base)}
.stat-n{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1.1}
.stat-l{font-size:12px;color:var(--text-muted);margin-top:6px;font-weight:500}

/* empty / skeleton / toast / popover */
.empty{padding:40px 0;max-width:470px}
.empty::before{content:"";display:block;width:44px;height:44px;border-radius:14px;margin-bottom:18px;
  background:radial-gradient(circle at 30% 25%,var(--border-strong),var(--hover));border:1px solid var(--border)}
.empty h3{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.empty p{font-size:13.5px;color:var(--text-secondary);margin:0 0 18px;line-height:1.65}
.sk-row td{padding:16px 12px;border-bottom:1px solid var(--border-subtle)}
.sk-b{height:12px;border-radius:6px;
  background:linear-gradient(90deg,var(--hover) 0%,var(--selected) 40%,var(--hover) 80%);background-size:300% 100%;
  animation:shimmer 1.6s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-200% 0}}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;
  display:flex;align-items:center;gap:16px;padding:10px 10px 10px 18px;min-height:44px;
  background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);
  border:1px solid var(--border);border-radius:99px;
  box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;animation:rise var(--slow) var(--spring);
}
.toast:not(:has(.link-btn)){padding-right:18px}
.toast .link-btn{color:var(--text);background:var(--hover);border-radius:99px;padding:6px 13px;font-weight:600}
.toast .link-btn:hover{background:var(--selected)}
@keyframes rise{from{opacity:0;transform:translate(-50%,14px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}

<script>
"use strict";
/* ============================================================

var RECENT_DAYS=15;

var STATUSES=["applied","screening","interviewing","offer","accepted","rejected","withdrawn","ghosted"];

  accepted:"Accepted",rejected:"Rejected",withdrawn:"Withdrawn",ghosted:"No reply"};

/* Sorts combine. Order is the order you picked them in. */
var SORTS=[
  ["unapplied_first","Not applied first"],
  ["experience_fit_first","Fits my experience"],
  ["new_grad_first","New grad first"],
  ["best_match","Best match"],
  ["big_tech_first","Big tech first"],
  ["newest","Newest"],
  ["oldest","Oldest"],
  ["company","Company"]
];

/* The chips say what they are; this says what the combination does.
   The numbered badges were read as decoration, so the order they
   encode is now also spelled out in words underneath. */
var SORT_PHRASE={
  unapplied_first:"the ones you have not applied to",
  experience_fit_first:"roles that fit your experience",
  new_grad_first:"new grad roles",
  best_match:"best match",
  big_tech_first:"big tech",
  newest:"newest first",
  oldest:"oldest first",
  recently_posted:"recently posted",
  company:"company name",
  title:"job title"

  q:"", sorts:DEFAULT_SORTS.slice(),

  pinned:null, heldRow:null,
  items:[], total:0, loading:true, loadingMore:false, hasMore:false, offset:0, reqToken:0,

  stats:{}, sessions:[], lastPoll:null, markCounts:{saved:0,archived:0,applied:0,open_applications:0,by_status:{}},
  resume:null, gap:[], facets:{companies:[],sources:[],families:[]},

  menuOpen:false, toast:null, undoFn:null,
  filterQuery:"", filterOpen:{},

/* ---------------- storage ---------------- */
function load(k,d){ try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;} }
function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }

  var now=Date.now(), cur=load("ace.visit.current",null), prev=load("ace.visit.previous",null);

  else { if(cur){ save("ace.visit.previous",cur); prev=cur; } state.prevVisit=prev?new Date(prev):null; }
  save("ace.visit.current",now);

/* ---------------- helpers ---------------- */
function tierOf(s){ if(s==null) return "unscored"; if(s>=HIGH) return "high"; if(s>=MED) return "medium"; return "minimal"; }
function tierLabel(t){ return t==="high"?"HIGH":t==="medium"?"MEDIUM":t==="minimal"?"MINIMAL":"Not scored"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

function clean(s){ return String(s==null?"":s)
  .replace(/\s*[—–]\s*/g,", ").replace(/\s+([,;:])/g,"$1").replace(/\s{2,}/g," ").trim(); }
function ago(iso){
  if(!iso) return "";
  var d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<60) return "just now";
  if(d<3600) return Math.floor(d/60)+"m";
  if(d<86400) return Math.floor(d/3600)+"h";
  if(d<86400*7) return Math.floor(d/86400)+"d";
  return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"});

function clock(d){ return new Date(d).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }

  return x.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});

// Every list the user can act on, not just the queue. Pulls renders the

function jobById(id){
  for(var i=0;i<state.items.length;i++) if(state.items[i].id===id) return state.items[i];
  for(var s=0;s<state.sessions.length;s++){
    var js=state.sessions[s].jobs||[];
    for(var k=0;k<js.length;k++) if(js[k].id===id) return js[k];
  }
  if(state.detailJob&&state.detailJob.id===id) return state.detailJob;
  if(state.heldRow&&state.heldRow.id===id) return state.heldRow;
  return null;
}
function tierMove(j){
  if(j.previous_match_score==null||j.match_score==null) return null;
  var a=tierOf(j.previous_match_score), b=tierOf(j.match_score);
  if(a===b||!state.prevVisit||!j.score_changed_at) return null;
  if(new Date(j.score_changed_at)<=state.prevVisit) return null;
  return tierLabel(a)+" → "+tierLabel(b);
}
/* A title card per employer: one or two initials on a tone derived from
   the name, so the same company always looks the same. */
function monogram(name){
  var words=String(name||"").replace(/[^A-Za-z0-9& ]+/g," ").trim().split(/\s+/)
    .filter(function(w){ return w&&!/^(inc|llc|ltd|the|co|corp|corporation|group|holdings)$/i.test(w); });
  if(!words.length) return "?";
  if(words.length===1) return words[0].charAt(0);
  return words[0].charAt(0)+words[1].charAt(0);
}
function hueOf(name){
  var h=0, t=String(name||"").toLowerCase();
  for(var i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))%360;
  return h;
}
function avatar(name,cls){
  return '<span class="co-av'+(cls?" "+cls:"")+'" style="--h:'+hueOf(name)+'" aria-hidden="true">'+
    esc(monogram(name))+'</span>';
}
function icon(p,sz){ return '<svg width="'+(sz||16)+'" height="'+(sz||16)+'" viewBox="0 0 16 16" fill="none" '+
  'stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; }

/* ---------------- data ---------------- */
function params(extra){
  var p=new URLSearchParams();
  if(state.q) p.set("q",state.q);
  Object.keys(state.filters).forEach(function(k){
    var f=state.filters[k];
    if(f.type==="flag") p.set(f.param,"true"); else p.set(f.param,f.value);
  });
  if(state.tiers.length) p.set("tier",state.tiers.join(","));
  if(state.excluded.length) p.set("exclude_company",state.excluded.join(","));
  // Scoped to the Queue itself: a saved or archived job must never be
  // hidden by a housekeeping default.
  if(state.page==="queue" && state.recentOnly) p.set("max_detected_age_days",RECENT_DAYS);
  // Openings 30 or more days old are hidden by default, server side:
  // the user asked for them gone. Marks are never hidden by age.
  if(state.includeOld) p.set("include_old","true");
  if(extra) Object.keys(extra).forEach(function(k){ if(extra[k]!=null) p.set(k,extra[k]); });
  return p;
}
function sortParam(){ return state.sorts.length?state.sorts.join(","):"new_grad_first"; }
// What the user is looking at, without paging or ordering. Facet counts
// have to be taken inside this, or the menu offers rows that the filters
// already on screen have removed.
function facetParams(){
  var e={};
  if(state.page==="saved") e.mark="saved";
  else if(state.page==="archive") e.mark="archived";
  else if(state.page==="applied") e.mark="applied";
  else if(state.view==="matched") e.min_match=HIGH;
  return e;
}
function viewParams(){
  var e={sort:sortParam(), limit:PAGE, offset:state.offset};
  if(state.page==="saved"){ e.mark="saved"; return e; }
  if(state.page==="archive"){ e.mark="archived"; return e; }
  if(state.page==="applied"){ e.mark="applied"; e.sort="newest"; return e; }
  if(state.view==="matched") e.min_match=HIGH;
  if(state.view==="new"&&state.prevVisit){ e.since=state.prevVisit.toISOString(); e.sort="newest"; }
  if(state.view==="latest"){ var s=state.sessions[0]; if(s) e.session_id=s.id; e.sort="newest"; }
  return e;
}
function get(path,p){
  // no-store on both sides: these responses describe rows that change
  // under the reader, and a cached one is simply wrong.
  return fetch(API+path+(p&&p.toString()?"?"+p.toString():""),
               {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error(r.status); return r.json(); });
}
// `quiet` keeps what is on screen while the next answer is fetched.
// Searching is a refinement of the list you are already looking at, and
// blanking it on every keystroke made the page flash empty between each
// letter. A list that disappears while you are still typing reads as
// the search being broken rather than as it working.
function loadJobs(append,quiet){
  if(append){ if(state.loadingMore||!state.hasMore) return Promise.resolve(); state.loadingMore=true; }
  else {
    state.offset=0; state.loading=true; state.reqToken++;
    if(!quiet){ state.items=[]; render(); }
  }
  var token=state.reqToken;
  return get("/api/jobs",params(viewParams())).then(function(d){
    if(token!==state.reqToken) return;
    state.items=append?state.items.concat(d.items):d.items;
    // A row the user just acted on stays visible for this load even if
    // the sort would now place it out of reach.
    if(state.pinned && !append){
      var held=state.heldRow;
      if(held && !state.items.some(function(x){return x.id===held.id;})){
        state.items.unshift(held);
      }
      // Released after the one load it was held for. It used to be
      // cleared only on navigation, so the row stayed pinned to the
      // top of every later load: toggling "Not applied first" redrew
      // the queue with an applied job still sitting at position one,
      // and the sort read as broken when it had worked correctly.
      // The row is in state.items now, so every lookup still finds it.
      state.pinned=null; state.heldRow=null;
    }
    state.offset=state.offset+d.items.length;
    state.hasMore=d.has_more; state.total=d.total;
    state.loading=false; state.loadingMore=false;
    if(state.selectedId&&!state.items.some(function(j){return j.id===state.selectedId;})) state.selectedId=null;
    render(append);
  }).catch(function(){
    if(token!==state.reqToken) return;
    state.loading=false; state.loadingMore=false; render();
  });
}
/* Desktop alerts. Email waits on a provider key, and the portal shows a
   new role only when someone looks, so a role ACE caught early could
   still wait hours to be seen. With alerts on, the open ACE tab -- in
   the background is fine -- announces each pull's new qualifying roles
   when the two-minute refresh brings them in. Remembered per pull, as
   a count rather than a flag: a pull is fifteen minutes long and keeps
   growing, so its third role must be announced even after its first
   was. The first load only sets the baseline, so turning alerts on
   does not replay the week. */
var ALERTED_KEY="ace.alertedPulls";
function alertedCounts(){
  try{ var v=JSON.parse(localStorage.getItem(ALERTED_KEY)||"null"); return v&&typeof v==="object"?v:null; }
  catch(e){ return null; }
}
function saveAlerted(map){
  try{
    // The fifty most recent pulls are all that can still change.
    var ids=Object.keys(map).map(Number).sort(function(a,b){return b-a;}).slice(0,50);
    var kept={}; ids.forEach(function(id){ kept[id]=map[id]; });
    localStorage.setItem(ALERTED_KEY,JSON.stringify(kept));
  }catch(e){}
}
function alertsSupported(){ return typeof window.Notification==="function"; }
function alertsOn(){ return alertsSupported()&&window.Notification.permission==="granted"; }
function announceNewRoles(sessions){
  if(!sessions||!sessions.length) return;
  var seen=alertedCounts();
  var first=seen===null;
  seen=seen||{};
  var fresh=[];
  sessions.forEach(function(s){
    var had=seen[s.id]||0, now=s.qualifying_discovered||0;
    if(now>had&&!first) fresh.push({pull:s,count:now-had});
    if(now>had||!(s.id in seen)) seen[s.id]=now;
  });
  saveAlerted(seen);
  if(!fresh.length||!alertsOn()) return;
  var total=fresh.reduce(function(a,f){return a+f.count;},0);
  var roles=[];
  fresh.forEach(function(f){ (f.pull.jobs||[]).forEach(function(j){
    if(roles.length<4) roles.push(undash(j.company+", "+clean(j.title))); }); });
  try{
    var n=new window.Notification(
      "ACE: "+total+" new role"+(total===1?"":"s")+" pass"+(total===1?"es":"")+" your filters",
      {body:roles.join("\n")||"Open ACE to see them.",tag:"ace-new-roles",renotify:true});
    n.onclick=function(){ window.focus(); goTo("pulls"); n.close(); };
  }catch(e){}
}
function enableAlerts(){
  if(!alertsSupported()){ showToast("This browser cannot show desktop alerts."); return; }
  window.Notification.requestPermission().then(function(p){
    showToast(p==="granted"
      ?"Desktop alerts on. Keep an ACE tab open, in the background is fine."
      :"Alerts are blocked for this site in the browser's settings.");
    render();
  });
}
function alertsButton(){
  if(!alertsSupported()) return "";
  if(alertsOn()) return '<span class="pl-alerts on">Desktop alerts on</span>';
  return '<button class="btn pl-alerts" data-act="alerts">Turn on desktop alerts</button>';
}
function loadShell(){
  return Promise.all([
    get("/api/stats",params()).then(function(d){ state.stats=d; state.lastPoll=d.last_poll_at; }),
    get("/api/sessions",new URLSearchParams({limit:"30",jobs_per_session:"6"})).then(function(d){
      state.sessions=d.sessions||[]; state.sessionsExhausted=false;
      if(d.last_poll_at) state.lastPoll=d.last_poll_at; }),
    get("/api/facets",params(facetParams())).then(function(d){ state.facets=d; }),
    get("/api/resume").then(function(d){ state.resume=d.resume; state.gap=d.skills_gap||[]; }),
    get("/api/marks").then(function(d){ state.markCounts=d; }),
    get("/api/answers").then(function(d){ state.answers=d.items||[]; }),
    get("/api/coverage").then(function(d){ state.coverage=d; }),
    get("/api/history/work").then(function(d){ state.work=d.items||[]; }),
    get("/api/history/education").then(function(d){ state.education=d.items||[]; }),
    loadExternal(),
    refreshNewCount()
  ]).catch(function(){});
}
function refreshNewCount(){
  if(!state.prevVisit){ state.newSinceVisit=0; return Promise.resolve(); }
  return get("/api/jobs",params({since:state.prevVisit.toISOString(),limit:1}))
    .then(function(d){ state.newSinceVisit=d.total; }).catch(function(){});
}
function refreshMarkCounts(){ return get("/api/marks").then(function(d){ state.markCounts=d; }).catch(function(){}); }
function loadExternal(){
  return get("/api/applications/external")
    .then(function(d){ state.externalApps=d.items||[]; }).catch(function(){});
}
function reloadGap(){
  var p=new URLSearchParams();
  if(state.gapFamily) p.set("family",state.gapFamily);
  if(state.gapMin!=null) p.set("min_match",state.gapMin);
  return get("/api/resume",p).then(function(d){ state.resume=d.resume; state.gap=d.skills_gap||[]; render(); })
    .catch(function(){ render(); });
}

/* ---------------- marks ---------------- */
function putMark(id,body){
  return fetch(API+"/api/marks/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
}
/* Every in-memory copy of one job, because there is more than one.

   The same posting can sit in state.items, in a pull session's own
   list, in state.detailJob and in state.heldRow at the same time.
   jobById returns whichever it finds first, so marking a job from its
   detail page updated the copy held by the pulls feed and left the one
   the page was rendering from untouched: the mark saved server-side,
   the toast fired, and the page still said "Not applied yet" with the
   Applied button unlit until a reload. */
function jobCopies(id){
  var out=[];
  for(var i=0;i<state.items.length;i++) if(state.items[i].id===id) out.push(state.items[i]);
  for(var s=0;s<state.sessions.length;s++){
    var js=state.sessions[s].jobs||[];
    for(var k=0;k<js.length;k++) if(js[k].id===id) out.push(js[k]);
  }
  if(state.detailJob&&state.detailJob.id===id) out.push(state.detailJob);
  if(state.heldRow&&state.heldRow.id===id) out.push(state.heldRow);
  return out;
}
function applyMark(j,res){
  jobCopies(j.id).concat(j).forEach(function(copy){
    copy.is_saved=res.is_saved; copy.review_state=res.review_state;
    copy.applied_at=res.applied_at; copy.application_status=res.application_status;
    copy.status_changed_at=res.status_changed_at;
  });
}
function mark(id,key,advance){
  var j=jobById(id);
  if(!j){ showToast("That opportunity is no longer on screen"); render(); return; }
  // Marking applied re-sorts the row to the bottom under the default
  // sort. Holding it in place until the next load means the click looks
  // like it did something instead of making the row disappear.
  if(key==="applied") state.pinned=id;
  var was=markOf(j)[key];
  var body = key==="saved"?{saved:!was} : key==="applied"?{applied:!was}
           : was?{clear_review:true}:{review_state:key};
  var undoBody = key==="saved"?{saved:was} : key==="applied"?{applied:was}
           : was?{review_state:key}:{clear_review:true};
  var label={saved:was?"Removed from saved":"Saved",
             reviewed:was?"Review cleared":"Marked reviewed",
             dismissed:was?"Restored":"Marked not relevant",
             applied:was?"Applied cleared":"Marked applied"}[key];
  putMark(id,body).then(function(res){
    applyMark(j,res); refreshMarkCounts();
    if(key==="applied") state.heldRow=j;
    showToast(label,function(){ putMark(id,undoBody).then(function(b){ applyMark(j,b); refreshMarkCounts(); render(); }); });
    var onMarkPage=(state.page==="saved"&&key==="saved"&&was)||
                   (state.page==="archive"&&(key==="reviewed"||key==="dismissed")&&was)||
                   (state.page==="applied"&&key==="applied"&&was);
    if(onMarkPage){
      state.items=state.items.filter(function(x){return x.id!==id;});
      state.total=Math.max(0,state.total-1);
    }
    if(advance&&key!=="saved"&&key!=="applied"&&!was) step(1); else render();
  }).catch(function(){ showToast("Could not save that change"); render(); });
}
function setStatus(id,status){
  var j=jobById(id); if(!j) return;
  var was=j.application_status;
  putMark(id,{application_status:status}).then(function(res){
    applyMark(j,res); refreshMarkCounts();
    showToast(STATUS_LABEL[status]+" recorded", function(){
      putMark(id, was?{application_status:was}:{applied:false}).then(function(b){
        applyMark(j,b); refreshMarkCounts(); render(); });
    });
    render();
  }).catch(function(){ showToast("Could not record that status"); render(); });
}

function liveChip(){
  var stale=isStale();
  var label=!state.lastPoll?"No pull recorded":stale?("Not updating · "+ago(state.lastPoll)):("Live · updated "+ago(state.lastPoll));
  return '<button class="live'+(stale?" live-stale":"")+'" data-act="live">'+

function tabsBar(){
  var s=state.stats, latest=state.sessions[0];
  var defs=[["all","All",s.qualifying_active_jobs],
            ["matched","Highly matched",s.match_high],
            ["new","New for you",state.newSinceVisit||null],

      (d[2]!=null?'<span class="tab-n">'+d[2]+'</span>':'')+'</button>';

/* Reading the badges as "1st, 2nd, 3rd" still leaves the user to
   assemble what the combination means. This states it outright, and
   offers the way back when the order has been changed. */
function sortLine(){
  var names=state.sorts.map(function(k){ return SORT_PHRASE[k]||k; });
  if(!names.length) return "";
  // "first" belongs to the leading key, not to the end of the list:
  // "A, B, then C first" reads as though C led.
  // Some phrases already end in "first" ("newest first"), and
  // appending another produced "Showing newest first first."
  var lead=/first$/.test(names[0])?names[0]:names[0]+" first";
  var txt=lead+names.slice(1).map(function(x){
    return ", then "+x; }).join("");
  var changed=state.sorts.join(",")!==DEFAULT_SORTS.join(",");
  return '<div class="ctl-row ctl-sortline"><span class="sort-says">'+
    'Showing '+esc(txt)+'.</span>'+
    (changed?'<button class="link-btn" data-act="sortreset">Reset to default</button>':'')+
    '</div>';
}
function controls(){
  var chips=Object.keys(state.filters).filter(function(k){return !state.filters[k].pinned;}).map(function(k){
    var f=state.filters[k];
    return '<button class="chip on" data-unfilter="'+esc(k)+'">'+esc(f.label)+'<span class="chip-x">&times;</span></button>';
  }).join("");
  // Exclusions read as removals, not selections, so they get their own
  // treatment rather than looking like another chosen filter.
  var exChips=state.excluded.map(function(name){
    return '<button class="chip excluded" data-unexclude="'+esc(name)+'" '+
      'title="Excluded. Click to put it back.">'+icon(I.minus,13)+esc(name)+'</button>';
  }).join("");
  var tierChips=["BIG_TECH","TOP_TIER","ESTABLISHED"].map(function(t){
    var on=state.tiers.indexOf(t)>=0;
    return '<button class="chip'+(on?(t==="BIG_TECH"?" on-gold":" on"):"")+'" data-tier="'+t+'">'+
      TIER_LABEL[t]+'</button>';
  }).join("");
  // Active filters read first: they are the only thing here that
  // changes what is on screen, and they were buried at the end of a
  // single run-on row behind everything that was merely available.
  var active=chips+exChips;
  return '<div class="controls">'+
    '<div class="ctl-row">'+
      '<label class="search">'+icon(I.search)+
        '<input id="q" type="search" placeholder="Search company, title, skill" value="'+esc(state.q)+'" aria-label="Search">'+
        (state.q?'':'<span class="kbd">/</span>')+
      '</label>'+
      (state.page==="applied"?'':'<div class="ctl-grp"><span class="ctl-label">Sort</span>'+
        SORTS.slice(0,4).map(function(o){
          var i=state.sorts.indexOf(o[0]);

function headCell(label,sortKey,cls){

function statusCell(j){

  if(state.prevVisit && new Date(j.first_seen_at)>state.prevVisit) return '<span class="badge new">NEW</span>';
  if(m.saved) return '<span class="badge saved">Saved</span>';
  if(m.reviewed) return '<span class="badge">Reviewed</span>';

// Several companies repost one role once per team or vertical: Sierra's
// "Software Engineer, Agent" across nine industries, TikTok's graduate
// roles across dozens of teams. Each is a real, separately-appliable
// posting, so nothing is discarded, but reading nine near-identical
// rows to realize they are one decision is the noise the user reported.
//
// Grouped by company and the title with its trailing qualifier removed:
// "Software Engineer, Agent - Healthcare" and "(Spanish speaking)" both
// stem to "software engineer, agent". Only titles sharing a stem with
// two or more others collapse, so two genuinely distinct roles that
// happen to share a prefix are left alone.
var GROUP_MIN=3;
function jobStem(title){
  var t=clean(title||"").replace(/\s*\([^)]*\)\s*$/,"").trim();
  var parts=t.split(/\s+[-\u2013]\s+/);
  return (parts.length>1?parts[0]:t).toLowerCase();
}
function jobGroupKey(j){ return (j.company||"")+"|"+jobStem(j.title); }
// Grouping is computed over whatever page of the queue is loaded, so a
// group can grow as more rows load in. Recomputed on every render
// rather than cached, since state.items changes under it.
function jobGroups(){
  var by={};
  state.items.forEach(function(j){
    var k=jobGroupKey(j);
    (by[k]=by[k]||[]).push(j);
  });
  return by;
}
function groupRepresentative(members){
  // The best-matched member leads, since that is the one worth reading
  // first; ties break by which was seen first.
  return members.slice().sort(function(a,b){
    var am=a.match_score==null?-1:a.match_score, bm=b.match_score==null?-1:b.match_score;
    if(bm!==am) return bm-am;
    return new Date(a.first_seen_at)-new Date(b.first_seen_at);
  })[0];
}
function groupHeaderRow(members,key){
  var lead=groupRepresentative(members);
  var open=!!state.expandedGroups[key];
  var tier=lead.company_tier||"OTHER";
  return '<tr class="row grp-head t-'+tier+'" data-group="'+esc(key)+'" tabindex="0">'+
    '<td class="c-rail"><div class="rail t-'+tier+'"></div></td>'+
    '<td class="c-co">'+companyCell(lead.company,tier)+'</td>'+
    '<td class="c-title" colspan="6">'+
      '<span class="grp-caret">'+(open?"\u25be":"\u25b8")+'</span> '+
      esc(clean(lead.title))+
      '<span class="grp-n">'+members.length+' similar openings</span>'+
    '</td>'+
    '<td class="c-act"></td></tr>';
}
function companyCell(name,tier){
  return '<div class="co-wrap">'+avatar(name)+'<div class="co-txt"><div class="co-name">'+esc(name)+'</div>'+
    (TIER_LABEL[tier]?'<div class="co-tier">'+TIER_LABEL[tier]+'</div>':'')+'</div></div>';
}
/* The score as a streaming title shows one: a percentage in the match
   colour, the tier beside it, a hairline of how full it is. */
function matchCell(j){
  var t=tierOf(j.match_score);
  if(t==="unscored") return '<span class="m-unscored">Not scored</span>';
  return '<div class="mt"><span class="m-n m-'+t+'">'+j.match_score+'<i>%</i></span>'+
    '<span class="m-tier m-'+t+'">'+tierLabel(t)+'</span></div>'+
    '<span class="m-bar m-'+t+'"><i style="width:'+Math.max(2,Math.min(100,j.match_score))+'%"></i></span>';
}
function jobRow(j,inGroup){
  var t=tierOf(j.match_score), m=markOf(j), fit=expFit(j), tier=j.company_tier||"OTHER";
  return '<tr class="row t-'+tier+(isDone(j)?" done":"")+(inGroup?" grp-member":"")+'" data-id="'+j.id+'" tabindex="0"'+
      ' aria-selected="'+(state.selectedId===j.id)+'">'+
    '<td class="c-rail"><div class="rail t-'+tier+'"></div></td>'+
    '<td class="c-co">'+companyCell(j.company,tier)+'</td>'+
    '<td class="c-title"><a class="j-title" href="#job/'+j.id+'" data-open="'+j.id+'">'+esc(clean(j.title))+'</a>'+
      (exportCaveat(j)?'<span class="badge export" title="'+esc(EXPORT_NOTE)+'">Export check</span>':'')+'</td>'+
    '<td class="c-loc">'+esc(j.location)+'</td>'+
    '<td class="c-exp"><span class="'+fit.c+'">'+esc(fit.t)+'</span></td>'+
    '<td class="c-match">'+matchCell(j)+'</td>'+
    '<td class="c-status">'+statusCell(j)+'</td>'+
    '<td class="c-when">'+ago(j.first_seen_at)+'</td>'+
    '<td class="c-act"><span class="acts">'+
      '<button class="iconbtn'+(m.saved?" on":"")+'" data-mark="saved" data-id="'+j.id+'" aria-label="Save">'+icon(I.star)+'</button>'+
      '<button class="iconbtn'+(m.reviewed?" on":"")+'" data-mark="reviewed" data-id="'+j.id+'" aria-label="Reviewed">'+icon(I.check)+'</button>'+
      '<button class="iconbtn'+(m.dismissed?" on":"")+'" data-mark="dismissed" data-id="'+j.id+'" aria-label="Not relevant">'+icon(I.x)+'</button>'+
      '<button class="iconbtn'+(m.applied?" on":"")+'" data-mark="applied" data-id="'+j.id+'" '+
        'title="'+(m.applied?"Applied "+shortDate(j.applied_at):"Mark applied (a)")+'" '+
        'aria-label="Mark applied" aria-pressed="'+(!!m.applied)+'">'+icon(I.briefcase)+'</button>'+
      '<a class="iconbtn" href="'+esc(j.official_url)+'" target="_blank" rel="noopener" data-stop aria-label="Open posting">'+icon(I.ext)+'</a>'+
    '</span></td></tr>';
}
function tableHead(){
  return '<thead><tr>'+
    '<th class="c-rail"></th>'+
    headCell("Company","company","c-co")+
    headCell("Role",null,"c-title")+

function skeleton(){
  var out="";
  for(var i=0;i<8;i++) out+='<tr class="sk-row"><td class="c-rail"></td><td colspan="8">'+
    '<div class="sk-b" style="width:'+(40+i*5)+'%"></div></td></tr>';
  return out;
}
/* Everything here is applicable: the gate already refuses anything
   asking four years or more. The split is between postings that say
   they suit the user and postings that say nothing at all, and the
   second group is shown, not hidden, because a terse posting with no
   experience bar is frequently open to a new grad. */
function inBand(j){
  return !!(j.is_early_career ||
    (j.required_experience_years!=null && j.required_experience_years<4));
}
function bandRow(n){
  return '<tr class="bandline"><td colspan="9"><span>'+
    'Below here, experience not stated'+(n?" · "+n+" more":"")+'</span></td></tr>';
}
function readRow(){
  return '<tr class="readline"><td colspan="9"><span>Last visit, '+clock(state.prevVisit)+'</span></td></tr>';
}
function queueTable(){
  if(state.loading) return '<table class="tbl">'+tableHead()+'<tbody>'+skeleton()+'</tbody></table>';
  if(!state.items.length) return emptyState();
  var readAt=-1;
  if(state.sorts[0]==="newest"&&state.prevVisit){
    for(var i=0;i<state.items.length;i++){
      if(new Date(state.items[i].first_seen_at)<=state.prevVisit){ readAt=i; break; }
    }
  }
  // Only the Queue groups. Saved, Applied and Archive are curated by
  // the user's own actions, and collapsing there could bury a distinct
  // vertical they specifically kept or applied to.
  var groups=state.page==="queue"?jobGroups():{};
  var rendered={};
  // Only meaningful while the experience sort is actually grouping
  // them; under any other order the two kinds are interleaved and one
  // line would be drawn in an arbitrary place.
  var bandAt=-1;
  if(state.sorts.indexOf("experience_fit_first")>=0){
    for(var b=1;b<state.items.length;b++){
      if(inBand(state.items[b-1])&&!inBand(state.items[b])){ bandAt=b; break; }
    }
  }
  var bandRest=bandAt<0?0:state.total-bandAt;
  var body=state.items.map(function(j,i){
    var pre=(i===readAt?readRow():"")+(i===bandAt?bandRow(bandRest):"");
    var key=jobGroupKey(j);
    var members=groups[key];
    if(!members||members.length<GROUP_MIN) return pre+jobRow(j);
    if(rendered[key]) return pre; // already shown as part of its group
    rendered[key]=true;
    var head=groupHeaderRow(members,key);
    if(!state.expandedGroups[key]) return pre+head;
    return pre+head+members.map(function(m){ return jobRow(m,true); }).join("");
  }).join("");
  var tail=state.loadingMore?"Loading more"
    :state.hasMore?("Showing "+state.items.length+" of "+state.total)
    :("End of list · "+state.items.length+" opportunit"+(state.items.length===1?"y":"ies"));
  return '<table class="tbl" id="main">'+tableHead()+'<tbody>'+body+'</tbody></table>'+
    '<div class="tail">'+tail+'</div>';
}
function box(h,p,a){ return '<div class="empty"><h3>'+h+'</h3><p>'+p+'</p>'+(a||"")+'</div>'; }
function emptyState(){
  var s=state.stats;
  if(state.page==="saved") return box("Nothing saved yet","Press s on any row, or use the star, to keep it here.");
  if(state.page==="applied"){
    if(state.externalApps.length){
      // History exists, it simply has no live posting behind it.
      return box("Nothing currently tracked",
        "None of the postings you applied to are still open in ACE. Your earlier applications are listed below.");
    }
    return box("No applications yet",
      "Mark a job applied from the queue, or press a on a selected row, and it lands here.");
  }
  if(state.page==="archive") return box("Nothing archived","Jobs you mark reviewed or not relevant land here.");
  if(state.q) return box('Nothing found for "'+esc(state.q)+'"',"No opportunities match this search.",
    '<button class="btn btn-secondary" data-act="clearq">Clear search</button>');
  if(state.tiers.length) return box("Nothing in these tiers",
    "No opportunities from the employer tiers you selected.",
    '<button class="btn btn-secondary" data-act="cleartiers">Clear tier filter</button>');
  if(state.view==="matched") return box("No highly matched opportunities right now",
    (s.match_medium||0)+" medium and "+(s.match_minimal||0)+" minimal matches are waiting in All.",
    '<button class="btn btn-secondary" data-view="all">View all</button>');
  if(state.view==="new") return box("Nothing new since your last visit",
    "ACE last pulled "+(state.lastPoll?ago(state.lastPoll)+" ago":"recently")+". You are up to date.",
    '<button class="btn btn-secondary" data-view="all">View all</button>');
  if(state.view==="latest"){
    var l=state.sessions[0], prior=state.sessions.filter(function(x){return x.qualifying_discovered>0;})[0];
    return box("Latest pull, "+(l?clock(l.started_at):"not recorded"),
      (l?(l.jobs_discovered+" opportunities found, none passed your filters."):"No pull recorded yet.")+
      (prior?(" The last pull that added anything was "+dayName(prior.started_at).toLowerCase()+" at "+clock(prior.started_at)+"."):""),
      '<button class="btn btn-secondary" data-nav="pulls">See all pulls</button> '+
      '<button class="btn btn-ghost" data-view="all">Back to all</button>');
  }
  return box("Nothing here","No opportunities match the current filters.",
    '<button class="btn btn-secondary" data-act="clearall">Clear filters</button>');
}

function queuePage(){

/* The match as a ring: how full is the score, at a glance. Unscored is
   a dotted, empty ring and says so, never a zero. */
function scoreRing(score){
  var t=tierOf(score), C=2*Math.PI*40;
  if(t==="unscored") return '<div class="ring m-minimal" aria-label="Not scored">'+
    '<svg width="92" height="92" viewBox="0 0 92 92"><circle class="trk" cx="46" cy="46" r="40" fill="none" '+
    'stroke-width="6" stroke-dasharray="2 6"/></svg><span class="score-n" style="font-size:18px">n/a</span></div>';
  var fill=Math.max(0,Math.min(100,score))/100*C;
  return '<div class="ring m-'+t+'" aria-label="Match '+score+' percent">'+
    '<svg width="92" height="92" viewBox="0 0 92 92">'+
      '<circle class="trk" cx="46" cy="46" r="40" fill="none" stroke-width="6"/>'+
      '<circle class="val" cx="46" cy="46" r="40" fill="none" stroke-width="6" '+
        'stroke-dasharray="'+fill.toFixed(1)+' '+C.toFixed(1)+'"/></svg>'+
    '<span class="score-n m-'+t+'">'+score+'</span></div>';
}
