<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 26 L17 9 L26 26' fill='none' stroke='%23F2F0EB' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='17' cy='4.5' r='2.5' fill='%23C9A961'/%3E%3C/svg%3E">
<style>
/* ============================================================
   ACE design tokens
   Light palette on bare :root. Dark redefines tokens only.
   ============================================================ */
:root {
  --canvas:#FCFAF6; --surface-1:#FFFFFF; --surface-2:#F5F2EB;
  --raised:#FFFFFF; --hover:#EFEBE2; --selected:#FBF2DC;
  --border-subtle:#E9E4D9; --border:#DBD5C8; --border-strong:#BEB6A6;
  --text:#1A1917; --text-secondary:#55524B; --text-muted:#6B6760;
  --gold-text:#7A5F18; --gold-solid:#6E5615; --gold-rail:#9C7A22;
  --gold-surface:#FAF1D9; --gold-on-solid:#FFFFFF;
  --success:#2E7A50; --warning:#96631F; --danger:#A63F36; --info:#35608F;
  --shadow-sm:0 1px 2px rgba(26,25,23,.06);
  --shadow-md:0 4px 12px rgba(26,25,23,.08);
  --shadow-lg:0 12px 32px rgba(26,25,23,.12);
  --backdrop:rgba(26,25,23,.32);

  --r-sm:4px; --r-md:6px; --r-lg:10px;
  --fast:90ms; --base:140ms; --slow:220ms;
  --ease-out:cubic-bezier(.2,0,0,1); --ease-in:cubic-bezier(.4,0,1,1);
  --ease-emph:cubic-bezier(.32,.72,0,1);
  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --w-side:232px; --w-list:480px;
}
:root:not([data-theme="light"]) {
  --canvas:#0A0A0B; --surface-1:#121214; --surface-2:#17181A;
  --raised:#1D1E21; --hover:#212226; --selected:#262218;
  --border-subtle:#1F2023; --border:#2A2C31; --border-strong:#3B3E44;
  --text:#F2F0EB; --text-secondary:#A9A69F; --text-muted:#8B8984;
  --gold-text:#C9A961; --gold-solid:#C9A961; --gold-rail:#C9A961;
  --gold-surface:#1E1A10; --gold-on-solid:#0A0A0B;
  --success:#57A06F; --warning:#C98F45; --danger:#C85F55; --info:#6293C9;
  --shadow-sm:none; --shadow-md:0 4px 12px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.65);
  --backdrop:rgba(10,10,11,.5);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --canvas:#FCFAF6; --surface-1:#FFFFFF; --surface-2:#F5F2EB;
    --raised:#FFFFFF; --hover:#EFEBE2; --selected:#FBF2DC;
    --border-subtle:#E9E4D9; --border:#DBD5C8; --border-strong:#BEB6A6;
    --text:#1A1917; --text-secondary:#55524B; --text-muted:#6B6760;
    --gold-text:#7A5F18; --gold-solid:#6E5615; --gold-rail:#9C7A22;
    --gold-surface:#FAF1D9; --gold-on-solid:#FFFFFF;
    --success:#2E7A50; --warning:#96631F; --danger:#A63F36; --info:#35608F;
    --shadow-sm:0 1px 2px rgba(26,25,23,.06);
    --shadow-md:0 4px 12px rgba(26,25,23,.08);
    --shadow-lg:0 12px 32px rgba(26,25,23,.12);
    --backdrop:rgba(26,25,23,.32);
  }
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--canvas);color:var(--text);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;border-radius:var(--r-sm)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-40px;z-index:100;background:var(--raised);color:var(--text);padding:8px 12px;border-radius:var(--r-md);border:1px solid var(--border);transition:top var(--fast)}
.skip:focus{top:8px}

/* ============================ shell ============================ */
.app{display:grid;grid-template-columns:var(--w-side) var(--w-list) minmax(520px,1fr);grid-template-rows:100vh;grid-template-rows:100dvh;height:100vh;height:100dvh}
.side,.list-col,.detail,.wide{min-height:0}

/* ---------- sidebar ---------- */
.side{
  display:flex;flex-direction:column;padding:20px 12px 12px;
  border-right:1px solid var(--border-subtle);min-width:0;
}
.brand{display:flex;align-items:center;gap:9px;padding:0 8px 24px;user-select:none}
.brand svg{flex:none}
.brand-name{font-size:14px;font-weight:600;letter-spacing:.14em}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-item{
  display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;
  border-radius:var(--r-md);color:var(--text-secondary);
  font-size:13.5px;font-weight:450;letter-spacing:-.003em;
  border-left:2px solid transparent;transition:background var(--fast) var(--ease-out),color var(--fast) var(--ease-out);
  text-align:left;width:100%;
}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item[aria-current="page"]{
  background:var(--selected);color:var(--text);font-weight:500;
  border-left-color:var(--gold-rail);
}
.nav-item[aria-current="page"] .nav-label{color:var(--gold-text)}
.nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-count{font-size:11.5px;color:var(--text-muted);letter-spacing:.01em}
.nav-rule{height:1px;background:var(--border-subtle);margin:12px 8px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:1px;padding-top:12px}

/* ---------- list column ---------- */
.list-col{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border-subtle)}
.list-head{padding:20px 20px 0;flex:none}
.head-top{display:flex;align-items:baseline;gap:12px}
.page-title{font-size:20px;font-weight:600;letter-spacing:-.011em;margin:0}
.head-total{margin-left:auto;font-size:13px;color:var(--text-muted)}
.head-live{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;letter-spacing:.01em;color:var(--text-secondary);border-radius:var(--r-md);padding:2px 4px;margin-left:-4px;transition:background var(--fast)}
button.live:hover{background:var(--hover)}
.dot{width:6px;height:6px;border-radius:999px;background:var(--gold-rail);flex:none}
.dot.stale{background:var(--text-muted)}
.since{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--text-secondary)}

/* segmented view control */
.views{display:flex;gap:2px;margin-top:14px;background:var(--surface-2);padding:3px;border-radius:var(--r-md);border:1px solid var(--border-subtle)}
.view{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  height:28px;padding:0 8px;border-radius:var(--r-sm);
  font-size:12.5px;font-weight:450;color:var(--text-secondary);white-space:nowrap;
  transition:background var(--fast) var(--ease-out),color var(--fast) var(--ease-out);
}
.view:hover{color:var(--text)}
.view[aria-selected="true"]{background:var(--gold-surface);color:var(--gold-text);font-weight:500}
.view-n{font-family:var(--mono);font-size:11px;opacity:.85}

/* filter rail */
.rail{display:flex;align-items:center;gap:6px;margin-top:12px;padding-bottom:12px;flex-wrap:wrap}
.search{
  display:flex;align-items:center;gap:7px;height:28px;padding:0 9px;flex:1;min-width:140px;
  background:var(--surface-2);border:1px solid var(--border-subtle);border-radius:var(--r-sm);
  transition:border-color var(--fast)
}
.search:focus-within{border-color:var(--border-strong)}
.search input{flex:1;min-width:0;background:none;border:none;font-size:12.5px;padding:0}
.search input::placeholder{color:var(--text-muted)}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);border:1px solid var(--border-subtle);border-radius:3px;padding:1px 4px;flex:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
  border:1px solid var(--border-subtle);border-radius:var(--r-md);background:transparent;
  font-size:12.5px;color:var(--text-secondary);white-space:nowrap;
  transition:background var(--fast) var(--ease-out),border-color var(--fast) var(--ease-out),color var(--fast) var(--ease-out);
}
.chip:hover{background:var(--hover);border-color:var(--border);color:var(--text)}
.chip.on{background:var(--surface-2);border-color:var(--border-strong);color:var(--text);font-weight:500}
.chip-n{font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-left:-2px}
.chip.on .chip-n{color:var(--text-secondary)}
.chip-x{color:var(--text-muted);font-size:13px;line-height:1;margin-right:-2px}
.chip-x:hover{color:var(--text)}
.link-btn{font-size:12.5px;color:var(--text-muted);padding:0 4px;border-radius:var(--r-sm);transition:color var(--fast)}
.link-btn:hover{color:var(--text)}

/* ---------- list ---------- */
.list-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.list{list-style:none;margin:0;padding:0 0 40px}
.row{
  position:relative;display:grid;grid-template-columns:1fr auto;
  gap:2px 12px;padding:12px 20px 12px 18px;cursor:default;
  border-left:2px solid transparent;border-bottom:1px solid var(--border-subtle);
  transition:background var(--fast) var(--ease-out);
}
.row:hover{background:var(--hover)}
.row[aria-selected="true"]{background:var(--selected)}
.row.tier-high{border-left-color:var(--gold-rail)}
.row.tier-medium{border-left-color:var(--border-strong)}
.row.tier-minimal{border-left-color:var(--border)}
.row.tier-unscored{border-left-style:dotted;border-left-color:var(--border-strong)}
.row.done{opacity:.42}
.r-title{
  grid-column:1;font-size:14.5px;font-weight:500;letter-spacing:-.006em;line-height:20px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;
}
.r-score{grid-column:2;grid-row:1;text-align:right;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.04em}
.r-score .n{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.01em;margin-left:5px}
.tier-high .r-score{color:var(--gold-text)}
.tier-medium .r-score{color:var(--text)}
.tier-minimal .r-score{color:var(--text-muted)}
.tier-unscored .r-score{color:var(--text-muted);font-weight:400;font-style:italic;letter-spacing:0;text-transform:none;font-size:12px}
.r-meta{grid-column:1;font-size:12.5px;color:var(--text-secondary);line-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-meta b{font-weight:600;color:var(--text-secondary)}
.exp-early{color:var(--text);font-weight:600}
.exp-known{color:var(--text-secondary)}
.exp-unknown{color:var(--text-muted);font-style:italic}
.r-side{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:flex-end;gap:6px;white-space:nowrap}
.badge{
  display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--text-secondary);
  font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
}
.badge.new{background:transparent;color:var(--text);padding:0}
.badge.warn{background:transparent;color:var(--warning);border:1px solid var(--warning);text-transform:none;letter-spacing:0;font-weight:500}
.r-note{font-size:11.5px;color:var(--text-muted);font-style:italic}
.r-acts{display:none;gap:2px;align-items:center}
.row:hover .r-acts,.row[aria-selected="true"] .r-acts{display:flex}
.row:hover .r-when,.row[aria-selected="true"] .r-when{display:none}
.iconbtn{
  width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-md);color:var(--text-muted);
  transition:background var(--fast) var(--ease-out),color var(--fast) var(--ease-out);
}
.iconbtn:hover{background:var(--border-subtle);color:var(--text)}
.iconbtn.on{color:var(--gold-text)}
.iconbtn.saved svg{fill:currentColor}
.list-end{
  padding:18px 20px 26px;text-align:center;font-family:var(--mono);
  font-size:11.5px;letter-spacing:.01em;color:var(--text-muted);
}
.readline{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;user-select:none}
.readline::before,.readline::after{content:"";height:1px;background:var(--border-subtle);flex:1}
.readline span{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap}

/* ---------- detail ---------- */
.detail{display:flex;flex-direction:column;min-width:0;background:var(--canvas)}
.d-scroll{flex:1;overflow-y:auto;padding:24px 28px 24px}
.d-nav{display:flex;align-items:center;gap:2px;justify-content:flex-end;margin-bottom:4px}
.d-title{font-size:19px;font-weight:600;letter-spacing:-.012em;line-height:26px;margin:0 0 6px;overflow-wrap:anywhere}
.d-sub{font-size:14px;font-weight:500;color:var(--text-secondary);margin-bottom:20px}
.scorecard{
  background:var(--surface-2);border:1px solid var(--border-subtle);border-radius:var(--r-lg);
  padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:24px;
}
.sc-tier{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.sc-sub{font-size:12.5px;color:var(--text-muted);margin-top:3px}
.sc-n{margin-left:auto;font-family:var(--mono);font-size:28px;font-weight:400;letter-spacing:-.01em;line-height:1}
.high .sc-tier,.high .sc-n{color:var(--gold-text)}
.medium .sc-tier,.medium .sc-n{color:var(--text)}
.minimal .sc-tier,.minimal .sc-n{color:var(--text-muted)}
.unscored .sc-tier{color:var(--text-muted)}
.unscored .sc-n{font-size:13px;color:var(--text-muted);font-style:italic}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin:0 0 10px}
.sect{margin-bottom:22px}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skill{
  display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--border-subtle);font-size:12.5px;color:var(--text)
}
.skill.miss{background:transparent;color:var(--text-muted)}
.rel{display:flex;flex-direction:column;gap:7px}
.rel-row{display:flex;align-items:baseline;gap:8px;font-size:13px;flex-wrap:wrap}
.rel-via{font-size:12.5px;color:var(--text-muted)}
.d-rule{height:1px;background:var(--border-subtle);margin:24px 0}
.kv{display:grid;grid-template-columns:132px 1fr;gap:8px 16px;font-size:13px}
.kv dt{color:var(--text-muted)}
.kv dd{margin:0;color:var(--text);font-family:var(--mono);font-size:12.5px}
.why{font-size:13px;color:var(--text-secondary);line-height:20px}
.d-foot{
  flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:16px 28px;border-top:1px solid var(--border-subtle);background:var(--canvas);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 14px;
  border-radius:var(--r-md);font-size:13px;font-weight:500;letter-spacing:-.002em;
  border:1px solid transparent;
  transition:background var(--fast) var(--ease-out),border-color var(--fast) var(--ease-out),color var(--fast) var(--ease-out);
}
.btn-primary{height:36px;padding:0 16px;background:var(--gold-solid);color:var(--gold-on-solid);font-weight:500}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary svg{transition:transform var(--fast) var(--ease-out)}
.btn-primary:hover svg{transform:translate(1px,-1px)}
.btn-secondary{background:var(--raised);border-color:var(--border);color:var(--text)}
.btn-secondary:hover{background:var(--hover)}
.btn-ghost{color:var(--text-secondary)}
.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-ghost.on{color:var(--gold-text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.info{
  width:16px;height:16px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--border-strong);color:var(--text-muted);font-size:10px;font-weight:600;
  transition:color var(--fast),border-color var(--fast)
}
.info:hover{color:var(--text);border-color:var(--text-muted)}

/* ---------- feed / pages ---------- */
.page-scroll{flex:1;overflow-y:auto;padding:0 0 60px}
.wide{grid-column:2 / -1;display:flex;flex-direction:column;min-width:0}
.wide .list-head{padding:20px 28px 0}
.pad{padding:0 28px}
.sess{display:grid;grid-template-columns:88px 1fr;gap:0 16px;padding:14px 28px;border-bottom:1px solid var(--border-subtle)}
.sess-t{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);padding-top:2px;letter-spacing:.01em}
.sess-h{font-size:13px;color:var(--text);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sess-none{font-size:12.5px;color:var(--text-muted);margin-top:3px}
.daybar{padding:22px 28px 8px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted)}
.bars{display:flex;flex-direction:column;gap:9px;margin:14px 0 4px}
.bar-row{display:grid;grid-template-columns:96px 1fr 52px;gap:12px;align-items:center;font-size:13px}
.bar-track{height:8px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:var(--border-strong);border-radius:2px}
.bar-fill.dotted{background:repeating-linear-gradient(90deg,var(--border-strong) 0 3px,transparent 3px 6px)}
.bar-n{font-family:var(--mono);font-size:12.5px;color:var(--text-secondary);text-align:right}
.gap-row{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-subtle);font-size:13px}
.gap-n{font-family:var(--mono);font-size:12.5px;color:var(--text-muted)}
.foot-note{font-size:12.5px;color:var(--text-muted);padding:16px 28px 0;border-top:1px solid var(--border-subtle);margin-top:20px}

/* ---------- empty / skeleton / toast ---------- */
.empty{padding:28px 20px;max-width:420px}
.empty h3{font-size:14.5px;font-weight:500;margin:0 0 6px}
.empty p{font-size:13px;color:var(--text-secondary);margin:0 0 14px;line-height:20px}
.sk{padding:12px 20px 12px 18px;border-left:2px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)}
.sk-b{height:11px;background:var(--surface-2);border-radius:3px}
.sk-b+.sk-b{margin-top:9px}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;
  display:flex;align-items:center;gap:14px;padding:10px 14px;
  background:var(--raised);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);font-size:13px;
  animation:rise var(--base) var(--ease-out);
}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.palette-wrap{position:fixed;inset:0;z-index:80;background:var(--backdrop);display:flex;justify-content:center;padding-top:14vh}
.palette{
  width:min(560px,92vw);height:max-content;max-height:60vh;display:flex;flex-direction:column;
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);overflow:hidden;animation:pop var(--base) var(--ease-out);
}
.palette input{
  border:none;border-bottom:1px solid var(--border-subtle);background:none;
  padding:14px 16px;font-size:14px;width:100%;
}
.palette input::placeholder{color:var(--text-muted)}
.palette-list{overflow-y:auto;padding:6px}
.pal-opt{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:var(--r-md);font-size:13px;color:var(--text-secondary)}
.pal-opt:hover,.pal-opt.on{background:var(--hover);color:var(--text)}
.pal-none{padding:16px;font-size:13px;color:var(--text-muted)}
.pop{
  position:fixed;z-index:70;background:var(--surface-1);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:16px;max-width:320px;
  animation:pop var(--base) var(--ease-out);
}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.pop h4{font-size:13px;font-weight:600;margin:0 0 8px}
.pop p{font-size:12.5px;color:var(--text-secondary);margin:0 0 8px;line-height:18px}
.pop p:last-child{margin-bottom:0}
.pop-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;margin:0 -6px}
.pop-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-sm);font-size:12.5px;text-align:left;width:100%;transition:background var(--fast)}
.pop-opt:hover{background:var(--hover)}
.pop-opt .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-muted)}
.pop-group{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);padding:10px 8px 4px}
.mobile-only{display:none}
.arrive{animation:arrive 320ms var(--ease-out) 400ms both}
@keyframes arrive{from{box-shadow:inset 2px 0 0 var(--gold-rail)}to{box-shadow:inset 2px 0 0 transparent}}

/* ============================ responsive ============================ */
@media (max-width:1439px){:root{--w-list:440px}}
@media (max-width:1159px){
  :root{--w-side:56px;--w-list:400px}
  .brand-name,.nav-label,.nav-count{display:none}
  .nav-item{justify-content:center;padding:0;border-left-width:0;position:relative}
  .nav-item[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:2px;background:var(--gold-rail)}
  .side{padding:20px 8px 12px;align-items:center}
  .brand{padding:0 0 24px}
}
.scrim{position:fixed;inset:0;z-index:45;background:var(--backdrop)}
@media (min-width:1024px){.scrim{display:none}}
@media (max-width:1023px){
  .app{grid-template-columns:1fr}
  .side{
    display:flex;position:fixed;left:0;top:0;bottom:0;width:248px;z-index:50;
    background:var(--canvas);border-right:1px solid var(--border);
    transform:translateX(-100%);transition:transform var(--slow) var(--ease-emph);
  }
  .side.open{transform:translateX(0)}
  .list-col{border-right:none}
  .detail{position:fixed;inset:0;z-index:40;transform:translateX(100%);transition:transform var(--slow) var(--ease-emph);border-left:none}
  .detail.open{transform:translateX(0)}
  .wide{grid-column:1}
  .mobile-only{display:flex}
  .list-head{padding:14px 16px 0}
  .row{padding:14px 16px 14px 14px;grid-template-columns:1fr}
  .r-score{grid-column:1;grid-row:3;text-align:left;margin-top:4px}
  .r-side{grid-column:1;grid-row:4;justify-content:flex-start;margin-top:4px}
  /* Raw source locations can run to three lines ("USA-TX Plano Legacy
     Drive Suite 700; USA-California-San Jose-1320 Ridder Park Drive"),
     which triples the row height. Two lines is the contract. */
  .r-meta{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .r-acts{display:flex}
  .row:hover .r-when,.row[aria-selected="true"] .r-when{display:inline}
  .iconbtn{width:44px;height:44px}
  .views{overflow-x:auto;scrollbar-width:none}
  .views::-webkit-scrollbar{display:none}
  .view{flex:none}
  .view-n{display:none}
  .d-scroll{padding:16px 20px}
  .d-foot{padding:12px 20px}
  .btn-primary{flex:1}
  .sess{grid-template-columns:1fr;padding:14px 16px}
  .sess-t{padding-bottom:6px}
  .daybar,.pad,.wide .list-head,.foot-note{padding-left:16px;padding-right:16px}
  .bar-row{grid-template-columns:88px 1fr 44px}
}
.topbar{
  display:none;align-items:center;gap:10px;padding:10px 16px;
  border-bottom:1px solid var(--border-subtle);flex:none
}
@media (max-width:1023px){
  .topbar{display:flex}
  /* The collapsed-rail rule hides brand text; the top bar needs it back. */
  .topbar .brand-name{display:inline;letter-spacing:.14em}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:80ms!important}
  .detail{transition:none}
  .arrive{animation:none}
}
</style>
</head>
<body>
<a class="skip" href="#list">Skip to opportunities</a>
<div class="app" id="app"></div>
<script>
"use strict";
/* ============================================================
   ACE client
   ============================================================ */
var API = "";
var HIGH = 70, MED = 45;
// One page of rows. Fetched on demand as the list is scrolled, so the
// queue is never silently truncated at the first page.
var PAGE = 60;

var state = {
  page: "queue", view: "all",
  q: "", sort: "best_match",
  filters: {},          // key -> {type,value,label}
  items: [], total: 0, loading: true, loadingMore: false, hasMore: false, offset: 0, reqToken: 0,
  selectedId: null,
  stats: {}, sessions: [], lastPoll: null,
  resume: null, gap: [],
  facets: {companies:[],sources:[],families:[]},
  markCounts: {saved:0,archived:0,applied:0}, prevVisit: null,
  detailOpen: false, menuOpen: false, toast: null
};

/* ---------------- storage ---------------- */
function load(k, d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function initVisit(){
  var now = Date.now();
  var cur = load("ace.visit.current", null);
  var prev = load("ace.visit.previous", null);
  // A refresh inside 30 minutes keeps the same marker, so the read line
  // does not vanish the moment the page is reloaded.
  if (cur && (now - cur) < 30*60*1000) { state.prevVisit = prev ? new Date(prev) : null; }
  else { if (cur) { save("ace.visit.previous", cur); prev = cur; }
         state.prevVisit = prev ? new Date(prev) : null; }
  save("ace.visit.current", now);
}

/* ---------------- helpers ---------------- */
function tierOf(s){ if(s==null) return "unscored"; if(s>=HIGH) return "high"; if(s>=MED) return "medium"; return "minimal"; }
function tierLabel(t){ return t==="high"?"HIGH":t==="medium"?"MEDIUM":t==="minimal"?"MINIMAL":"Not scored"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
/* Sources sometimes ship em dashes in titles. ACE never renders one. */
function clean(s){ return String(s==null?"":s)
  .replace(/\s*[—–]\s*/g, ", ")   // ACE never renders an em dash
  .replace(/\s+([,;:])/g, "$1")   // "Engineer , Service" -> "Engineer, Service"
  .replace(/\s{2,}/g, " ").trim(); }
function ago(iso){
  if(!iso) return "";
  var d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<60) return "just now";
  if(d<3600) return Math.floor(d/60)+"m ago";
  if(d<86400) return Math.floor(d/3600)+"h ago";
  if(d<86400*7) return Math.floor(d/86400)+"d ago";
  return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function shortDate(d){ return d? new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : ""; }
function clock(d){ return new Date(d).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function dayName(d){
  var t=new Date(), y=new Date(Date.now()-86400000), x=new Date(d);
  if(x.toDateString()===t.toDateString()) return "Today";
  if(x.toDateString()===y.toDateString()) return "Yesterday";
  return x.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
}
/* Experience fit is the user's standing constraint, so every row states
   it rather than leaving a gap. Three honest states: labelled early
   career, an extracted ceiling, or nothing stated. Unlabelled roles are
   kept (ACE does not drop them), so "not stated" must read as neutral
   and not as a rejection. */
function expFit(j){
  if(j.is_early_career) return {text:"Early career", cls:"exp-early"};
  if(j.required_experience_years!=null)
    return {text:j.required_experience_years+" yrs max", cls:"exp-known"};
  return {text:"Experience not stated", cls:"exp-unknown"};
}
function yoe(j){ return expFit(j).text; }
/* The split pane exists at exactly the width the CSS says it does.
   Reading the same media query keeps JS and CSS from drifting, and
   avoids window.innerWidth, which some environments report as 0. */
function isWide(){ return window.matchMedia("(min-width: 1024px)").matches; }
/* Marks ride on the listing row rather than a separate client store,
   so what is drawn is always what the server holds. */
function markOf(j){
  return {
    saved: !!j.is_saved,
    reviewed: j.review_state==="reviewed",
    dismissed: j.review_state==="dismissed",
    applied: !!j.applied_at
  };
}
function isDone(j){ return j.review_state==="reviewed" || j.review_state==="dismissed"; }
function jobById(id){
  for(var i=0;i<state.items.length;i++) if(state.items[i].id===id) return state.items[i];
  return null;
}
function icon(p, extra){
  return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"'+(extra||"")+'>'+p+'</svg>';
}
var I = {
  star:'<path d="M8 2l1.8 3.9 4.2.5-3.1 2.9.8 4.2L8 11.5 4.3 13.5l.8-4.2L2 6.4l4.2-.5z"/>',
  check:'<path d="M3 8.5l3.2 3.2L13 5"/>',
  x:'<path d="M4 4l8 8M12 4l-8 8"/>',
  ext:'<path d="M6 3h7v7M13 3L6.5 9.5"/><path d="M11 9.5V13H3V5h3.5"/>',
  left:'<path d="M10 3L5 8l5 5"/>', right:'<path d="M6 3l5 5-5 5"/>',
  search:'<circle cx="7.2" cy="7.2" r="4.2"/><path d="M10.4 10.4L13.5 13.5"/>',
  plus:'<path d="M8 3.5v9M3.5 8h9"/>',
  sun:'<circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2L3.1 3.1"/>',
  gear:'<circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v1.8M8 12.7v1.8M14.5 8h-1.8M3.3 8H1.5M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3M12.6 12.6l-1.3-1.3M4.7 4.7L3.4 3.4"/>',
  menu:'<path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/>',
  queue:'<path d="M2.5 4h11M2.5 8h11M2.5 12h7"/>',
  feed:'<path d="M3 12.5V7M8 12.5V3.5M13 12.5V9.5"/>',
  doc:'<path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3"/>',
  grid:'<path d="M3 3h4v4H3zM9 3h4v4H9zM3 9h4v4H3zM9 9h4v4H9z"/>'
};

/* ---------------- data ---------------- */
function params(extra){
  var p = new URLSearchParams();
  if(state.q) p.set("q", state.q);
  Object.keys(state.filters).forEach(function(k){
    var f=state.filters[k];
    if(f.type==="flag") p.set(f.param,"true"); else p.set(f.param, f.value);
  });
  if(extra) Object.keys(extra).forEach(function(k){ if(extra[k]!=null) p.set(k, extra[k]); });
  return p;
}
function viewParams(){
  var e = {sort:state.sort, limit:PAGE, offset:state.offset};
  if(state.page==="saved"){ e.mark="saved"; return e; }
  if(state.page==="archive"){ e.mark="archived"; return e; }
  if(state.view==="matched"){ e.min_match=HIGH; e.sort="best_match"; }
  if(state.view==="new" && state.prevVisit){ e.since=state.prevVisit.toISOString(); e.sort="newest"; }
  if(state.view==="latest"){ var s=state.sessions[0]; if(s) e.session_id=s.id; e.sort="newest"; }
  return e;
}
function get(path, p){
  return fetch(API+path+(p&&p.toString()?"?"+p.toString():"")).then(function(r){
    if(!r.ok) throw new Error(r.status); return r.json(); });
}
function loadJobs(append){
  if(append){ if(state.loadingMore || !state.hasMore) return Promise.resolve(); state.loadingMore = true; }
  else { state.offset = 0; state.loading = true; state.items = []; state.reqToken++; render(); }
  // Two loads can be in flight at once (navigating and switching view,
  // or typing quickly). Without a token the slower, older response wins
  // and the list disagrees with the controls above it.
  var token = state.reqToken;
  return get("/api/jobs", params(viewParams())).then(function(d){
    if(token !== state.reqToken) return;
    state.items = append ? state.items.concat(d.items) : d.items;
    state.offset = state.offset + d.items.length;
    state.hasMore = d.has_more;
    state.total = d.total;
    state.loading = false; state.loadingMore = false;

    if(state.selectedId && !state.items.some(function(j){return j.id===state.selectedId;})) state.selectedId = null;
    if(!state.selectedId && state.items.length && isWide()) state.selectedId = state.items[0].id;
    render(append);
  }).catch(function(){
    if(token !== state.reqToken) return;
    state.loading=false; state.loadingMore=false; render();
  });
}
function loadShell(){
  return Promise.all([
    get("/api/stats", params()).then(function(d){ state.stats=d; state.lastPoll=d.last_poll_at; }),
    get("/api/sessions", new URLSearchParams({limit:"25"})).then(function(d){ state.sessions=d.sessions||[]; if(d.last_poll_at) state.lastPoll=d.last_poll_at; }),
    get("/api/facets").then(function(d){ state.facets=d; }),
    get("/api/resume").then(function(d){ state.resume=d.resume; state.gap=d.skills_gap||[]; }),
    get("/api/marks").then(function(d){ state.markCounts=d; })
  ]).catch(function(){});
}

/* ---------------- render: shell ---------------- */
function navItem(id,label,count,ic){
  var on = state.page===id;
  return '<button class="nav-item" data-nav="'+id+'"'+(on?' aria-current="page"':'')+' title="'+esc(label)+'">'+
    icon(ic)+'<span class="nav-label">'+esc(label)+'</span>'+
    (count!=null?'<span class="nav-count num">'+count+'</span>':'')+'</button>';
}
function sidebar(){
  var s=state.stats;
  var open=state.menuOpen?" open":"";
  var savedN = state.markCounts.saved;
  var archN  = state.markCounts.archived;
  return '<nav class="side'+open+'" aria-label="Main">'+
    '<div class="brand">'+
      '<svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">'+
      '<path d="M6 26 L17 9 L26 26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<circle cx="17" cy="4.5" r="2.5" fill="var(--gold-rail)"/></svg>'+
      '<span class="brand-name">ACE</span></div>'+
    '<div class="nav">'+
      navItem("queue","Queue", s.qualifying_active_jobs!=null?s.qualifying_active_jobs:"", I.queue)+
      navItem("feed","Feed",null,I.feed)+
      navItem("resumes","Resumes",null,I.doc)+
      navItem("skills","Skills",null,I.grid)+
    '</div><div class="nav-rule"></div><div class="nav">'+
      navItem("saved","Saved",savedN||null,I.star)+
      navItem("archive","Archive",archN||null,I.check)+
    '</div>'+
    '<div class="side-foot">'+
      '<button class="nav-item" data-act="live"><span class="dot'+(isStale()?' stale':'')+'"></span>'+
        '<span class="nav-label">'+(isStale()?"Delayed":"Live")+'</span></button>'+
      '<button class="nav-item" data-act="theme">'+icon(I.sun)+'<span class="nav-label">Theme</span></button>'+
      '<button class="nav-item" data-act="settings"'+(state.page==="settings"?' aria-current="page"':'')+'>'+
        icon(I.gear)+'<span class="nav-label">Settings</span></button>'+
    '</div></nav>';
}
function isStale(){
  if(!state.lastPoll) return true;
  return (Date.now()-new Date(state.lastPoll).getTime()) > 45*60*1000;
}
function liveStrip(){
  var stale=isStale();
  return '<button class="live" data-act="live" title="Discovery status">'+
    '<span class="dot'+(stale?' stale':'')+'"></span>ACE Live · '+
    (state.lastPoll?("Updated "+ago(state.lastPoll)):"No pull recorded")+'</button>';
}

/* ---------------- render: queue ---------------- */
function newCount(){
  if(!state.prevVisit) return 0;
  var t=state.prevVisit.getTime();
  return state.items.filter(function(j){ return new Date(j.first_seen_at).getTime()>t; }).length;
}
function viewsBar(){
  var s=state.stats, latest=state.sessions[0];
  var defs=[
    ["all","All", s.qualifying_active_jobs],
    ["matched","Highly matched", s.match_high],
    ["new","New", state.prevVisit?newCount():null],
    ["latest","Latest pull", latest?latest.qualifying_open_now:null]
  ];
  return '<div class="views" role="tablist" aria-label="Queue view">'+defs.map(function(d,i){
    var on=state.view===d[0];
    return '<button class="view" role="tab" data-view="'+d[0]+'" aria-selected="'+on+'" title="'+esc(d[1])+' ('+(i+1)+')">'+
      '<span>'+d[1]+'</span>'+(d[2]!=null?'<span class="view-n">'+d[2]+'</span>':'')+'</button>';
  }).join("")+'</div>';
}
function railBar(){
  var chips = Object.keys(state.filters).filter(function(k){
    return !state.filters[k].pinned;
  }).map(function(k){
    var f=state.filters[k];
    return '<span class="chip on">'+esc(f.label)+
      '<button class="chip-x" data-unfilter="'+esc(k)+'" aria-label="Remove filter '+esc(f.label)+'">&times;</button></span>';
  }).join("");
  var many = Object.keys(state.filters).filter(function(k){return !state.filters[k].pinned;}).length>1;
  return '<div class="rail">'+
    '<label class="search">'+icon(I.search)+
      '<input id="q" type="search" placeholder="Search company, title, skill" value="'+esc(state.q)+'" aria-label="Search opportunities">'+
      '<span class="kbd">/</span></label>'+
    '<button class="chip'+(state.filters.early_career_only?" on":"")+'" data-act="toggleearly"'+
      ' aria-pressed="'+(!!state.filters.early_career_only)+'">Early career'+
      (state.stats.labelled_new_grad!=null?'<span class="chip-n">'+state.stats.labelled_new_grad+'</span>':'')+
    '</button>'+
    chips+
    '<button class="chip" data-act="filters">'+icon(I.plus)+'Filter</button>'+
    (many?'<button class="link-btn" data-act="clearfilters">Clear all</button>':'')+
    '<button class="link-btn" data-act="sort" title="Change sort">'+sortLabel()+'</button>'+
  '</div>';
}
function sortLabel(){
  return {best_match:"Best match",newest:"Newest",oldest:"Oldest",new_grad_first:"New grad first"}[state.sort]||"Sort";
}
function jobRow(j, showRead){
  var t=tierOf(j.match_score), m=markOf(j);
  var isNew = state.prevVisit && new Date(j.first_seen_at)>state.prevVisit;
  var fit=expFit(j);
  var meta=['<b>'+esc(j.company)+'</b>', esc(j.location),
            '<span class="'+fit.cls+'">'+esc(fit.text)+'</span>'];
  var badge = m.applied?'<span class="badge">'+icon(I.check)+' Applied '+shortDate(j.applied_at)+'</span>'
    : isNew?'<span class="badge new">NEW</span>'
    : m.saved?'<span class="badge">Saved</span>'
    : m.reviewed?'<span class="badge">Reviewed</span>' : "";
  var scoreHtml = t==="unscored"
    ? 'Not scored'
    : tierLabel(t)+' ·<span class="n">'+j.match_score+'</span>';
  return (showRead?readLine():"")+
  '<li class="row tier-'+t+(isDone(j)?' done':'')+'" role="option" data-id="'+j.id+'" tabindex="-1"'+
      ' aria-selected="'+(state.selectedId===j.id)+'"'+
      ' aria-label="'+esc(clean(j.title))+'. '+esc(j.company)+', '+esc(j.location)+'. '+
      (t==="unscored"?"Not scored":("Match "+t+", "+j.match_score+" out of 100"))+'. Detected '+ago(j.first_seen_at)+'.">'+
    '<div class="r-title">'+esc(clean(j.title))+'</div>'+
    '<div class="r-score">'+scoreHtml+'</div>'+
    '<div class="r-meta">'+meta.join(" · ")+'</div>'+
    '<div class="r-side">'+
      (t==="unscored"?'<span class="r-note">Description unavailable</span>':"")+
      badge+
      '<span class="r-when num" style="font-size:11.5px;color:var(--text-muted)">'+ago(j.first_seen_at)+'</span>'+
      '<span class="r-acts">'+
        '<button class="iconbtn'+(m.saved?' on saved':'')+'" data-mark="saved" data-id="'+j.id+'" aria-label="Save" aria-pressed="'+(!!m.saved)+'">'+icon(I.star)+'</button>'+
        '<button class="iconbtn'+(m.reviewed?' on':'')+'" data-mark="reviewed" data-id="'+j.id+'" aria-label="Mark reviewed" aria-pressed="'+(!!m.reviewed)+'">'+icon(I.check)+'</button>'+
        '<button class="iconbtn'+(m.dismissed?' on':'')+'" data-mark="dismissed" data-id="'+j.id+'" aria-label="Not relevant" aria-pressed="'+(!!m.dismissed)+'">'+icon(I.x)+'</button>'+
        '<a class="iconbtn" href="'+esc(j.official_url)+'" target="_blank" rel="noopener" data-stop aria-label="Open official posting">'+icon(I.ext)+'</a>'+
      '</span>'+
    '</div></li>';
}
function readLine(){
  return '<li class="readline" role="separator" aria-label="Last visit, '+clock(state.prevVisit)+'">'+
    '<span>Last visit, '+clock(state.prevVisit)+'</span></li>';
}
function skeleton(){
  var out="";
  for(var i=0;i<6;i++) out+='<li class="sk"><div class="sk-b" style="width:'+(52+i*4)+'%"></div><div class="sk-b" style="width:38%"></div></li>';
  return out;
}
function emptyState(){
  var v=state.view, s=state.stats;
  if(state.page==="saved") return box("No saved opportunities","Press s on any opportunity to save it here.");
  if(state.page==="archive") return box("Nothing archived yet","Opportunities you mark reviewed or not relevant appear here.");
  if(state.q) return box('Nothing found for "'+esc(state.q)+'"',"No opportunities match this search.",
    '<button class="btn btn-secondary" data-act="clearq">Clear search</button>');
  if(v==="matched") return box("No highly matched opportunities right now",
    (s.match_medium||0)+" medium and "+(s.match_minimal||0)+" minimal matches are available in All.",
    '<button class="btn btn-secondary" data-view="all">View all opportunities</button>');
  if(v==="new") return box("Nothing new since your last visit",
    "ACE last pulled "+(state.lastPoll?ago(state.lastPoll):"recently")+". You are up to date.",
    '<button class="btn btn-secondary" data-view="all">View all opportunities</button>');
  if(v==="latest"){
    var l=state.sessions[0];
    var prior=state.sessions.filter(function(x){return x.qualifying_discovered>0;})[0];
    return box("Latest pull, "+(l?clock(l.started_at):"not recorded"),
      (l?(l.jobs_discovered+" opportunities found, none passed your filters."):"No pull recorded yet.")+
      (prior?(" The previous qualifying pull was "+dayName(prior.started_at).toLowerCase()+" at "+clock(prior.started_at)+" and added "+prior.qualifying_discovered+"."):""),
      (prior?'<button class="btn btn-secondary" data-session="'+prior.id+'">View that pull</button> ':'')+
      '<button class="btn btn-ghost" data-view="all">Back to all opportunities</button>');
  }
  return box("No opportunities","Nothing matches the current filters.",
    Object.keys(state.filters).length?'<button class="btn btn-secondary" data-act="clearfilters">Clear filters</button>':'');
}
function box(h,p,actions){
  return '<div class="empty"><h3>'+h+'</h3><p>'+p+'</p>'+(actions||"")+'</div>';
}
function queueList(){
  if(state.loading) return '<ul class="list">'+skeleton()+'</ul>';
  if(!state.items.length) return emptyState();
  var showReadAt = -1;
  if(state.sort==="newest" && state.prevVisit){
    for(var i=0;i<state.items.length;i++){
      if(new Date(state.items[i].first_seen_at) <= state.prevVisit){ showReadAt=i; break; }
    }
  }
  var tail = state.loadingMore
    ? '<li class="list-end">Loading more</li>'
    : state.hasMore
      ? '<li class="list-end">Showing '+state.items.length+' of '+state.total+'</li>'
      : '<li class="list-end">End of queue · '+state.items.length+' opportunit'+(state.items.length===1?'y':'ies')+'</li>';
  return '<ul class="list" id="list" role="listbox" aria-label="Opportunities" tabindex="0">'+
    state.items.map(function(j,i){ return jobRow(j, i===showReadAt); }).join("")+tail+'</ul>';
}
function queueHead(){

    '<div class="head-top"><h1 class="page-title">'+titles[state.page]+'</h1>'+

/* ---------------- render root ---------------- */
function render(keepScroll){
  var app=document.getElementById("app");
  var prior = keepScroll ? (document.querySelector(".list-scroll")||{}).scrollTop : null;
  var main;
  if(state.page==="feed") main=feedPage();
  else if(state.page==="resumes") main=resumesPage();
  else if(state.page==="skills") main=skillsPage();
  else if(state.page==="settings") main=settingsPage();
  else main='<div class="list-col">'+
      '<div class="topbar">'+
        '<button class="iconbtn" data-act="menu" aria-label="Menu">'+icon(I.menu)+'</button>'+
        '<span class="brand-name" style="font-size:13px">ACE</span></div>'+
      queueHead()+'<div class="list-scroll">'+queueList()+'</div></div>'+detailPane();
  app.innerHTML = sidebar()+main+
    (state.menuOpen?'<div class="scrim" data-act="closemenu"></div>':"");
  if(state.toast) app.insertAdjacentHTML("beforeend", state.toast);

  var scroller = document.querySelector(".list-scroll");
  if(scroller){
    if(prior!=null) scroller.scrollTop = prior;
    scroller.addEventListener("scroll", onListScroll, {passive:true});
  }
  var sel=document.querySelector('.row[aria-selected="true"]');
  if(sel && state.scrollTo){ sel.scrollIntoView({block:"nearest"}); state.scrollTo=false; }
}

function onListScroll(e){
  var el=e.currentTarget;
  if(el.scrollHeight - el.scrollTop - el.clientHeight < 600) loadJobs(true);
}

/* ---------------- interaction ---------------- */
function setPage(p){ state.page=p; state.selectedId=null; state.menuOpen=false; closePop();
  if(p==="queue"||p==="saved"||p==="archive") loadJobs(); else render(); }
function isJobPage(){ return ["queue","saved","archive"].indexOf(state.page)>=0; }
function setView(v){ goTo("queue", v); }
/* Changes page and view together and loads exactly once. Calling
   setPage then setView fired two overlapping requests, and the older
   one could land last, leaving the list disagreeing with the control. */
function goTo(page, view){
  state.page=page; state.menuOpen=false; state.selectedId=null; closePop();
  if(view){
    state.view=view;
    if(view==="new"||view==="latest") state.sort="newest";
    else if(view==="matched") state.sort="best_match";
  }
  if(isJobPage()) loadJobs(); else render();
}
function select(id, scroll){ state.selectedId=id; state.scrollTo=!!scroll;
  if(!isWide()) state.detailOpen=true; render(); }
function step(d){
  var ids=state.items.map(function(j){return j.id;});
  var i=ids.indexOf(state.selectedId);
  var n=Math.max(0,Math.min(ids.length-1,(i<0?0:i+d)));
  if(ids[n]!=null) select(ids[n], true);
}
function putMark(id, body){
  return fetch(API+"/api/marks/"+id, {
    method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
  }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
}
function applyMark(j, res){
  j.is_saved=res.is_saved; j.review_state=res.review_state; j.applied_at=res.applied_at;
}
function mark(id, key, advance){
  var j=jobById(id);
  if(!j){ showToast("That opportunity is no longer on screen"); render(); return; }
  var was=markOf(j)[key];
  var body = key==="saved" ? {saved:!was}
           : key==="applied" ? {applied:!was}
           : was ? {clear_review:true} : {review_state:key};
  var undoBody = key==="saved" ? {saved:was}
           : key==="applied" ? {applied:was}
           : was ? {review_state:key} : {clear_review:true};
  var label={saved:was?"Removed from saved":"Saved",
             reviewed:was?"Review cleared":"Marked reviewed",
             dismissed:was?"Restored":"Marked not relevant",
             applied:was?"Applied cleared":"Marked applied"}[key];

  putMark(id, body).then(function(res){
    applyMark(j, res);
    refreshMarkCounts();
    showToast(label, function(){
      putMark(id, undoBody).then(function(back){
        applyMark(j, back); refreshMarkCounts(); render();
      });
    });
    // On a page defined by a mark, undoing it should remove the row.
    if((state.page==="saved" && key==="saved" && was) ||
       (state.page==="archive" && (key==="reviewed"||key==="dismissed") && was)){
      state.items = state.items.filter(function(x){ return x.id!==id; });
      state.total = Math.max(0, state.total-1);
      if(state.selectedId===id) state.selectedId = state.items.length?state.items[0].id:null;
    }
    if(advance && key!=="saved" && key!=="applied" && !was) step(1); else render();
  }).catch(function(){ showToast("Could not save that change"); render(); });
}
function refreshMarkCounts(){
  return get("/api/marks").then(function(d){ state.markCounts=d; }).catch(function(){});
}
var toastTimer=null;
function showToast(msg, undo){
  state.toast='<div class="toast" role="status"><span>'+esc(msg)+'</span>'+
    '<button class="link-btn" data-act="undo">Undo</button></div>';
  state.undoFn=undo;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ state.toast=null; state.undoFn=null; render(); },4000);
}
function closePop(){ var p=document.querySelector(".pop"); if(p) p.remove(); }
function openPop(anchor, html){
  closePop();
  var d=document.createElement("div"); d.className="pop"; d.innerHTML=html;
  document.body.appendChild(d);
  var r=anchor.getBoundingClientRect(), w=d.offsetWidth, h=d.offsetHeight;
  var vw=window.innerWidth||document.documentElement.clientWidth;
  var vh=window.innerHeight||document.documentElement.clientHeight;
  d.style.left=Math.max(8,Math.min(vw-w-8, r.left))+"px";
  d.style.top=(r.bottom+6+h>vh? Math.max(8,r.top-h-6): r.bottom+6)+"px";
  return d;
}
function filterPop(anchor){
  var f=state.facets;
  function grp(title,list,param,type){
    if(!list||!list.length) return "";
    return '<div class="pop-group">'+title+'</div>'+list.slice(0,8).map(function(o){
      return '<button class="pop-opt" data-addfilter="'+param+'" data-value="'+esc(o.value)+'">'+
        esc(String(o.value).replace(/_/g," ").toLowerCase())+'<span class="n">'+o.count+'</span></button>';
    }).join("");
  }
  openPop(anchor,'<h4>Add a filter</h4><div class="pop-list">'+
    '<div class="pop-group">Quick</div>'+
    '<button class="pop-opt" data-addflag="verified_only">Description available</button>'+
    grp("Company",f.companies,"company")+grp("Source",f.sources,"source")+grp("Role family",f.families,"family")+
  '</div>');
}
function sortPop(anchor){
  var opts=[["best_match","Best match"],["newest","Newest"],["oldest","Oldest"],["new_grad_first","New grad first"]];
  openPop(anchor,'<h4>Sort by</h4><div class="pop-list">'+opts.map(function(o){
    return '<button class="pop-opt" data-sort="'+o[0]+'">'+o[1]+(state.sort===o[0]?' <span class="n">current</span>':'')+'</button>';
  }).join("")+'</div>');
}
function livePop(anchor){
  var l=state.sessions[0];
  openPop(anchor,'<h4>Discovery status</h4>'+
    '<p>Last pull '+(state.lastPoll?clock(state.lastPoll)+", "+ago(state.lastPoll):"not recorded")+'.</p>'+
    (l?'<p>'+l.jobs_discovered+' opportunities found, '+l.qualifying_discovered+' passed your filters.</p>':'')+
    '<p>'+state.sessions.length+' runs recorded.</p>');
}
function scorePop(anchor){
  openPop(anchor,'<h4>Match score</h4>'+
    '<p>How much of this posting’s stated requirements your active resume already evidences. Related skills count as a partial match.</p>'+
    '<p>It helps you decide what to read first. It does not predict whether you will be hired.</p>');
}

document.addEventListener("click", function(e){
  var pal=e.target.closest("[data-pal]");
  if(pal){ runPalette(parseInt(pal.dataset.pal,10)); return; }
  var t=e.target.closest("[data-nav],[data-view],[data-act],[data-mark],[data-step],[data-unfilter],[data-addfilter],[data-addflag],[data-sort],[data-session],[data-skillq],[data-settheme],[data-pal],.row");
  if(!t){ if(!e.target.closest(".pop")) closePop(); return; }
  if(e.target.closest("[data-stop]")) { e.stopPropagation(); return; }
  var d=t.dataset;

  if(d.nav){ setPage(d.nav); return; }
  if(d.view){ setView(d.view); return; }
  if(d.step){ e.stopPropagation(); step(parseInt(d.step,10)); return; }
  if(d.mark){ e.stopPropagation(); mark(parseInt(d.id,10), d.mark, false); return; }
  if(d.unfilter){ delete state.filters[d.unfilter]; loadShell().then(function(){ loadJobs(); }); return; }
  if(d.addfilter){ state.filters[d.addfilter+":"+d.value]={param:d.addfilter,value:d.value,type:"value",
      label:String(d.value).replace(/_/g," ").toLowerCase()}; closePop(); loadShell().then(function(){ loadJobs(); }); return; }
  if(d.addflag){ state.filters[d.addflag]={param:d.addflag,type:"flag",
      label:d.addflag==="early_career_only"?"Early career":"Description available"}; closePop(); loadShell().then(function(){ loadJobs(); }); return; }
  if(d.sort){ state.sort=d.sort; closePop(); loadJobs(); return; }
  if(d.session){ state.page="queue"; state.view="latest"; state.sort="newest";
    var sid=parseInt(d.session,10);
    var i=state.sessions.map(function(s){return s.id;}).indexOf(sid);
    if(i>0){ var picked=state.sessions[i]; state.sessions=[picked].concat(state.sessions.filter(function(s){return s.id!==sid;})); }
    loadJobs(); return; }
  if(d.skillq){ state.page="queue"; state.view="all"; state.q=d.skillq; loadJobs(); return; }
  if(d.settheme){ save("ace.theme",d.settheme); applyTheme(d.settheme); render(); return; }

  if(d.act){
    if(d.act==="toggleearly"){
      if(state.filters.early_career_only) delete state.filters.early_career_only;
      else state.filters.early_career_only={param:"early_career_only",type:"flag",label:"Early career",pinned:true};
      loadShell().then(function(){ loadJobs(); }); return; }
    if(d.act==="theme"){ cycleTheme(); return; }
    if(d.act==="filters"){ filterPop(t); return; }
    if(d.act==="sort"){ sortPop(t); return; }
    if(d.act==="live"){ livePop(t); return; }
    if(d.act==="scoreinfo"){ scorePop(t); return; }
    if(d.act==="clearfilters"){ state.filters={}; loadShell().then(function(){ loadJobs(); }); return; }
    if(d.act==="clearq"){ state.q=""; loadJobs(); return; }
    if(d.act==="closedetail"){ state.detailOpen=false; render(); return; }
    if(d.act==="undo"){ if(state.undoFn) state.undoFn(); state.toast=null; render(); return; }
    if(d.act==="menu"){ state.menuOpen=true; render(); return; }
    if(d.act==="closemenu"){ state.menuOpen=false; render(); return; }
    if(d.act==="upload"){ pickResume(); return; }
    if(d.act==="settings"){ setPage("settings"); return; }
    if(d.act==="palette"){ openPalette(); return; }
  }
  var row=e.target.closest(".row");
  if(row) select(parseInt(row.dataset.id,10), false);
});

document.addEventListener("input", function(e){
  if(e.target.id==="q"){
    state.q=e.target.value;
    clearTimeout(state.qt);
    state.qt=setTimeout(function(){ var c=document.getElementById("q"); var pos=c&&c.selectionStart;
      loadJobs().then(function(){ var n=document.getElementById("q"); if(n){ n.focus(); if(pos!=null) n.setSelectionRange(pos,pos);} }); },260);
  }
});

document.addEventListener("keydown", function(e){
  var typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if(e.key==="/" && !typing){ e.preventDefault(); var q=document.getElementById("q"); if(q) q.focus(); return; }
  if((e.metaKey||e.ctrlKey) && (e.key==="k"||e.key==="K")){ e.preventDefault(); openPalette(); return; }
  if(state.palHits){
    if(e.key==="ArrowDown"){ e.preventDefault(); state.palIndex=Math.min(state.palHits.length-1,state.palIndex+1); drawPalette(document.getElementById("pal-q").value); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); state.palIndex=Math.max(0,state.palIndex-1); drawPalette(document.getElementById("pal-q").value); return; }
    if(e.key==="Enter"){ e.preventDefault(); runPalette(state.palIndex); return; }
    if(e.key==="Escape"){ e.preventDefault(); closePalette(); return; }
  }
  if(typing){ if(e.key==="Escape"){ e.target.blur(); } return; }
  if(e.key==="Escape"){ if(state.menuOpen){ state.menuOpen=false; render(); return; }
    if(document.querySelector(".pop")) closePop();
    else if(state.detailOpen){ state.detailOpen=false; render(); } return; }
  if(!isJobPage()) return;
  var k=e.key;
  if(k==="ArrowDown"||k==="j"){ e.preventDefault(); step(1); }
  else if(k==="ArrowUp"||k==="k"){ e.preventDefault(); step(-1); }
  else if(k==="Enter"&&state.selectedId){ var j=state.items.filter(function(x){return x.id===state.selectedId;})[0];
    if(j) window.open(j.official_url,"_blank","noopener"); }
  else if(k==="s"&&state.selectedId){ mark(state.selectedId,"saved",false); }
  else if(k==="e"&&state.selectedId){ mark(state.selectedId,"reviewed",true); }
  else if(k==="x"&&state.selectedId){ mark(state.selectedId,"dismissed",true); }
  else if(k==="a"&&state.selectedId){ mark(state.selectedId,"applied",false); }
  else if(k>="1"&&k<="4"&&state.page==="queue"){ setView(["all","matched","new","latest"][parseInt(k,10)-1]); }
});

/* ---------------- resume upload ---------------- */
function pickResume(){
  var input=document.createElement("input");
  input.type="file";
  input.accept=".pdf,.docx,.txt";
  input.addEventListener("change", function(){
    var file=input.files && input.files[0];
    if(!file) return;
    state.uploading=true; render();
    var body=new FormData(); body.append("file", file);
    fetch(API+"/api/resume", {method:"POST", body:body}).then(function(r){
      return r.json().then(function(d){ if(!r.ok) throw new Error(d.detail||"upload failed"); return d; });
    }).then(function(d){
      state.uploading=false;
      showToast("Resume stored, "+d.jobs_scored+" jobs rescored, "+d.skills.length+" skills found");
      state.selectedId=null;
      loadShell().then(function(){ loadJobs(); });
    }).catch(function(err){
      state.uploading=false;
      showToast(String(err.message||"Could not read that file"));
      render();
    });
  });
  input.click();
}

/* ---------------- command palette ---------------- */
var PALETTE=[
  {label:"Go to Queue", run:function(){ setPage("queue"); }},
  {label:"Go to Feed", run:function(){ setPage("feed"); }},
  {label:"Go to Resumes", run:function(){ setPage("resumes"); }},
  {label:"Go to Skills", run:function(){ setPage("skills"); }},
  {label:"Go to Saved", run:function(){ setPage("saved"); }},
  {label:"Go to Archive", run:function(){ setPage("archive"); }},
  {label:"Show all opportunities", run:function(){ goTo("queue","all"); }},
  {label:"Show highly matched", run:function(){ goTo("queue","matched"); }},
  {label:"Show new since last visit", run:function(){ goTo("queue","new"); }},
  {label:"Show latest pull", run:function(){ goTo("queue","latest"); }},
  {label:"Toggle early career only", run:function(){
      if(state.filters.early_career_only) delete state.filters.early_career_only;
      else state.filters.early_career_only={param:"early_career_only",type:"flag",label:"Early career",pinned:true};
      goTo("queue"); }},
  {label:"Sort by best match", run:function(){ state.sort="best_match"; loadJobs(); }},
  {label:"Sort by newest", run:function(){ state.sort="newest"; loadJobs(); }},
  {label:"Clear all filters", run:function(){ state.filters={}; state.q=""; loadShell().then(function(){ loadJobs(); }); }},
  {label:"Upload resume", run:function(){ pickResume(); }},
  {label:"Switch theme", run:function(){ cycleTheme(); }},
  {label:"Open settings", run:function(){ setPage("settings"); }}
];
function openPalette(){
  closePalette();
  var el=document.createElement("div");
  el.className="palette-wrap";
  el.innerHTML='<div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">'+
    '<input id="pal-q" type="text" placeholder="Type a command" autocomplete="off" aria-label="Command">'+
    '<div class="palette-list" id="pal-list"></div></div>';
  document.body.appendChild(el);
  state.palIndex=0;
  drawPalette("");
  var q=document.getElementById("pal-q");
  q.focus();
  q.addEventListener("input", function(){ state.palIndex=0; drawPalette(q.value); });
  el.addEventListener("mousedown", function(e){ if(e.target===el) closePalette(); });
}
function paletteMatches(term){
  var t=(term||"").toLowerCase();
  return PALETTE.filter(function(c){ return c.label.toLowerCase().indexOf(t)>=0; });
}
function drawPalette(term){
  var list=document.getElementById("pal-list");
  if(!list) return;
  var hits=paletteMatches(term);
  state.palHits=hits;
  if(state.palIndex>=hits.length) state.palIndex=Math.max(0,hits.length-1);
  list.innerHTML = hits.length
    ? hits.map(function(c,i){
        return '<button class="pal-opt'+(i===state.palIndex?" on":"")+'" data-pal="'+i+'">'+esc(c.label)+'</button>';
      }).join("")
    : '<div class="pal-none">No matching command</div>';
}
function closePalette(){
  var el=document.querySelector(".palette-wrap");
  if(el) el.remove();
  state.palHits=null;
}
function runPalette(i){
  var hits=state.palHits||[];
  var c=hits[i];
  closePalette();
  if(c) c.run();
}

/* ---------------- theme ---------------- */
function cycleTheme(){
  var cur=load("ace.theme","dark");
  var next = cur==="dark"?"light":cur==="light"?"system":"dark";
  save("ace.theme",next); applyTheme(next);
  showToast("Theme: "+next); render();
}
function applyTheme(t){
  if(t==="system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
}

/* One-time lift of marks written before they were durable. Without
   this, moving them server-side would quietly discard whatever the user
   had already saved or archived in this browser. */
function migrateLocalMarks(){
  var old = load("ace.marks", null);
  if(!old || load("ace.marks.migrated", false)) return;
  var ids = Object.keys(old);
  if(!ids.length){ save("ace.marks.migrated", true); return; }
  Promise.all(ids.map(function(id){
    var m = old[id] || {};
    var body = {saved: !!m.saved};
    if(m.reviewed) body.review_state = "reviewed";
    else if(m.dismissed) body.review_state = "dismissed";
    return putMark(id, body).catch(function(){});
  })).then(function(){
    save("ace.marks.migrated", true);
    refreshMarkCounts().then(function(){ render(); });
  });
}

/* ---------------- boot ---------------- */
// ?theme=light|dark|system overrides the stored choice, so either theme
// can be opened directly without clearing storage.
var urlTheme = new URLSearchParams(location.search).get("theme");
var validTheme = urlTheme && ["light","dark","system"].indexOf(urlTheme)>=0;
if(validTheme) save("ace.theme", urlTheme);
// Applied directly rather than read back, so the override still works
// where localStorage is unavailable.
applyTheme(validTheme ? urlTheme : load("ace.theme","dark"));
migrateLocalMarks();
initVisit();
render();
loadShell().then(function(){ loadJobs(); });
setInterval(function(){ loadShell().then(function(){ if(state.page==="queue") render(); }); }, 120000);
</script>
