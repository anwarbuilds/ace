<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 26 L17 9 L26 26' fill='none' stroke='%23B292F0' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='17' cy='4.5' r='2.5' fill='%23E3BE5C'/%3E%3C/svg%3E">
<style>
/* ============================================================
   ACE tokens. Light on bare :root; dark redefines tokens only.
   Every value below was contrast-checked against its own ground.
   ============================================================ */
:root{
  --canvas:#FCFAFE; --surface-1:#FFFFFF; --surface-2:#F5F1FA; --raised:#FFFFFF;
  --hover:#EFE9F7; --selected:#F0E6FB;
  --border-subtle:#EAE3F3; --border:#DCD2EA; --border-strong:#B9A9D1;
  --text:#1A1226; --text-secondary:#544A66; --text-muted:#6B6083;
  --gold:#7A5D12; --gold-solid:#6B5110; --gold-rail:#A8801E; --gold-surface:#FBF2DA; --on-gold:#FFFFFF;
  --purple:#5B3A9E; --purple-rail:#7B52C9; --purple-surface:#F0E7FC; --on-purple:#FFFFFF;
  --success:#2C7A4E; --warning:#8F5F1C; --danger:#A63A3A; --info:#2F5C8F;
  --shadow-sm:0 1px 2px rgba(26,18,38,.06);
  --shadow-md:0 6px 18px rgba(26,18,38,.10);
  --shadow-lg:0 18px 48px rgba(26,18,38,.16);
  --backdrop:rgba(26,18,38,.36);
  --r-sm:4px; --r-md:7px; --r-lg:12px;
  --fast:90ms; --base:150ms; --slow:240ms;
  --ease-out:cubic-bezier(.2,0,0,1); --ease-in:cubic-bezier(.4,0,1,1);
  --ease-emph:cubic-bezier(.32,.72,0,1);
  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --side:236px; --gutter:28px;
}
:root:not([data-theme="light"]){
  --canvas:#0D0817; --surface-1:#141020; --surface-2:#1A1428; --raised:#221A33;
  --hover:#2A2040; --selected:#31234D;
  --border-subtle:#231B33; --border:#2F2545; --border-strong:#453763;
  --text:#F3EFFA; --text-secondary:#B9AFD0; --text-muted:#9086AA;
  --gold:#E3BE5C; --gold-solid:#E3BE5C; --gold-rail:#E3BE5C; --gold-surface:#241C0F; --on-gold:#0D0817;
  --purple:#B292F0; --purple-rail:#B292F0; --purple-surface:#2A1D45; --on-purple:#0D0817;
  --success:#5FB07F; --warning:#D9A055; --danger:#DE6B6B; --info:#6FA0DE;
  --shadow-sm:none;
  --shadow-md:0 6px 18px rgba(0,0,0,.55);
  --shadow-lg:0 18px 48px rgba(0,0,0,.7);
  --backdrop:rgba(6,3,12,.66);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --canvas:#FCFAFE; --surface-1:#FFFFFF; --surface-2:#F5F1FA; --raised:#FFFFFF;
    --hover:#EFE9F7; --selected:#F0E6FB;
    --border-subtle:#EAE3F3; --border:#DCD2EA; --border-strong:#B9A9D1;
    --text:#1A1226; --text-secondary:#544A66; --text-muted:#6B6083;
    --gold:#7A5D12; --gold-solid:#6B5110; --gold-rail:#A8801E; --gold-surface:#FBF2DA; --on-gold:#FFFFFF;
    --purple:#5B3A9E; --purple-rail:#7B52C9; --purple-surface:#F0E7FC; --on-purple:#FFFFFF;
    --success:#2C7A4E; --warning:#8F5F1C; --danger:#A63A3A; --info:#2F5C8F;
    --shadow-sm:0 1px 2px rgba(26,18,38,.06);
    --shadow-md:0 6px 18px rgba(26,18,38,.10);
    --shadow-lg:0 18px 48px rgba(26,18,38,.16);
    --backdrop:rgba(26,18,38,.36);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--canvas);color:var(--text);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:var(--r-sm)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-40px;z-index:100;background:var(--raised);padding:8px 12px;border-radius:var(--r-md);border:1px solid var(--border);transition:top var(--fast)}
.skip:focus{top:8px}

/* ===================== shell ===================== */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:100vh;height:100vh;height:100dvh}
.side,.main{min-height:0;min-width:0}

/* ---- sidebar: a quiet purple rail ---- */
.side{
  display:flex;flex-direction:column;padding:22px 12px 12px;
  background:var(--surface-1);border-right:1px solid var(--border-subtle);
}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 26px;user-select:none}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.18em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;
  border-radius:var(--r-md);color:var(--text-secondary);
  font-size:13.5px;font-weight:450;width:100%;text-align:left;
  position:relative;transition:background var(--fast) var(--ease-out),color var(--fast) var(--ease-out);
}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--selected);color:var(--text);font-weight:600}
.nav-item[aria-current="page"]::before{
  content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;
  border-radius:0 2px 2px 0;background:var(--purple-rail);
}
.nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-count{font-family:var(--mono);font-size:11.5px;color:var(--text-muted)}
.nav-rule{height:1px;background:var(--border-subtle);margin:14px 10px}
.nav-head{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);padding:0 10px 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:14px}

/* ---- main column ---- */
.main{display:flex;flex-direction:column;overflow:hidden}
.head{flex:none;padding:20px var(--gutter) 0}
.head-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.h1-count{font-family:var(--mono);font-size:14px;color:var(--text-muted);font-weight:500}
.spacer{flex:1}
.live{
  display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border-subtle);
  font-family:var(--mono);font-size:11.5px;color:var(--text-secondary);
  transition:background var(--fast),border-color var(--fast);
}
button.live:hover{background:var(--hover);border-color:var(--border)}
.live-stale{color:var(--warning);border-color:var(--warning)}
.dot{width:7px;height:7px;border-radius:999px;background:var(--success);flex:none}
.dot.stale{background:var(--warning)}
.since-btn{
  font-family:var(--mono);font-size:11.5px;color:var(--purple);
  padding:5px 10px;border-radius:999px;background:var(--purple-surface);
  transition:filter var(--fast);
}
.since-btn:hover{filter:brightness(1.08)}

/* ---- view tabs: big, horizontal, Netflix-ish ---- */
.tabs{display:flex;gap:26px;margin-top:18px;border-bottom:1px solid var(--border-subtle);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative;padding:0 0 12px;white-space:nowrap;
  font-size:14px;font-weight:500;color:var(--text-muted);
  display:flex;align-items:center;gap:7px;
  transition:color var(--fast) var(--ease-out);
}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);font-weight:600}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:var(--gold-rail);border-radius:2px 2px 0 0;
}
.tab-n{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);
  background:var(--surface-2);padding:1px 7px;border-radius:999px}
.tab[aria-selected="true"] .tab-n{background:var(--gold-surface);color:var(--gold)}

/* ---- control bar ---- */
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px var(--gutter) 12px}
.search{
  display:flex;align-items:center;gap:8px;height:32px;padding:0 11px;
  min-width:230px;flex:0 1 340px;
  background:var(--surface-2);border:1px solid var(--border-subtle);border-radius:var(--r-md);
  transition:border-color var(--fast),background var(--fast);
}
.search:focus-within{border-color:var(--purple);background:var(--surface-1)}
.search input{flex:1;min-width:0;background:none;border:none;font-size:13px;padding:0}
.search input::placeholder{color:var(--text-muted)}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);border:1px solid var(--border);border-radius:3px;padding:1px 5px}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
  border:1px solid var(--border-subtle);border-radius:var(--r-md);
  font-size:12.5px;color:var(--text-secondary);white-space:nowrap;
  transition:background var(--fast) var(--ease-out),border-color var(--fast),color var(--fast);
}
.chip:hover{background:var(--hover);border-color:var(--border);color:var(--text)}
.chip.on{background:var(--purple-surface);border-color:var(--purple);color:var(--purple);font-weight:600}
.chip.on-gold{background:var(--gold-surface);border-color:var(--gold-rail);color:var(--gold);font-weight:600}
.chip.excluded{background:transparent;border-color:var(--danger);color:var(--danger);
  text-decoration:line-through;text-decoration-thickness:1px}
.chip.excluded:hover{background:var(--danger);color:#fff;text-decoration:none}
.chip-n{font-family:var(--mono);font-size:11px;opacity:.8}
.chip-x{font-size:14px;line-height:1;opacity:.7;margin-right:-3px}
.chip-x:hover{opacity:1}
.ctl-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-left:4px}
.link-btn{font-size:12.5px;color:var(--text-muted);padding:4px 6px;border-radius:var(--r-sm);transition:color var(--fast),background var(--fast)}
.link-btn:hover{color:var(--text);background:var(--hover)}

/* ===================== the table ===================== */
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl thead th{
  position:sticky;top:0;z-index:5;background:var(--canvas);
  text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-muted);padding:0 12px 9px;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
.tbl thead th:first-child{padding-left:var(--gutter)}
.tbl thead th:last-child{padding-right:var(--gutter)}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--text)}
.th-on{color:var(--gold)}
.th-i{font-family:var(--mono);font-size:9px;vertical-align:super;margin-left:3px}
.row{border-bottom:1px solid var(--border-subtle);transition:background var(--fast) var(--ease-out)}
.row:hover{background:var(--hover)}
.row[aria-selected="true"]{background:var(--selected)}
.row.done{opacity:.45}
.row td{padding:11px 12px;vertical-align:middle;font-size:13px}
.row td:first-child{padding-left:var(--gutter)}
.row td:last-child{padding-right:var(--gutter)}
.c-rail{width:4px;padding:0!important}
.rail{width:3px;height:34px;border-radius:2px;background:transparent}
.rail.t-BIG_TECH{background:var(--gold-rail)}
.rail.t-TOP_TIER{background:var(--purple-rail)}
.rail.t-ESTABLISHED{background:var(--border-strong)}
.c-co{width:190px}
.co-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co-tier{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.t-BIG_TECH .co-tier,.tier-BIG_TECH{color:var(--gold)}
.t-TOP_TIER .co-tier,.tier-TOP_TIER{color:var(--purple)}
.t-ESTABLISHED .co-tier,.tier-ESTABLISHED{color:var(--text-muted)}
.c-title{min-width:0}
.j-title{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.j-title:hover{color:var(--purple)}
.j-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-loc{width:190px;color:var(--text-secondary);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-exp{width:140px;font-size:12.5px}
.exp-early{color:var(--success);font-weight:600}
.exp-known{color:var(--text-secondary)}
.exp-unknown{color:var(--text-muted);font-style:italic}
.c-match{width:112px;white-space:nowrap}
.m-tier{font-size:10px;font-weight:700;letter-spacing:.06em}
.m-n{font-family:var(--mono);font-size:14px;font-weight:600;margin-left:6px}
.m-high{color:var(--gold)} .m-medium{color:var(--text)} .m-minimal{color:var(--text-muted)}
.m-unscored{color:var(--text-muted);font-style:italic;font-size:11.5px}
.c-status{width:132px}
.c-when{width:86px;font-family:var(--mono);font-size:11.5px;color:var(--text-muted);white-space:nowrap}
.c-act{width:118px;text-align:right;white-space:nowrap}
.acts{display:inline-flex;gap:2px;opacity:0;transition:opacity var(--fast)}
.row:hover .acts,.row:focus-within .acts{opacity:1}
.iconbtn{
  width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-md);color:var(--text-muted);
  transition:background var(--fast),color var(--fast);
}
.iconbtn:hover{background:var(--border-subtle);color:var(--text)}
.iconbtn.on{color:var(--gold)}
.iconbtn.on svg{fill:currentColor}

/* badges */
.badge{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:999px;
  font-size:10.5px;font-weight:600;letter-spacing:.04em;white-space:nowrap;
  background:var(--surface-2);color:var(--text-secondary);
}
.badge.new{background:var(--purple-surface);color:var(--purple)}
.badge.move{background:var(--gold-surface);color:var(--gold)}
.badge.applied{background:var(--purple-surface);color:var(--purple)}
.badge.screening,.badge.interviewing{background:var(--gold-surface);color:var(--gold)}
.badge.offer,.badge.accepted{background:rgba(95,176,127,.16);color:var(--success)}
.badge.rejected,.badge.withdrawn,.badge.ghosted{background:rgba(222,107,107,.14);color:var(--danger)}
.badge.saved{background:var(--surface-2);color:var(--text-secondary)}

.readline{padding:0}
.readline td{padding:16px var(--gutter) 12px;border-bottom:1px solid var(--border-subtle)}
.readline span{
  display:inline-flex;align-items:center;gap:10px;width:100%;
  font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--purple);
}
.readline span::after{content:"";flex:1;height:1px;background:var(--border)}
.grouphead td{
  padding:22px var(--gutter) 8px;border-bottom:1px solid var(--border-subtle);
  background:var(--canvas);
}
.gh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.gh-t{font-size:14px;font-weight:700;letter-spacing:-.01em}
.gh-m{font-family:var(--mono);font-size:11.5px;color:var(--text-muted)}
.gh-none{font-size:12.5px;color:var(--text-muted);font-style:italic}
.tail{padding:22px var(--gutter) 40px;text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--text-muted)}

/* ===================== job detail page ===================== */
.jp{flex:1;overflow-y:auto}
.jp-in{max-width:1180px;padding:8px var(--gutter) 60px}
.jp-back{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-muted);padding:6px 8px;margin:0 0 14px -8px;border-radius:var(--r-md)}
.jp-back:hover{background:var(--hover);color:var(--text)}
.jp-tier{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px}
.jp-title{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.18;margin:0 0 10px;text-wrap:balance}
.jp-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:14px;color:var(--text-secondary);margin-bottom:22px}
.jp-co{font-weight:600;color:var(--text)}
.jp-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:26px;align-items:start}
.card{background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:16px}
.card.match{
  background:linear-gradient(135deg,var(--purple-surface),var(--surface-1) 72%);
  border-color:var(--border);
}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:0 0 12px}
.score-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.score-n{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1;letter-spacing:-.03em}
.score-meta{font-size:12.5px;color:var(--text-muted);margin-top:4px}
.meter{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;border-radius:999px;background:var(--gold-rail)}
.skills{display:flex;flex-wrap:wrap;gap:7px}
.sk{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--border-subtle);font-size:12.5px}
.sk.have{border-color:var(--success);color:var(--text)}
.sk.miss{background:transparent;color:var(--text-muted);border-style:dashed}
.rel{display:flex;flex-direction:column;gap:8px}
.rel-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.rel-via{font-size:12px;color:var(--text-muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:12.5px}
.kv dt{color:var(--text-muted);white-space:nowrap}
.kv dd{margin:0;font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.why{font-size:13px;color:var(--text-secondary);line-height:1.65}
.why b{color:var(--text);font-weight:600}
.acts-col{display:flex;flex-direction:column;gap:9px}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:4px}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;
  border-radius:var(--r-md);font-size:13px;font-weight:500;border:1px solid transparent;
  transition:background var(--fast),border-color var(--fast),color var(--fast),filter var(--fast);
}
.btn-primary{background:var(--gold-solid);color:var(--on-gold);font-weight:600;height:42px;font-size:14px}
.btn-primary:hover{filter:brightness(1.09)}
.btn-primary svg{transition:transform var(--fast)}
.btn-primary:hover svg{transform:translate(2px,-2px)}
.btn-secondary{background:var(--surface-2);border-color:var(--border);color:var(--text)}
.btn-secondary:hover{background:var(--hover)}
.btn-ghost{color:var(--text-secondary)}
.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-ghost.on{background:var(--purple-surface);color:var(--purple);font-weight:600}
.btn-sm{height:30px;padding:0 11px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.info{width:16px;height:16px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--border-strong);color:var(--text-muted);font-size:10px;font-weight:700}
.info:hover{color:var(--text);border-color:var(--text-muted)}

/* ===================== answer bank ===================== */
.ab{position:fixed;right:0;top:0;bottom:0;width:min(400px,92vw);z-index:95;
  background:var(--surface-1);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;animation:slidein var(--slow) var(--ease-emph)}

function load(k,d){ try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;} }

function tierOf(s){ if(s==null) return "unscored"; if(s>=HIGH) return "high"; if(s>=MED) return "medium"; return "minimal"; }

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){

  .replace(/\s*[—–]\s*/g,", ").replace(/\s+([,;:])/g,"$1").replace(/\s{2,}/g," ").trim(); }

  if(!iso) return "";

  if(d<60) return "just now";
  if(d<3600) return Math.floor(d/60)+"m";
  if(d<86400) return Math.floor(d/3600)+"h";
  if(d<86400*7) return Math.floor(d/86400)+"d";
  return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"});

function clock(d){ return new Date(d).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function shortDate(d){ return d?new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric"}):""; }
function dayName(d){
  var t=new Date(), y=new Date(Date.now()-86400000), x=new Date(d);

function isWide(){ return window.matchMedia("(min-width: 1025px)").matches; }

  return {t:"Not stated",c:"exp-unknown"};

function markOf(j){ return {saved:!!j.is_saved, reviewed:j.review_state==="reviewed",

// Every list the user can act on, not just the queue. Pulls renders the
// same rows from its own sessions, and acting on one used to report
// "no longer on screen" while it sat there in plain sight.
function jobById(id){
  for(var i=0;i<state.items.length;i++) if(state.items[i].id===id) return state.items[i];
  for(var s=0;s<state.sessions.length;s++){
    var js=state.sessions[s].jobs||[];
    for(var k=0;k<js.length;k++) if(js[k].id===id) return js[k];

  if(state.detailJob&&state.detailJob.id===id) return state.detailJob;
  if(state.heldRow&&state.heldRow.id===id) return state.heldRow;

/* ---------------- data ---------------- */
function params(extra){
  var p=new URLSearchParams();
  if(state.q) p.set("q",state.q);
  Object.keys(state.filters).forEach(function(k){
    var f=state.filters[k];
    if(f.type==="flag") p.set(f.param,"true"); else p.set(f.param,f.value);

  if(state.page==="applied"){ e.mark="applied"; e.sort="newest"; return e; }
  if(state.view==="matched") e.min_match=HIGH;
  if(state.view==="new"&&state.prevVisit){ e.since=state.prevVisit.toISOString(); e.sort="newest"; }
  if(state.view==="latest"){ var s=state.sessions[0]; if(s) e.session_id=s.id; e.sort="newest"; }
  return e;
}
function get(path,p){
  // no-store on both sides: these responses describe rows that change
  // under the reader, and a cached one is simply wrong.
  return fetch(API+path+(p&&p.toString()?"?"+p.toString():""),
               {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error(r.status); return r.json(); });
}
function loadJobs(append){
  if(append){ if(state.loadingMore||!state.hasMore) return Promise.resolve(); state.loadingMore=true; }
  else { state.offset=0; state.loading=true; state.items=[]; state.reqToken++; render(); }
  var token=state.reqToken;
  return get("/api/jobs",params(viewParams())).then(function(d){
    if(token!==state.reqToken) return;
    state.items=append?state.items.concat(d.items):d.items;
    // A row the user just acted on stays visible for this load even if
    // the sort would now place it out of reach.
    if(state.pinned && !append){
      var held=state.heldRow;
      if(held && !state.items.some(function(x){return x.id===held.id;})){
        state.items.unshift(held);
      }
    }
    state.offset=state.offset+d.items.length;
    state.hasMore=d.has_more; state.total=d.total;
    state.loading=false; state.loadingMore=false;
    if(state.selectedId&&!state.items.some(function(j){return j.id===state.selectedId;})) state.selectedId=null;
    render(append);
  }).catch(function(){
    if(token!==state.reqToken) return;
    state.loading=false; state.loadingMore=false; render();
  });
}
function loadShell(){
  return Promise.all([
    get("/api/stats",params()).then(function(d){ state.stats=d; state.lastPoll=d.last_poll_at; }),
    get("/api/sessions",new URLSearchParams({limit:"30",jobs_per_session:"6"})).then(function(d){
      state.sessions=d.sessions||[]; if(d.last_poll_at) state.lastPoll=d.last_poll_at; }),
    get("/api/facets",params(facetParams())).then(function(d){ state.facets=d; }),
    get("/api/resume").then(function(d){ state.resume=d.resume; state.gap=d.skills_gap||[]; }),
    get("/api/marks").then(function(d){ state.markCounts=d; }),
    get("/api/answers").then(function(d){ state.answers=d.items||[]; }),
    loadExternal(),
    refreshNewCount()
  ]).catch(function(){});
}
function refreshNewCount(){
  if(!state.prevVisit){ state.newSinceVisit=0; return Promise.resolve(); }
  return get("/api/jobs",params({since:state.prevVisit.toISOString(),limit:1}))
    .then(function(d){ state.newSinceVisit=d.total; }).catch(function(){});
}
function refreshMarkCounts(){ return get("/api/marks").then(function(d){ state.markCounts=d; }).catch(function(){}); }
function loadExternal(){
  return get("/api/applications/external")
    .then(function(d){ state.externalApps=d.items||[]; }).catch(function(){});
}
function reloadGap(){
  var p=new URLSearchParams();
  if(state.gapFamily) p.set("family",state.gapFamily);
  if(state.gapMin!=null) p.set("min_match",state.gapMin);
  return get("/api/resume",p).then(function(d){ state.resume=d.resume; state.gap=d.skills_gap||[]; render(); })
    .catch(function(){ render(); });
}

/* ---------------- marks ---------------- */
function putMark(id,body){
  return fetch(API+"/api/marks/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
}
function applyMark(j,res){
  j.is_saved=res.is_saved; j.review_state=res.review_state; j.applied_at=res.applied_at;
  j.application_status=res.application_status; j.status_changed_at=res.status_changed_at;
}
function mark(id,key,advance){
  var j=jobById(id);
  if(!j){ showToast("That opportunity is no longer on screen"); render(); return; }
  // Marking applied re-sorts the row to the bottom under the default
  // sort. Holding it in place until the next load means the click looks
  // like it did something instead of making the row disappear.
  if(key==="applied") state.pinned=id;
  var was=markOf(j)[key];
  var body = key==="saved"?{saved:!was} : key==="applied"?{applied:!was}
           : was?{clear_review:true}:{review_state:key};
  var undoBody = key==="saved"?{saved:was} : key==="applied"?{applied:was}
           : was?{review_state:key}:{clear_review:true};
  var label={saved:was?"Removed from saved":"Saved",
             reviewed:was?"Review cleared":"Marked reviewed",
             dismissed:was?"Restored":"Marked not relevant",
             applied:was?"Applied cleared":"Marked applied"}[key];
  putMark(id,body).then(function(res){
    applyMark(j,res); refreshMarkCounts();
    if(key==="applied") state.heldRow=j;
    showToast(label,function(){ putMark(id,undoBody).then(function(b){ applyMark(j,b); refreshMarkCounts(); render(); }); });
    var onMarkPage=(state.page==="saved"&&key==="saved"&&was)||
                   (state.page==="archive"&&(key==="reviewed"||key==="dismissed")&&was)||
                   (state.page==="applied"&&key==="applied"&&was);
    if(onMarkPage){
      state.items=state.items.filter(function(x){return x.id!==id;});
      state.total=Math.max(0,state.total-1);
    }
    if(advance&&key!=="saved"&&key!=="applied"&&!was) step(1); else render();
  }).catch(function(){ showToast("Could not save that change"); render(); });
}
function setStatus(id,status){
  var j=jobById(id); if(!j) return;
  var was=j.application_status;
  putMark(id,{application_status:status}).then(function(res){
    applyMark(j,res); refreshMarkCounts();
    showToast(STATUS_LABEL[status]+" recorded", function(){
      putMark(id, was?{application_status:was}:{applied:false}).then(function(b){
        applyMark(j,b); refreshMarkCounts(); render(); });
    });
    render();
  }).catch(function(){ showToast("Could not record that status"); render(); });
}

/* ---------------- pulls page ---------------- */
function pullsPage(){
  var groups=[], last=null;
  var anyPullJobs=state.sessions.some(function(s){ return (s.jobs||[]).length>0; });
  state.sessions.forEach(function(s){
    var d=dayName(s.started_at);
    if(d!==last){ groups.push({day:d,rows:[]}); last=d; }
    groups[groups.length-1].rows.push(s);
  });
  // A poll only writes a row when it discovers something, so the most
  // recent check is usually absent from the list. Showing it explicitly
  // is the difference between "ACE is idle" and "ACE looked and there
  // was nothing", which is the question this page exists to answer.
  var newest=state.sessions[0];
  var latestRow="";
  if(state.lastPoll && (!newest || new Date(state.lastPoll)>new Date(newest.started_at))){
    latestRow='<tr class="grouphead"><td colspan="9"><div class="gh">'+
      '<span class="gh-t">'+dayName(state.lastPoll)+'</span>'+
      '<span class="gh-m">'+clock(state.lastPoll)+' · checked, no new postings</span>'+
      '<span class="gh-none">most recent check, '+ago(state.lastPoll)+' ago</span>'+
    '</div></td></tr>';
  }
  var body = state.sessions.length ? latestRow+groups.map(function(g){
    return '<tr class="grouphead"><td colspan="9"><div class="gh">'+
        '<span class="gh-t">'+esc(g.day)+'</span>'+
        '<span class="gh-m">'+g.rows.length+' pull'+(g.rows.length===1?"":"s")+' · '+
        g.rows.reduce(function(a,b){return a+b.qualifying_discovered;},0)+' qualifying</span></div></td></tr>'+
      g.rows.map(function(s){
        var jobs=s.jobs||[], hidden=Math.max(0,s.qualifying_discovered-jobs.length);
        return '<tr class="grouphead"><td colspan="9"><div class="gh">'+
            '<span class="gh-t" style="font-size:13px;font-weight:600">'+clock(s.started_at)+'</span>'+
            '<span class="gh-m">'+s.jobs_discovered+' found · '+s.qualifying_discovered+' qualifying</span>'+
            (s.qualifying_discovered>0?'<button class="link-btn" data-session="'+s.id+'">Open in Queue</button>':'')+
            (s.qualifying_discovered===0?'<span class="gh-none">Nothing new passed your filters</span>':'')+
          '</div></td></tr>'+
          jobs.map(function(j){ return jobRow(j); }).join("")+
          (hidden>0?'<tr class="grouphead"><td colspan="9"><button class="link-btn" data-session="'+s.id+'">Show '+hidden+' more from this pull</button></td></tr>':'');
      }).join("");
  }).join("") : "";

  return '<div class="head">'+
    '<div class="head-row"><h1 class="h1">Pulls</h1>'+
      '<span class="h1-count">'+state.sessions.length+'</span>'+
      '<span class="spacer"></span>'+liveChip()+'</div>'+
    '<div class="controls"><p class="why" style="margin:0;max-width:70ch">'+
      'Every pull that discovered a posting, newest first, including the ones where nothing '+
      'passed your filters. A check that finds no new postings at all is not recorded as its '+
      'own row, so the most recent check is shown separately above.'+
    '</p></div></div>'+
    '<div class="scroll">'+(state.sessions.length
      // Column headings only earn their space once there is something
      // under them. Every pull being empty is common and normal.
      ? '<table class="tbl">'+(anyPullJobs?tableHead():"")+'<tbody>'+body+'</tbody></table>'+
        '<div class="tail">End of recorded pulls</div>'
      : '<div style="padding:0 var(--gutter)">'+box("No pulls recorded yet","ACE records a run once it has checked its sources.")+'</div>')+
    '</div>';
}

/* ---------------- answer bank ---------------- */
function copyAnswer(id, el){
  var a=state.answers.filter(function(x){return String(x.id)===String(id);})[0];
  if(!a||!a.value) return;
  function done(){
    if(!el) return;
    el.classList.add("done"); el.textContent="copied";
    setTimeout(function(){ el.classList.remove("done"); el.innerHTML=icon(I.copy,14); },1200);
  }
  function fallback(){
    // The async clipboard needs a secure context, which plain http on a
    // LAN address does not get. This path is the one that usually runs.
    var t=document.createElement("textarea");
    t.value=a.value; t.style.position="fixed"; t.style.opacity="0";
    document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); done(); }
    catch(e){ showToast("Could not copy"); }
    document.body.removeChild(t);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(a.value).then(done).catch(fallback);
  } else fallback();
}
function answerToggle(){
  if(state.answersOpen||state.page==="answers") return "";
  var filled=state.answers.filter(function(a){return a.value;}).length;
  if(!filled) return "";

    'title="Your saved answers">'+icon(I.copy,14)+'Answers</button>';
}

function collectAnswers(){
  return Array.prototype.map.call(document.querySelectorAll(".ans-edit"),function(row){
    return {label:row.querySelector(".ans-label").value,
            value:row.querySelector(".ans-value").value};
  }).filter(function(a){ return a.label.trim(); });
}
function saveAnswers(){
  fetch(API+"/api/answers",{method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({items:collectAnswers()})})
  .then(function(r){return r.json();})
  .then(function(){ return get("/api/answers"); })
  .then(function(d){ state.answers=d.items||[]; showToast("Answers saved"); render(); })
  .catch(function(){ showToast("Could not save"); render(); });
}

/* ---------------- render ---------------- */
function render(keepScroll){
  var app=document.getElementById("app");
  var prior=keepScroll?(document.querySelector(".scroll")||{}).scrollTop:null;
  var main;
  if(state.page==="job") main=jobPage();
  else if(state.page==="pulls") main=pullsPage();
  else if(state.page==="resumes") main=resumePage();
  else if(state.page==="skills") main=skillsPage();
  else if(state.page==="settings") main=settingsPage();
  else if(state.page==="answers") main=answersPage();
  else main=queuePage();

  app.innerHTML=sidebar()+
    '<div class="main">'+
      '<div class="topbar"><button class="iconbtn" data-act="menu" aria-label="Menu">'+icon(I.menu)+'</button>'+
      '<span class="brand-name" style="font-size:13px">ACE</span></div>'+
      main+'</div>'+
    (state.menuOpen?'<div class="scrim" data-act="closemenu"></div>':"")+
    answerToggle()+answerPanel()+
    (state.toast||"");

  var sc=document.querySelector(".scroll");
  if(sc){
    if(prior!=null) sc.scrollTop=prior;
    sc.addEventListener("scroll",onScroll,{passive:true});
  }
  var sel=document.querySelector('.row[aria-selected="true"]');
  if(sel&&state.scrollTo){ sel.scrollIntoView({block:"nearest"}); state.scrollTo=false; }
}
function onScroll(e){
  var el=e.currentTarget;
  if(state.page!=="pulls" && el.scrollHeight-el.scrollTop-el.clientHeight<700) loadJobs(true);
}

/* ---------------- navigation ---------------- */
function isJobList(){ return ["queue","saved","applied","archive"].indexOf(state.page)>=0; }
function goTo(page,view){
  state.pinned=null; state.heldRow=null;
  if(location.hash) location.hash="";
  state.page=page; state.menuOpen=false; state.selectedId=null; closePop();
  if(view){ state.view=view; if(view==="new"||view==="latest") state.sorts=["newest"]; }
  if(isJobList()) loadJobs(); else render();
}
function setPage(p){ goTo(p); }
function openJob(id, opts){
  var j=jobById(id);
  if(!(opts&&opts.fromHash)) state.returnTo=state.page;
  state.detailJob=j||null;
  state.page="job"; state.jobId=id; closePop();
  // The address bar has to carry the job, or opening the link in a new
  // tab lands on the queue and the href is a lie.
  if(location.hash!=="#job/"+id) location.hash="#job/"+id;
  render();
  if(!j){
    // Opened directly, without the list it came from.
    get("/api/jobs/"+id).then(function(d){
      if(state.page==="job"&&state.jobId===id){ state.detailJob=d; render(); }
    }).catch(function(){
      if(state.page==="job"&&state.jobId===id){

function routeFromHash(){

function step(d){
  var ids=state.items.map(function(j){return j.id;});
  var i=ids.indexOf(state.selectedId);
  var n=Math.max(0,Math.min(ids.length-1,(i<0?0:i+d)));
  if(ids[n]!=null){ state.selectedId=ids[n]; state.scrollTo=true; render(); }
}
function toggleSort(key){
  var i=state.sorts.indexOf(key);
  if(i>=0){
    state.sorts.splice(i,1);

    // Turning a sort on makes it the primary one, the way clicking a
    // column header does. Appending it instead put "Not applied first"
    // third, where it only broke ties and looked broken.
    state.sorts.unshift(key);
    if(state.sorts.length>3) state.sorts.pop();
  }
  loadJobs();

function toggleExclude(name){

// Shown per group before searching. The corpus carries 169 companies,
// so a flat list is unreadable and a truncated one hides the company
// you are actually looking for. Search is what makes the rest reachable.
var FILTER_PREVIEW=8;
function filterPopBody(){
  var f=state.facets, q=(state.filterQuery||"").trim().toLowerCase();
  function hit(o){ return !q||String(o.value).toLowerCase().indexOf(q)>=0; }
  // A count of what is hidden is not an instruction. Written as a line
  // of text it reads as something to tap, and tapping did nothing, so
  // it is a button that opens the group it is counting.
  function tail(key,n){
    return n>0
      ? '<button class="pop-more" data-expand="'+key+'">Show '+n+' more</button>'
      : "";
  }
  function cut(key,list){
    if(q||state.filterOpen[key]) return list.slice(0,300);
    return list.slice(0,FILTER_PREVIEW);
  }
  function rest(key,list){
    return (q||state.filterOpen[key])?0:list.length-FILTER_PREVIEW;
  }
  // Sources and families are stored as SOFTWARE_ENGINEERING and read
  // better folded down. Company names are already written the way their
  // company writes them, so folding those loses real information.
  function grp(t,list,param,fold){
    list=(list||[]).filter(hit);
    if(!list.length) return "";
    return '<div class="pop-group">'+t+'</div>'+
      cut(param,list).map(function(o){
        var label=fold?String(o.value).replace(/_/g," ").toLowerCase():String(o.value);
        return '<button class="pop-opt" data-addfilter="'+param+'" data-value="'+esc(o.value)+'">'+
          esc(label)+'<span class="n">'+o.count+'</span></button>';}).join("")+
      tail(param,rest(param,list));
  }
  // Companies get both directions. "Only Amazon" and "everything except
  // Amazon" are both worth wanting, often at the same time.
  var ex=(f.companies||[]).filter(hit);
  var exGroup=ex.length
    ? '<div class="pop-group">Hide a company</div>'+
      cut("exclude",ex).map(function(o){
        var off=state.excluded.indexOf(o.value)>=0;
        return '<button class="pop-opt'+(off?" on":"")+'" data-exclude="'+esc(o.value)+'">'+
          icon(I.minus,13)+esc(o.value)+'<span class="n">'+o.count+'</span></button>';}).join("")+
      tail("exclude",rest("exclude",ex))
    : "";
  var body=(q?"":'<div class="pop-group">Quick</div>'+
      '<button class="pop-opt" data-addflag="verified_only">Description available</button>')+
    grp("Only this company",f.companies,"company",false)+exGroup+
    grp("Source",f.sources,"source",true)+grp("Role family",f.families,"family",true);
  return body||'<div class="pop-note">Nothing matches that.</div>';
}
function filterPop(a){
  state.filterQuery=""; state.filterOpen={};
  var d=openPop(a,'<h4>Add a filter</h4>'+
    '<input class="pop-search" id="filter-q" placeholder="Search companies and sources" '+
      'autocomplete="off" aria-label="Search filters">'+
    '<div class="pop-list">'+filterPopBody()+'</div>');
  var inp=d.querySelector("#filter-q");
  inp.addEventListener("input",function(){
    state.filterQuery=inp.value;
    var list=d.querySelector(".pop-list");
    // Only the list is redrawn, so the caret stays where it was typed.
    if(list) list.innerHTML=filterPopBody();
  });
  inp.focus();
}
function livePop(a){
  var l=state.sessions[0], stale=isStale();
  openPop(a,'<h4>'+(stale?"ACE is not updating":"Discovery status")+'</h4>'+

    (stale
      ?'<p>ACE polls every few minutes, so a gap this long means the scheduler has stopped. Everything already found is still here.</p>'+
       '<p>On the machine running ACE: <b>docker compose ps</b>, then <b>docker compose up -d scheduler</b>.</p>'
      :(l?'<p>Most recent pull that found anything: '+l.jobs_discovered+' found, '+
          l.qualifying_discovered+' passed your filters.</p>':'')+
       '<p>'+state.sessions.length+' pulls recorded. A check that finds nothing new is not '+

/* ---------------- application import ---------------- */
function pickApplications(){
  var input=document.createElement("input");
  input.type="file"; input.accept=".csv,.tsv,.txt,.xlsx,.xlsm";
  input.addEventListener("change",function(){
    var file=input.files&&input.files[0]; if(!file) return;
    var body=new FormData(); body.append("file",file);
    showToast("Reading "+file.name); render();
    fetch(API+"/api/applications/preview",{method:"POST",body:body}).then(function(r){
      return r.json().then(function(d){ if(!r.ok) throw new Error(d.detail||"Could not read that file"); return d; });
    }).then(function(d){
      state.toast=null; state.importData=d; state.importChoice={};
      d.rows.forEach(function(r){ if(r.status==="matched") state.importChoice[r.row_number]=r.job_id; });
      renderImport();
    }).catch(function(e){ showToast(String(e.message||"Could not read that file")); render(); });
  });
  input.click();
}
function closeImport(){ var el=document.querySelector(".sheet-wrap"); if(el) el.remove(); state.importData=null; }
function importCount(){ return Object.keys(state.importChoice||{}).filter(function(k){return state.importChoice[k];}).length; }
function unplaceableRows(){
  var d=state.importData; if(!d) return [];
  // Every row that will not become a job mark, so that no application
  // can fall between the two buckets and be dropped. An ambiguous row
  // belongs here until a posting is chosen for it, and a row with no
  // title is still an application worth keeping.
  return d.rows.filter(function(r){
    if(!r.company) return false;
    if(r.status==="ambiguous") return !state.importChoice[r.row_number];
    return r.status==="unmatched"||r.status==="unusable";
  });
}
function importLabel(){
  var n=importCount(), ext=state.keepExternal?unplaceableRows().length:0;
  return ext?("Import "+n+" and keep "+ext):("Import "+n);
}
function renderImport(){
  var d=state.importData; if(!d) return;
  var ex=document.querySelector(".sheet-wrap"); if(ex) ex.remove();
  var c=d.counts||{};
  var unplaceable=unplaceableRows().length;
  var rows=d.rows.map(function(r){
    var chosen=state.importChoice[r.row_number];
    var pick="";
    if(r.status==="ambiguous"){
      pick='<div class="imp-pick"><select data-improw="'+r.row_number+'">'+
        '<option value="">Keep as history, '+r.candidates.length+' possible matches</option>'+
        r.candidates.map(function(cd){
          // Location first: these options are often identical apart
          // from where they are.
          return '<option value="'+cd.job_id+'"'+(String(chosen)===String(cd.job_id)?" selected":"")+'>'+
            (cd.location?esc(cd.location)+' \u00b7 ':'')+esc(clean(cd.title))+'</option>';}).join("")+'</select></div>';
    }
    var note=r.status==="matched"?("Matched by "+esc(r.method))
      :r.status==="ambiguous"?"Several postings fit. Choose one, or keep it as history."
      :r.status==="unusable"?"Needs a role title or a link."
      :"No stored posting matches this.";
    return '<div class="imp"><span class="imp-tag imp-'+r.status+'">'+r.status+'</span>'+
      '<div><b>'+esc(r.company||"Unknown")+'</b>, '+esc(clean(r.title)||"untitled")+
        '<div class="imp-sub">'+note+'</div></div>'+
      '<span class="imp-r">'+(r.applied_on||"no date")+
        (r.application_status?'<br>'+esc(STATUS_LABEL[r.application_status]||r.application_status):'')+'</span>'+
      pick+'</div>';
  }).join("");
  var el=document.createElement("div"); el.className="sheet-wrap";
  el.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Import applications">'+
    '<div class="sheet-head"><h3>Import applications</h3>'+
      '<div class="sum"><span><b>'+(c.matched||0)+'</b> matched</span>'+
        '<span><b>'+(c.ambiguous||0)+'</b> need a choice</span>'+
        '<span><b>'+(c.unmatched||0)+'</b> not found</span>'+
        (c.unusable?'<span><b>'+c.unusable+'</b> incomplete</span>':'')+
        '<span>of <b>'+d.total+'</b> rows</span></div>'+
      '<p class="imp-sub">Nothing is recorded until you confirm. A status column is read if your sheet has one, '+
        'and re-uploading an updated sheet moves existing rows forward rather than duplicating them.</p>'+
      (unplaceable>0
        ? '<p class="imp-sub" style="margin-top:7px">'+unplaceable+
          ' will be kept as history rather than attached to a posting. ACE only stores postings it has seen since it '+
          'started watching'+(state.stats.corpus_started_at?" on "+shortDate(state.stats.corpus_started_at):"")+
          ', so anything applied to before that, or since closed, has nothing to attach to. '+
          'A row where several postings fit is kept the same way until you choose one.</p>'
        : '')+
      '</div>'+
    '<div class="sheet-body">'+rows+'</div>'+
    '<div class="sheet-foot">'+
      '<button class="btn btn-primary" data-act="doimport">'+importLabel()+'</button>'+
      (unplaceable>0
        ? '<label class="imp-keep"><input type="checkbox" id="keep-ext"'+(state.keepExternal?" checked":"")+'>'+
          'Also keep the <span class="imp-keep-n">'+unplaceable+'</span> ACE could not place, as history</label>'
        : '')+
      '<button class="btn btn-ghost" data-act="closeimport">Cancel</button></div></div>';
  document.body.appendChild(el);
  el.addEventListener("mousedown",function(e){ if(e.target===el) closeImport(); });
  // Choosing a posting moves a row from the history bucket into the
  // matched one, so both tallies have to be redrawn together or the
  // dialog claims it will keep a row it is about to attach.
  function syncImportTotals(){
    var b=el.querySelector('[data-act="doimport"]'); if(b) b.textContent=importLabel();
    var n=el.querySelector(".imp-keep-n"); if(n) n.textContent=String(unplaceableRows().length);
  }
  el.addEventListener("change",function(e){
    if(e.target.id==="keep-ext"){
      state.keepExternal=e.target.checked; syncImportTotals(); return;
    }
    var sel=e.target.closest("[data-improw]"); if(!sel) return;
    state.importChoice[sel.dataset.improw]=sel.value?parseInt(sel.value,10):null;
    syncImportTotals();
  });
}
function runImport(){
  var d=state.importData; if(!d) return;
  var byRow={}; d.rows.forEach(function(r){ byRow[r.row_number]=r; });
  var decisions=Object.keys(state.importChoice).filter(function(k){return state.importChoice[k];})
    .map(function(k){ var r=byRow[k]||{};
      return {job_id:state.importChoice[k], applied_on:r.applied_on||null,
              status:r.application_status||null}; });
  var external=state.keepExternal?unplaceableRows().map(function(r){
    return {company:r.company, title:r.title, applied_on:r.applied_on||null,
            status:r.application_status||null, url:null};
  }):[];
  if(!decisions.length&&!external.length){ showToast("Nothing selected to import"); render(); return; }
  fetch(API+"/api/applications/import",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({decisions:decisions,external:external})})
  .then(function(r){return r.json();}).then(function(res){
    closeImport();
    showToast("Recorded "+res.marked+" applications"+
      (res.recorded?" and kept "+res.recorded+" from your history":""));
    // Land on Applied rather than staying on the Queue. Newly applied
    // jobs sink under the default sort, so from the Queue an import
    // looks like rows vanishing rather than statuses updating, and the
    // user reasonably reads that as nothing having happened.
    refreshMarkCounts()
      .then(loadExternal)
      .then(loadShell)
      .then(function(){ goTo("applied"); });
  }).catch(function(){ showToast("Import failed"); render(); });
}

    if(d.act==="clearall"){ state.filters={}; state.tiers=[]; state.excluded=[]; state.q="";
      loadShell().then(function(){ loadJobs(); }); return; }
    if(d.act==="shownew"){ state.sorts=["newest"]; goTo("queue","all"); return; }
    if(d.act==="back"){ goTo(state.returnTo||"queue"); return; }
    if(d.act==="openanswers"){ state.answersOpen=true; render(); return; }
    if(d.act==="closeanswers"){ state.answersOpen=false; render(); return; }
    if(d.act==="saveanswers"){ saveAnswers(); return; }
    if(d.act==="addrow"){
      var form=document.getElementById("ansform");
      if(form){
        var div=document.createElement("div");
        div.className="ans-edit";
        div.innerHTML='<input type="text" class="ans-label" placeholder="Question" aria-label="Question">'+
          '<textarea class="ans-value" placeholder="Your answer" aria-label="Answer"></textarea>'+
          '<button class="iconbtn" data-act="delrow" aria-label="Remove this question">'+icon(I.x)+'</button>';
        form.appendChild(div);
        div.querySelector(".ans-label").focus();
      }
      return; }
    if(d.act==="delrow"){ var r=t.closest(".ans-edit"); if(r) r.remove(); return; }
    if(d.act==="menu"){ state.menuOpen=true; render(); return; }
    if(d.act==="closemenu"){ state.menuOpen=false; render(); return; }
    if(d.act==="undo"){ if(state.undoFn) state.undoFn(); state.toast=null; render(); return; }
    if(d.act==="upload"){ pickResume(); return; }
    if(d.act==="importapps"){ pickApplications(); return; }
    if(d.act==="doimport"){ runImport(); return; }
    if(d.act==="closeimport"){ closeImport(); return; }
  }
  var row=e.target.closest(".row");
  if(row&&row.dataset.id){ openJob(parseInt(row.dataset.id,10)); }
});

document.addEventListener("input",function(e){
  if(e.target.id==="q"){
    state.q=e.target.value;
    clearTimeout(state.qt);
    state.qt=setTimeout(function(){
      var c=document.getElementById("q"), pos=c&&c.selectionStart;
      loadJobs().then(function(){
        var n=document.getElementById("q");
        if(n){ n.focus(); if(pos!=null) n.setSelectionRange(pos,pos); }
      });
    },260);
  }
});

document.addEventListener("keydown",function(e){
  var typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if((e.metaKey||e.ctrlKey)&&(e.key==="k"||e.key==="K")){ e.preventDefault(); openPalette(); return; }
  if(state.palHits){
    if(e.key==="ArrowDown"){ e.preventDefault(); state.palIndex=Math.min(state.palHits.length-1,state.palIndex+1); drawPalette(document.getElementById("pal-q").value); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); state.palIndex=Math.max(0,state.palIndex-1); drawPalette(document.getElementById("pal-q").value); return; }
    if(e.key==="Enter"){ e.preventDefault(); runPalette(state.palIndex); return; }
    if(e.key==="Escape"){ e.preventDefault(); closePalette(); return; }
  }
  if(e.key==="/"&&!typing){ e.preventDefault(); var q=document.getElementById("q"); if(q) q.focus(); return; }
  if(typing){ if(e.key==="Escape") e.target.blur(); return; }
  if(e.key==="Escape"){
    if(state.answersOpen){ state.answersOpen=false; render(); return; }
    if(state.importData){ closeImport(); return; }
    if(state.menuOpen){ state.menuOpen=false; render(); return; }
    if(document.querySelector(".pop")){ closePop(); return; }
    if(state.page==="job"){ goTo(state.returnTo||"queue"); return; }
    return;
  }
  if(state.page==="job"&&state.detailJob){
    var j=state.detailJob;
    if(e.key==="Enter"){ window.open(j.official_url,"_blank","noopener"); }
    else if(e.key==="s"){ mark(j.id,"saved",false); }
    return;
  }
  if(!isJobList()) return;
  var k=e.key;
  if(k==="ArrowDown"||k==="j"){ e.preventDefault(); step(1); }
  else if(k==="ArrowUp"||k==="k"){ e.preventDefault(); step(-1); }
  else if(k==="Enter"&&state.selectedId){ openJob(state.selectedId); }
  else if(k==="o"&&state.selectedId){ var jj=jobById(state.selectedId); if(jj) window.open(jj.official_url,"_blank","noopener"); }
  else if(k==="s"&&state.selectedId){ mark(state.selectedId,"saved",false); }
  else if(k==="e"&&state.selectedId){ mark(state.selectedId,"reviewed",true); }
  else if(k==="x"&&state.selectedId){ mark(state.selectedId,"dismissed",true); }
  else if(k==="a"&&state.selectedId){ mark(state.selectedId,"applied",false); }
  else if(k>="1"&&k<="4"&&state.page==="queue"){ goTo("queue",["all","matched","new","latest"][parseInt(k,10)-1]); }
});

/* ---------------- theme ---------------- */
function cycleTheme(){
  var cur=load("ace.theme","dark");
  var next=cur==="dark"?"light":cur==="light"?"system":"dark";
  save("ace.theme",next); applyTheme(next); showToast("Theme: "+next); render();
}
function applyTheme(t){
  if(t==="system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
}

/* ---------------- boot ---------------- */
var urlTheme=new URLSearchParams(location.search).get("theme");
var validTheme=urlTheme&&["light","dark","system"].indexOf(urlTheme)>=0;
if(validTheme) save("ace.theme",urlTheme);
applyTheme(validTheme?urlTheme:load("ace.theme","dark"));
initVisit();
render();
window.addEventListener("hashchange",function(){
  if(!routeFromHash() && state.page==="job") goTo(state.returnTo||"queue");
});
loadShell().then(function(){
  // A direct link opens its job straight away; the list still loads
  // behind it so Back has somewhere to return to.
  var direct=routeFromHash();
  return loadJobs().then(function(){
    if(direct) routeFromHash();
  });
});
setInterval(function(){ loadShell().then(function(){ if(isJobList()) render(); }); },120000);
</script>
